<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper texture filter -->
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
    
    <!-- Subtle vignette effect -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#F5EDD8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DFC8;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Parchment background -->
  <rect width="500" height="500" fill="#F5EDD8" filter="url(#paper-texture)"/>
  <rect width="500" height="500" fill="url(#vignette)" opacity="0.4"/>
  
  <!-- Vitruvian Man Framing -->
  <!-- Outer circle -->
  <circle cx="250" cy="240" r="200" fill="none" stroke="#8B7355" stroke-width="2.5"/>
  
  <!-- Square/rectangle inscribed inside -->
  <rect x="100" y="90" width="300" height="300" fill="none" stroke="#8B7355" stroke-width="2.5"/>
  
  <!-- Horizontal and vertical frame lines -->
  <line x1="100" y1="240" x2="400" y2="240" stroke="#8B7355" stroke-width="2"/>
  <line x1="250" y1="90" x2="250" y2="390" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Wizard Hat Group -->
  <g id="wizard-hat">
    <!-- Hat cone - tall and dramatic -->
    <polygon points="250,60 190,170 310,170" fill="#1B3B8E" stroke="#0f1f4e" stroke-width="2.5"/>
    
    <!-- Hat brim - wide flat ellipse -->
    <ellipse cx="250" cy="170" rx="95" ry="28" fill="#1B3B8E" stroke="#0f1f4e" stroke-width="2.5"/>
    
    <!-- Stars on hat - proper 5-point stars -->
    <g fill="#F4C430" stroke="none">
      <!-- Top star on cone -->
      <g transform="translate(250, 85)">
        <polygon points="0,-8 2.4,-2.4 8,-2.4 3,2.4 4.8,8 0,4.8 -4.8,8 -3,2.4 -8,-2.4 -2.4,-2.4"/>
      </g>
      
      <!-- Left stars on cone -->
      <g transform="translate(210, 120)">
        <polygon points="0,-7 2.1,-2.1 7,-2.1 2.6,2.1 4.2,7 0,4.2 -4.2,7 -2.6,2.1 -7,-2.1 -2.1,-2.1"/>
      </g>
      
      <g transform="translate(200, 160)">
        <polygon points="0,-6 1.8,-1.8 6,-1.8 2.2,1.8 3.6,6 0,3.6 -3.6,6 -2.2,1.8 -6,-1.8 -1.8,-1.8"/>
      </g>
      
      <!-- Right stars on cone -->
      <g transform="translate(290, 120)">
        <polygon points="0,-7 2.1,-2.1 7,-2.1 2.6,2.1 4.2,7 0,4.2 -4.2,7 -2.6,2.1 -7,-2.1 -2.1,-2.1"/>
      </g>
      
      <g transform="translate(300, 160)">
        <polygon points="0,-6 1.8,-1.8 6,-1.8 2.2,1.8 3.6,6 0,3.6 -3.6,6 -2.2,1.8 -6,-1.8 -1.8,-1.8"/>
      </g>
      
      <!-- Moons on hat (crescent using two-circle overlap) -->
      <!-- Left moon on brim -->
      <g transform="translate(220, 155)">
        <circle cx="0" cy="0" r="6" fill="#F4C430"/>
        <circle cx="3.5" cy="0" r="6" fill="#1B3B8E"/>
      </g>
      
      <!-- Right moon on brim -->
      <g transform="translate(280, 155)">
        <circle cx="0" cy="0" r="6" fill="#F4C430"/>
        <circle cx="3.5" cy="0" r="6" fill="#1B3B8E"/>
      </g>
    </g>
  </g>

  <!-- Robot Head (TV Screen) Group -->
  <g id="robot-head">
    <!-- Head body/frame - brown -->
    <rect x="150" y="190" width="200" height="170" rx="20" fill="#A0826D" stroke="#6B5D52" stroke-width="2.5"/>
    
    <!-- Side bezels for depth -->
    <rect x="150" y="190" width="15" height="170" rx="20" fill="#8B7355" opacity="0.7"/>
    <rect x="335" y="190" width="15" height="170" rx="20" fill="#8B7355" opacity="0.7"/>
    
    <!-- Screen bezel frame - darker brown with dimension -->
    <rect x="165" y="210" width="170" height="135" rx="15" fill="#8B7355" stroke="#6B5D52" stroke-width="2"/>
    
    <!-- Bezel inner shadow for depth -->
    <rect x="167" y="212" width="166" height="131" rx="13" fill="none" stroke="#5C4033" stroke-width="1" opacity="0.5"/>
    
    <!-- Screen display - bright green -->
    <rect x="178" y="223" width="144" height="110" rx="10" fill="#5FBB46" stroke="#4A9532" stroke-width="1.5"/>
    
    <!-- Screen scanlines/pattern detail -->
    <g fill="#7FCC6F" opacity="0.5">
      <rect x="190" y="238" width="120" height="6" rx="1"/>
      <rect x="190" y="260" width="110" height="5" rx="1"/>
      <rect x="190" y="280" width="115" height="5" rx="1"/>
      <rect x="190" y="300" width="100" height="6" rx="1"/>
    </g>
    
    <!-- Screen shine/highlight - bright reflection -->
    <ellipse cx="195" cy="238" rx="28" ry="18" fill="white" opacity="0.25"/>
    <ellipse cx="200" cy="235" rx="15" ry="10" fill="white" opacity="0.35"/>
    
    <!-- Antenna/controls on side of head -->
    <g fill="none" stroke="#6B5D52" stroke-width="2">
      <rect x="148" y="220" width="8" height="20" rx="4" fill="#8B7355" stroke="#6B5D52" stroke-width="1.5"/>
      <rect x="344" y="220" width="8" height="20" rx="4" fill="#8B7355" stroke="#6B5D52" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Upper Left Arm (Upper limb - Vitruvian pose) -->
  <g id="upper-left-arm">
    <!-- Mechanical upper arm segment -->
    <rect x="65" y="255" width="85" height="28" rx="14" fill="#2C2420" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Elbow joint detail -->
    <circle cx="65" cy="269" r="12" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    
    <!-- Forearm segment -->
    <rect x="35" y="265" width="35" height="25" rx="12" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    
    <!-- Hand/glove -->
    <circle cx="30" cy="277" r="18" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2"/>
    
    <!-- Mickey-style glove fingers - upper hand -->
    <g fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2">
      <!-- Thumb -->
      <ellipse cx="20" cy="265" rx="7" ry="10" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <!-- Fingers spread -->
      <ellipse cx="12" cy="250" rx="7" ry="11" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="25" cy="240" rx="7" ry="11" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="40" cy="245" rx="7" ry="11" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
    </g>
    
    <!-- Wrist cuff detail -->
    <rect x="30" y="295" width="20" height="8" rx="3" fill="#2C2420" stroke="#1a1a1a" stroke-width="1"/>
  </g>

  <!-- Upper Right Arm (Upper limb - Vitruvian pose) -->
  <g id="upper-right-arm">
    <!-- Mechanical upper arm segment -->
    <rect x="350" y="255" width="85" height="28" rx="14" fill="#2C2420" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Elbow joint detail -->
    <circle cx="435" cy="269" r="12" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    
    <!-- Forearm segment -->
    <rect x="430" y="265" width="35" height="25" rx="12" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    
    <!-- Hand/glove -->
    <circle cx="470" cy="277" r="18" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2"/>
    
    <!-- Mickey-style glove fingers - upper hand -->
    <g fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2">
      <!-- Thumb -->
      <ellipse cx="480" cy="265" rx="7" ry="10" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <!-- Fingers spread -->
      <ellipse cx="488" cy="250" rx="7" ry="11" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="475" cy="240" rx="7" ry="11" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="460" cy="245" rx="7" ry="11" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
    </g>
    
    <!-- Wrist cuff detail -->
    <rect x="450" y="295" width="20" height="8" rx="3" fill="#2C2420" stroke="#1a1a1a" stroke-width="1"/>
  </g>

  <!-- Lower Left Arm (Lower limb - Vitruvian pose) -->
  <g id="lower-left-arm">
    <!-- Upper segment of lower arm -->
    <rect x="80" y="345" width="80" height="26" rx="13" fill="#2C2420" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Elbow joint -->
    <circle cx="80" cy="358" r="11" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    
    <!-- Forearm -->
    <rect x="50" y="356" width="35" height="23" rx="11" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    
    <!-- Hand -->
    <circle cx="45" cy="367" r="16" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2"/>
    
    <!-- Glove fingers - lower hand -->
    <g fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2">
      <ellipse cx="37" cy="352" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="30" cy="368" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="45" cy="382" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="60" cy="375" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
    </g>
    
    <!-- Wrist cuff -->
    <rect x="45" y="383" width="18" height="7" rx="3" fill="#2C2420" stroke="#1a1a1a" stroke-width="1"/>
  </g>

  <!-- Lower Right Arm (Lower limb - Vitruvian pose) -->
  <g id="lower-right-arm">
    <!-- Upper segment of lower arm -->
    <rect x="340" y="345" width="80" height="26" rx="13" fill="#2C2420" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Elbow joint -->
    <circle cx="420" cy="358" r="11" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    
    <!-- Forearm -->
    <rect x="415" y="356" width="35" height="23" rx="11" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    
    <!-- Hand -->
    <circle cx="455" cy="367" r="16" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2"/>
    
    <!-- Glove fingers - lower hand -->
    <g fill="#F5DEB3" stroke="#D4AF8F" stroke-width="2">
      <ellipse cx="463" cy="352" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="470" cy="368" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="455" cy="382" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
      <ellipse cx="440" cy="375" rx="6" ry="9" fill="#F5DEB3" stroke="#D4AF8F" stroke-width="1.5"/>
    </g>
    
    <!-- Wrist cuff -->
    <rect x="437" y="383" width="18" height="7" rx="3" fill="#2C2420" stroke="#1a1a1a" stroke-width="1"/>
  </g>

  <!-- Robot Body -->
  <g id="robot-body">
    <!-- Main body/torso -->
    <rect x="165" y="365" width="170" height="100" rx="12" fill="#A0826D" stroke="#6B5D52" stroke-width="2.5"/>
    
    <!-- Body shading/depth -->
    <rect x="165" y="365" width="15" height="100" rx="12" fill="#8B7355" opacity="0.6"/>
    
    <!-- Chest panel detail -->
    <rect x="185" y="380" width="130" height="65" rx="8" fill="#8B7355" stroke="#6B5D52" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Rivets/bolts on chest -->
    <circle cx="200" cy="395" r="3" fill="#6B5D52" opacity="0.6"/>
    <circle cx="235" cy="395" r="3" fill="#6B5D52" opacity="0.6"/>
    <circle cx="270" cy="395" r="3" fill="#6B5D52" opacity="0.6"/>
    <circle cx="305" cy="395" r="3" fill="#6B5D52" opacity="0.6"/>
    
    <!-- Central button - large and prominent -->
    <circle cx="250" cy="420" r="12" fill="#D4AF37" stroke="#B8860B" stroke-width="2"/>
    <circle cx="250" cy="420" r="8" fill="#F4C430" opacity="0.8"/>
    
    <!-- Button highlight -->
    <ellipse cx="246" cy="417" rx="4" ry="3" fill="white" opacity="0.4"/>
  </g>

  <!-- Left Foot (Steampunk boot) -->
  <g id="left-foot">
    <!-- Ankle joint -->
    <rect x="175" y="465" width="40" height="18" rx="9" fill="#8B7355" stroke="#6B5D52" stroke-width="1.5"/>
    
    <!-- Foot/boot - chunky and solid -->
    <rect x="160" y="483" width="70" height="40" rx="10" fill="#5C4033" stroke="#3E2723" stroke-width="2.5"/>
    
    <!-- Boot shading/depth -->
    <rect x="160" y="483" width="70" height="12" rx="8" fill="#3E2723" opacity="0.4"/>
    
    <!-- Toe segments for steampunk look -->
    <g fill="#6B5D52" stroke="#3E2723" stroke-width="1">
      <rect x="168" y="495" width="14" height="20" rx="4"/>
      <rect x="190" y="495" width="14" height="20" rx="4"/>
      <rect x="212" y="495" width="14" height="20" rx="4"/>
    </g>
    
    <!-- Sole detail -->
    <rect x="160" y="520" width="70" height="4" fill="#3E2723"/>
  </g>

  <!-- Right Foot (Steampunk boot) -->
  <g id="right-foot">
    <!-- Ankle joint -->
    <rect x="285" y="465" width="40" height="18" rx="9" fill="#8B7355" stroke="#6B5D52" stroke-width="1.5"/>
    
    <!-- Foot/boot - chunky and solid -->
    <rect x="270" y="483" width="70" height="40" rx="10" fill="#5C4033" stroke="#3E2723" stroke-width="2.5"/>
    
    <!-- Boot shading/depth -->
    <rect x="270" y="483" width="70" height="12" rx="8" fill="#3E2723" opacity="0.4"/>
    
    <!-- Toe segments for steampunk look -->
    <g fill="#6B5D52" stroke="#3E2723" stroke-width="1">
      <rect x="278" y="495" width="14" height="20" rx="4"/>
      <rect x="300" y="495" width="14" height="20" rx="4"/>
      <rect x="322" y="495" width="14" height="20" rx="4"/>
    </g>
    
    <!-- Sole detail -->
    <rect x="270" y="520" width="70" height="4" fill="#3E2723"/>
  </g>
</svg>