<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wizard Hat Gradient -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3B7D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E2D6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#141C42;stop-opacity:1" />
    </linearGradient>
    
    <!-- TV Screen Gradient -->
    <radialGradient id="screenGlow" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#6FD856;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4BA932;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6B1A;stop-opacity:1" />
    </radialGradient>
    
    <!-- Robot Body Gradient -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B8B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8A08A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8F7B5D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Vitruvian circle (subtle) -->
  <circle cx="200" cy="250" r="190" fill="none" stroke="#9B7355" stroke-width="2" opacity="0.15"/>

  <!-- Background Vitruvian square (subtle) -->
  <rect x="45" y="95" width="310" height="310" fill="none" stroke="#9B7355" stroke-width="1.5" opacity="0.15"/>

  <!-- Crosshair lines (very subtle) -->
  <line x1="200" y1="95" x2="200" y2="405" stroke="#9B7355" stroke-width="1" opacity="0.12"/>
  <line x1="45" y1="250" x2="355" y2="250" stroke="#9B7355" stroke-width="1" opacity="0.12"/>

  <!-- ===== WIZARD HAT ===== -->
  
  <!-- Tall pointed cone (main hat) -->
  <path d="M 200 10 L 280 100 L 120 100 Z" fill="url(#hatGradient)" stroke="#0A1028" stroke-width="2.5"/>
  
  <!-- Hat brim (very wide ellipse) -->
  <ellipse cx="200" cy="102" rx="110" ry="28" fill="#1E2D6B" stroke="#0A1028" stroke-width="2.5"/>
  
  <!-- Hat brim bottom edge (3D depth) -->
  <ellipse cx="200" cy="108" rx="108" ry="8" fill="#141C42" stroke="none" opacity="0.6"/>

  <!-- Large yellow STARS on hat (6-8 points, 10-12px radius) -->
  <!-- Top center star (large) -->
  <g transform="translate(200, 35)" fill="#F4D455" stroke="none">
    <polygon points="0,-10 2.5,-3 9,-2.5 4,2 6,8.5 0,4.5 -6,8.5 -4,2 -9,-2.5 -2.5,-3"/>
  </g>
  
  <!-- Upper left star -->
  <g transform="translate(155, 65)" fill="#F4D455" stroke="none">
    <polygon points="0,-8 2,-2.5 7.5,-2 3.5,1.5 5,6 0,2.5 -5,6 -3.5,1.5 -7.5,-2 -2,-2.5"/>
  </g>
  
  <!-- Upper right star -->
  <g transform="translate(245, 65)" fill="#F4D455" stroke="none">
    <polygon points="0,-8 2,-2.5 7.5,-2 3.5,1.5 5,6 0,2.5 -5,6 -3.5,1.5 -7.5,-2 -2,-2.5"/>
  </g>
  
  <!-- Left side star -->
  <g transform="translate(140, 90)" fill="#F4D455" stroke="none">
    <polygon points="0,-7 1.8,-2 7,-1.5 3,1.5 4.5,5.5 0,2 -4.5,5.5 -3,1.5 -7,-1.5 -1.8,-2"/>
  </g>
  
  <!-- Right side star -->
  <g transform="translate(260, 90)" fill="#F4D455" stroke="none">
    <polygon points="0,-7 1.8,-2 7,-1.5 3,1.5 4.5,5.5 0,2 -4.5,5.5 -3,1.5 -7,-1.5 -1.8,-2"/>
  </g>

  <!-- Large yellow CRESCENT MOONS on hat -->
  <!-- Top crescent -->
  <g fill="#F4D455" stroke="none">
    <path d="M 200 45 Q 215 40 225 55 Q 205 50 200 45 Z" opacity="0.95"/>
  </g>
  
  <!-- Left crescent -->
  <g fill="#F4D455" stroke="none">
    <path d="M 155 85 Q 140 75 155 70 Q 160 80 155 85 Z" opacity="0.95"/>
  </g>
  
  <!-- Right crescent -->
  <g fill="#F4D455" stroke="none">
    <path d="M 245 85 Q 260 75 245 70 Q 240 80 245 85 Z" opacity="0.95"/>
  </g>

  <!-- ===== TV MONITOR HEAD ===== -->
  
  <!-- Monitor outer casing (rich dark brown) -->
  <rect x="110" y="110" width="180" height="160" rx="12" fill="#7A5C3A" stroke="#4A3420" stroke-width="3"/>
  
  <!-- Monitor side shading (3D depth) -->
  <rect x="110" y="115" width="12" height="150" fill="#4A3420" opacity="0.5"/>
  <rect x="278" y="115" width="12" height="150" fill="#2C1810" opacity="0.7"/>

  <!-- Monitor inner dark border -->
  <rect x="125" y="125" width="150" height="130" rx="6" fill="none" stroke="#3C2010" stroke-width="3"/>

  <!-- TV Screen (bright green with gradient) -->
  <rect x="132" y="132" width="136" height="116" rx="4" fill="url(#screenGlow)" stroke="#2C1A0A" stroke-width="2"/>

  <!-- Large white screen reflection (upper left) -->
  <ellipse cx="160" cy="155" rx="32" ry="26" fill="white" opacity="0.42"/>
  
  <!-- Secondary subtle reflection (lower right) -->
  <ellipse cx="235" cy="225" rx="18" ry="12" fill="white" opacity="0.18"/>

  <!-- Control knob/button (center below screen) -->
  <circle cx="200" cy="260" r="8" fill="#C9A876" stroke="#5C4030" stroke-width="2"/>
  <circle cx="200" cy="260" r="5" fill="#8B7355" opacity="0.6"/>

  <!-- ===== ROBOT BODY ===== -->
  
  <!-- Main torso (medium brown) -->
  <rect x="115" y="270" width="170" height="140" rx="10" fill="url(#bodyGradient)" stroke="#6B5344" stroke-width="2.5"/>
  
  <!-- Torso side shading (3D depth) -->
  <rect x="115" y="275" width="12" height="130" fill="#5C4030" opacity="0.4"/>
  <rect x="283" y="275" width="12" height="130" fill="#4A3420" opacity="0.6"/>

  <!-- Belly button (circular detail with inner shading) -->
  <circle cx="200" cy="345" r="10" fill="#C0954A" stroke="#5C3A1A" stroke-width="1.5"/>
  <circle cx="200" cy="345" r="6" fill="#8B6B3A" opacity="0.7"/>

  <!-- Panel detail line across torso -->
  <line x1="130" y1="310" x2="270" y2="310" stroke="#5C4030" stroke-width="2" opacity="0.5"/>

  <!-- ===== LEGS ===== -->
  
  <!-- Left leg -->
  <rect x="155" y="405" width="24" height="70" fill="#9B8B6B" stroke="#6B5344" stroke-width="1.5"/>
  
  <!-- Left foot (blocky brown boot) -->
  <rect x="140" y="470" width="54" height="25" rx="4" fill="#5C4030" stroke="#3C2A1A" stroke-width="2.5"/>
  <rect x="147" y="475" width="40" height="6" fill="#3C2010" opacity="0.7"/>

  <!-- Right leg -->
  <rect x="221" y="405" width="24" height="70" fill="#9B8B6B" stroke="#6B5344" stroke-width="1.5"/>
  
  <!-- Right foot (blocky brown boot) -->
  <rect x="206" y="470" width="54" height="25" rx="4" fill="#5C4030" stroke="#3C2A1A" stroke-width="2.5"/>
  <rect x="213" y="475" width="40" height="6" fill="#3C2010" opacity="0.7"/>

  <!-- ===== ARMS (4 TOTAL - Vitruvian Man style) ===== -->
  
  <!-- UPPER LEFT ARM -->
  <line x1="115" y1="295" x2="30" y2="180" stroke="#5C4030" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- LOWER LEFT ARM -->
  <line x1="115" y1="335" x2="25" y2="435" stroke="#5C4030" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- UPPER RIGHT ARM -->
  <line x1="285" y1="295" x2="370" y2="180" stroke="#5C4030" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- LOWER RIGHT ARM -->
  <line x1="285" y1="335" x2="375" y2="435" stroke="#5C4030" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== WHITE CARTOON GLOVES / HANDS ===== -->
  
  <!-- UPPER LEFT HAND -->
  <!-- Palm (white ellipse) -->
  <ellipse cx="30" cy="180" rx="22" ry="28" fill="white" stroke="#2C2C2C" stroke-width="2.5"/>
  
  <!-- Fingers on upper left hand (sausage shapes) -->
  <g>
    <!-- Finger 1 (upper) -->
    <ellipse cx="15" cy="160" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 2 (middle-upper) -->
    <ellipse cx="8" cy="180" rx="6" ry="13" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 3 (middle-lower) -->
    <ellipse cx="12" cy="205" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 4 (lower) -->
    <ellipse cx="35" cy="215" rx="6" ry="11" fill="white" stroke="#2C2C2C" stroke-width="2"/>
  </g>

  <!-- LOWER LEFT HAND -->
  <!-- Palm (white ellipse) -->
  <ellipse cx="25" cy="435" rx="22" ry="28" fill="white" stroke="#2C2C2C" stroke-width="2.5"/>
  
  <!-- Fingers on lower left hand -->
  <g>
    <!-- Finger 1 (upper) -->
    <ellipse cx="5" cy="412" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 2 (middle-upper) -->
    <ellipse cx="0" cy="432" rx="6" ry="13" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 3 (middle-lower) -->
    <ellipse cx="8" cy="457" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 4 (lower-side) -->
    <ellipse cx="32" cy="462" rx="6" ry="11" fill="white" stroke="#2C2C2C" stroke-width="2"/>
  </g>

  <!-- UPPER RIGHT HAND -->
  <!-- Palm (white ellipse) -->
  <ellipse cx="370" cy="180" rx="22" ry="28" fill="white" stroke="#2C2C2C" stroke-width="2.5"/>
  
  <!-- Fingers on upper right hand -->
  <g>
    <!-- Finger 1 (upper) -->
    <ellipse cx="385" cy="160" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 2 (middle-upper) -->
    <ellipse cx="392" cy="180" rx="6" ry="13" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 3 (middle-lower) -->
    <ellipse cx="388" cy="205" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 4 (lower) -->
    <ellipse cx="365" cy="215" rx="6" ry="11" fill="white" stroke="#2C2C2C" stroke-width="2"/>
  </g>

  <!-- LOWER RIGHT HAND -->
  <!-- Palm (white ellipse) -->
  <ellipse cx="375" cy="435" rx="22" ry="28" fill="white" stroke="#2C2C2C" stroke-width="2.5"/>
  
  <!-- Fingers on lower right hand -->
  <g>
    <!-- Finger 1 (upper) -->
    <ellipse cx="395" cy="412" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 2 (middle-upper) -->
    <ellipse cx="400" cy="432" rx="6" ry="13" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 3 (middle-lower) -->
    <ellipse cx="392" cy="457" rx="6" ry="12" fill="white" stroke="#2C2C2C" stroke-width="2"/>
    <!-- Finger 4 (lower-side) -->
    <ellipse cx="368" cy="462" rx="6" ry="11" fill="white" stroke="#2C2C2C" stroke-width="2"/>
  </g>
</svg>