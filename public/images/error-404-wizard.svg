<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -120 1300 1200" width="1300" height="1200" preserveAspectRatio="xMidYMid meet">
  <defs>
  </defs>

  <!-- Parchment background -->
  <rect x="-150" y="-120" width="1600" height="1320" fill="#E8DCC8"/>
  <!-- Aged texture speckles/dots -->
  <g fill="#8B7050" opacity="0.12">
    <circle cx="75" cy="100" r="4"/><circle cx="140" cy="55" r="3"/><circle cx="240" cy="85" r="3.5"/>
    <circle cx="340" cy="38" r="2.5"/><circle cx="470" cy="75" r="4"/><circle cx="590" cy="48" r="3"/>
    <circle cx="710" cy="92" r="3.5"/><circle cx="840" cy="65" r="2.5"/><circle cx="915" cy="125" r="4"/>
    <circle cx="55" cy="295" r="3.5"/><circle cx="935" cy="240" r="2.5"/><circle cx="92" cy="490" r="4"/>
    <circle cx="945" cy="440" r="3.5"/><circle cx="62" cy="690" r="2.5"/><circle cx="950" cy="670" r="4"/>
    <circle cx="112" cy="840" r="3.5"/><circle cx="872" cy="892" r="2.5"/><circle cx="390" cy="945" r="4"/>
    <circle cx="590" cy="965" r="3.5"/><circle cx="195" cy="955" r="2.5"/><circle cx="744" cy="934" r="3.5"/>
    <circle cx="295" cy="175" r="2.5"/><circle cx="694" cy="195" r="3.5"/><circle cx="495" cy="142" r="2.5"/>
    <circle cx="174" cy="744" r="2.5"/><circle cx="814" cy="594" r="3.5"/><circle cx="444" cy="795" r="2.5"/>
    <circle cx="20" cy="180" r="3"/><circle cx="980" cy="380" r="3"/><circle cx="500" cy="900" r="3.5"/>
  </g>

  <!-- Vitruvian circles -->
  <circle cx="500" cy="530" r="395" fill="none" stroke="#7B3B3B" stroke-width="6.5" opacity="1.0"/>
  <circle cx="500" cy="530" r="290" fill="none" stroke="#7B3B3B" stroke-width="4.5" opacity="0.85"/>
  <!-- Vitruvian square -->
  <rect x="105" y="265" width="790" height="530" fill="none" stroke="#7B3B3B" stroke-width="6.5" opacity="0.9"/>
  <!-- Cross lines (subtle) -->
  <line x1="500" y1="135" x2="500" y2="925" stroke="#7B3B3B" stroke-width="2.5" opacity="0.35"/>
  <line x1="105" y1="530" x2="895" y2="530" stroke="#7B3B3B" stroke-width="2.5" opacity="0.35"/>

  <!-- ===== ROBOT LEGS & FEET ===== -->
  <!-- Left upper leg -->
  <rect x="350" y="790" width="75" height="95" rx="10" fill="#8B7355" stroke="#3D2510" stroke-width="4"/>
  <rect x="358" y="798" width="55" height="12" rx="4" fill="#A88050" stroke="#3D2510" stroke-width="1.5"/>
  <!-- Left lower leg -->
  <rect x="355" y="876" width="65" height="40" rx="7" fill="#6B5030" stroke="#3D2510" stroke-width="3"/>
  <!-- Left foot (chunky boot) -->
  <rect x="315" y="908" width="118" height="65" rx="16" fill="#7A5A38" stroke="#2A1508" stroke-width="4.5"/>
  <rect x="325" y="916" width="88" height="14" rx="5" fill="#9A7248" stroke="#3D2510" stroke-width="1.5"/>
  <rect x="315" y="950" width="118" height="23" rx="10" fill="#4A3A20" stroke="#2A1508" stroke-width="1.5"/>
  <!-- Left foot sole -->
  <ellipse cx="375" cy="973" rx="52" ry="9" fill="#2A1508" opacity="0.35"/>

  <!-- Right upper leg -->
  <rect x="575" y="790" width="75" height="95" rx="10" fill="#8B7355" stroke="#3D2510" stroke-width="4"/>
  <rect x="583" y="798" width="55" height="12" rx="4" fill="#A88050" stroke="#3D2510" stroke-width="1.5"/>
  <!-- Right lower leg -->
  <rect x="580" y="876" width="65" height="40" rx="7" fill="#6B5030" stroke="#3D2510" stroke-width="3"/>
  <!-- Right foot (chunky boot) -->
  <rect x="567" y="908" width="118" height="65" rx="16" fill="#7A5A38" stroke="#2A1508" stroke-width="4.5"/>
  <rect x="577" y="916" width="88" height="14" rx="5" fill="#9A7248" stroke="#3D2510" stroke-width="1.5"/>
  <rect x="567" y="950" width="118" height="23" rx="10" fill="#4A3A20" stroke="#2A1508" stroke-width="1.5"/>
  <!-- Right foot sole -->
  <ellipse cx="625" cy="973" rx="52" ry="9" fill="#2A1508" opacity="0.35"/>

  <!-- ===== ROBOT BODY (torso) ===== -->
  <rect x="305" y="605" width="390" height="205" rx="28" fill="#B8845A" stroke="#4A2A10" stroke-width="5.5"/>
  <rect x="314" y="614" width="372" height="12" rx="6" fill="#D4A878" stroke="#5A3A18" stroke-width="1.5"/>
  <!-- Belly panel with ridge -->
  <rect x="345" y="644" width="310" height="128" rx="14" fill="#8B6844" stroke="#2A1508" stroke-width="4"/>
  <rect x="353" y="652" width="295" height="16" rx="5" fill="#B08860" stroke="#3D2510" stroke-width="1.5"/>
  <!-- Lower belly ridge -->
  <rect x="353" y="735" width="295" height="25" rx="8" fill="#5C4030" stroke="#2A1508" stroke-width="1.5"/>
  <!-- Gold circular button -->
  <circle cx="500" cy="718" r="36" fill="#3D2510" stroke="#2A1508" stroke-width="2.5"/>
  <circle cx="500" cy="718" r="28" fill="#D4A000" stroke="#8A6810" stroke-width="3.5"/>
  <circle cx="489" cy="707" r="9" fill="#F5E070" opacity="0.6"/>
  <!-- Body corner rivets -->
  <circle cx="327" cy="626" r="9" fill="#7A5A38" stroke="#2A1508" stroke-width="2.5"/>
  <circle cx="673" cy="626" r="9" fill="#7A5A38" stroke="#2A1508" stroke-width="2.5"/>
  <circle cx="327" cy="785" r="9" fill="#7A5A38" stroke="#2A1508" stroke-width="2.5"/>
  <circle cx="673" cy="785" r="9" fill="#7A5A38" stroke="#2A1508" stroke-width="2.5"/>

  <!-- ===== SCREEN/HEAD FRAME ===== -->
  <!-- Head frame outer -->
  <rect x="278" y="350" width="444" height="280" rx="28" fill="#B8845A" stroke="#4A2A10" stroke-width="6"/>
  <!-- Frame top highlight -->
  <rect x="288" y="358" width="424" height="18" rx="12" fill="#D4A878" stroke="#5A3A18" stroke-width="1.5"/>
  <!-- Screen area (dark border) -->
  <rect x="310" y="376" width="380" height="224" rx="14" fill="#1A3808" stroke="#0E2404" stroke-width="4"/>
  <!-- Green CRT screen -->
  <rect x="318" y="384" width="364" height="208" rx="10" fill="#6BA528"/>
  <!-- Screen reflection/highlights - cloud-like blobs as in reference -->
  <ellipse cx="400" cy="430" rx="95" ry="58" fill="#B8D450" opacity="0.6"/>
  <ellipse cx="390" cy="418" rx="60" ry="36" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="450" cy="445" rx="70" ry="40" fill="#C5E060" opacity="0.45"/>
  <ellipse cx="405" cy="435" rx="42" ry="26" fill="#FFFFFF" opacity="0.25"/>
  <!-- Diagonal glare streak (like reference) -->
  <path d="M 330 392 Q 395 480 324 572" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.18" fill="none"/>
  <!-- Screen lower dark zone -->
  <rect x="318" y="540" width="364" height="52" rx="10" fill="#4A7015" opacity="0.65"/>
  <!-- Screen scan lines (subtle) -->
  <line x1="318" y1="420" x2="682" y2="420" stroke="#1A3808" stroke-width="1" opacity="0.25"/>
  <line x1="318" y1="450" x2="682" y2="450" stroke="#1A3808" stroke-width="1" opacity="0.25"/>
  <line x1="318" y1="480" x2="682" y2="480" stroke="#1A3808" stroke-width="1" opacity="0.25"/>
  <line x1="318" y1="510" x2="682" y2="510" stroke="#1A3808" stroke-width="1" opacity="0.25"/>

  <!-- ===== ROBOT ARMS (extended HORIZONTALLY as in Vitruvian Man reference) ===== -->

  <!-- LEFT UPPER ARM (extending horizontally to the left, ~9 o'clock) -->
  <g transform="rotate(0, 305, 530)">
    <rect x="-40" y="505" width="350" height="50" rx="16" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="-32" y="511" width="334" height="15" rx="7" fill="#686868" stroke="#2A2A2A" stroke-width="1.5"/>
  </g>
  <!-- LEFT LOWER ARM (extending slightly down-left, ~7-8 o'clock) -->
  <g transform="rotate(-25, 305, 620)">
    <rect x="-20" y="600" width="340" height="50" rx="16" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="-12" y="606" width="324" height="15" rx="7" fill="#686868" stroke="#2A2A2A" stroke-width="1.5"/>
  </g>

  <!-- RIGHT UPPER ARM (extending horizontally to the right, ~3 o'clock) -->
  <g transform="rotate(0, 695, 530)">
    <rect x="345" y="505" width="350" height="50" rx="16" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="353" y="511" width="334" height="15" rx="7" fill="#686868" stroke="#2A2A2A" stroke-width="1.5"/>
  </g>
  <!-- RIGHT LOWER ARM (extending slightly down-right, ~4-5 o'clock) -->
  <g transform="rotate(25, 695, 620)">
    <rect x="345" y="600" width="340" height="50" rx="16" fill="#4A4A4A" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="353" y="606" width="324" height="15" rx="7" fill="#686868" stroke="#2A2A2A" stroke-width="1.5"/>
  </g>

  <!-- ===== WHITE GLOVES ===== -->
  <!-- Computed endpoint of left upper arm (extended horizontally to far left) -->
  <!-- Left upper glove - upper left -->
  <g transform="translate(-90, 530)">
    <rect x="-20" y="20" width="40" height="20" rx="7" fill="#E8E8E8" stroke="#A8A8A8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="4"/>
    <!-- Fingers spread upward/outward -->
    <ellipse cx="-30" cy="-26" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-35 -30 -26)"/>
    <ellipse cx="-40" cy="0" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-55 -40 0)"/>
    <ellipse cx="-12" cy="-38" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-12 -12 -38)"/>
    <ellipse cx="13" cy="-41" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(12 13 -41)"/>
    <ellipse cx="32" cy="-28" rx="10" ry="19" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(35 32 -28)"/>
    <ellipse cx="-8" cy="-10" rx="16" ry="12" fill="#E0E0E0" opacity="0.5"/>
  </g>

  <!-- Left lower glove - lower left -->
  <g transform="translate(-110, 680)">
    <rect x="-20" y="20" width="40" height="20" rx="7" fill="#E8E8E8" stroke="#A8A8A8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="4"/>
    <ellipse cx="-30" cy="-26" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-35 -30 -26)"/>
    <ellipse cx="-40" cy="0" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-55 -40 0)"/>
    <ellipse cx="-12" cy="-38" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-12 -12 -38)"/>
    <ellipse cx="13" cy="-41" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(12 13 -41)"/>
    <ellipse cx="32" cy="-28" rx="10" ry="19" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(35 32 -28)"/>
    <ellipse cx="-8" cy="-10" rx="16" ry="12" fill="#E0E0E0" opacity="0.5"/>
  </g>

  <!-- Right upper glove - upper right -->
  <g transform="translate(1090, 530)">
    <rect x="-20" y="20" width="40" height="20" rx="7" fill="#E8E8E8" stroke="#A8A8A8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="4"/>
    <ellipse cx="30" cy="-26" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(35 30 -26)"/>
    <ellipse cx="40" cy="0" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(55 40 0)"/>
    <ellipse cx="12" cy="-38" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(12 12 -38)"/>
    <ellipse cx="-13" cy="-41" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-12 -13 -41)"/>
    <ellipse cx="-32" cy="-28" rx="10" ry="19" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-35 -32 -28)"/>
    <ellipse cx="8" cy="-10" rx="16" ry="12" fill="#E0E0E0" opacity="0.5"/>
  </g>

  <!-- Right lower glove - lower right -->
  <g transform="translate(1110, 680)">
    <rect x="-20" y="20" width="40" height="20" rx="7" fill="#E8E8E8" stroke="#A8A8A8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#A8A8A8" stroke-width="4"/>
    <ellipse cx="30" cy="-26" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(35 30 -26)"/>
    <ellipse cx="40" cy="0" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(55 40 0)"/>
    <ellipse cx="12" cy="-38" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(12 12 -38)"/>
    <ellipse cx="-13" cy="-41" rx="11" ry="20" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-12 -13 -41)"/>
    <ellipse cx="-32" cy="-28" rx="10" ry="19" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="2" transform="rotate(-35 -32 -28)"/>
    <ellipse cx="8" cy="-10" rx="16" ry="12" fill="#E0E0E0" opacity="0.5"/>
  </g>

  <!-- ===== WIZARD HAT ===== -->
  <!-- Hat brim (wide, slightly droopy) -->
  <ellipse cx="500" cy="358" rx="315" ry="68" fill="#1C2560" stroke="#0E1530" stroke-width="6"/>
  <!-- Brim underside shading -->
  <ellipse cx="500" cy="372" rx="300" ry="55" fill="#0E1530" opacity="0.65"/>
  <!-- Brim upper highlight -->
  <ellipse cx="480" cy="346" rx="285" ry="52" fill="#3A4FA8" opacity="0.6"/>
  <!-- Brim top shine line -->
  <ellipse cx="450" cy="335" rx="160" ry="22" fill="#4A60B0" opacity="0.4"/>

  <!-- Hat CONE - tall and slightly curving to the right at the tip -->
  <!-- Main cone shape with slight rightward lean -->
  <path d="M 255 355 C 280 320 340 270 400 195 C 440 145 468 88 492 32 C 508 78 528 138 562 198 C 620 275 685 322 745 355 Z"
        fill="#1E2D65" stroke="#0E1530" stroke-width="5.5"/>
  <!-- Cone left shading -->
  <path d="M 255 355 C 280 320 340 270 400 195 C 440 145 468 88 492 32 C 478 78 454 142 430 200 C 385 278 332 320 290 350 Z"
        fill="#0E1530" opacity="0.45"/>
  <!-- Cone center highlight -->
  <path d="M 492 32 C 510 82 532 148 558 202 C 600 275 660 318 720 352 L 745 355 C 705 328 658 288 622 234 C 584 178 550 112 492 32 Z"
        fill="#3A50A8" opacity="0.35"/>
  <!-- Cone tip curved to upper-right (droop effect) -->
  <ellipse cx="494" cy="34" rx="14" ry="22" fill="#1E2D65" opacity="0.8"/>
  <ellipse cx="496" cy="28" rx="8" ry="12" fill="#3A50A8" opacity="0.5"/>

  <!-- MANY STARS on hat (scattered across brim and cone, larger and more spread out) -->
  <!-- Using simpler 5-pt star polygons for performance -->
  <g fill="#FFC700" stroke="#8B7000" stroke-width="2.5">
    <!-- Brim stars (much larger) -->
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.58) translate(235,450)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.58) translate(685,450)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.62) translate(465,445)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.52) translate(60,435)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.52) translate(1150,435)"/>
    <!-- Cone stars (scattered, much larger) -->
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.60) translate(172,295)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.60) translate(880,295)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.55) translate(310,195)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.55) translate(990,195)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.52) translate(660,120)"/>
    <polygon points="170,330 181,360 214,360 188,379 197,409 170,390 143,409 152,379 126,360 159,360" transform="scale(0.50) translate(820,55)"/>
  </g>

  <!-- CRESCENT MOONS on hat (larger and more visible) -->
  <g fill="#FFC700" stroke="#8B7000" stroke-width="2.5">
    <!-- Brim left moon (enlarged) -->
    <path d="M 228 340 C 228 320 246 308 262 313 C 250 317 245 330 248 345 C 251 360 266 371 280 367 C 262 378 228 365 228 340 Z"/>
    <!-- Brim right moon (enlarged) -->
    <path d="M 772 340 C 772 320 754 308 738 313 C 750 317 755 330 752 345 C 749 360 734 371 720 367 C 738 378 772 365 772 340 Z"/>
    <!-- Cone left moon (mid, enlarged) -->
    <path d="M 362 250 C 359 232 374 220 388 225 C 377 229 373 244 376 258 C 379 272 394 282 408 279 C 394 288 362 272 362 250 Z"/>
    <!-- Cone center moon (enlarged) -->
    <path d="M 469 120 C 466 105 480 94 495 100 C 483 104 479 120 482 134 C 485 148 500 157 514 154 C 500 162 469 142 469 120 Z"/>
    <!-- Cone right moon (mid, enlarged) -->
    <path d="M 638 250 C 638 232 653 220 667 225 C 656 229 652 244 655 258 C 658 272 673 282 687 279 C 673 288 638 272 638 250 Z"/>
  </g>

  <!-- Hat band at base of cone -->
  <rect x="270" y="335" width="460" height="26" rx="9" fill="#1A2558" stroke="#0A1030" stroke-width="3.5"/>
  <rect x="275" y="337" width="450" height="12" rx="7" fill="#3D5A9C" stroke="#0A1030" stroke-width="1.5" opacity="0.35"/>
</svg>
