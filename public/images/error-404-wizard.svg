<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <defs>
    <radialGradient id="screenGradient" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#bfe88a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ecf4a;stop-opacity:1" />
    </radialGradient>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- VITRUVIAN GUIDELINES (background, very faint) -->
  <circle cx="250" cy="290" r="195" fill="none" stroke="#9b7b55" stroke-width="1.2" opacity="0.3"/>
  <line x1="250" y1="95" x2="250" y2="485" stroke="#9b7b55" stroke-width="0.8" opacity="0.25"/>
  <line x1="55" y1="290" x2="445" y2="290" stroke="#9b7b55" stroke-width="0.8" opacity="0.25"/>

  <!-- LEFT ARM (spread wide) -->
  <!-- Left arm outline (dark) -->
  <path d="M 165 260 L 50 255" stroke="#5a3a1a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Left arm fill -->
  <path d="M 165 260 L 50 255" stroke="#c89454" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- LEFT WRIST CUFF -->
  <circle cx="55" cy="256" r="12" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- LEFT GLOVE (white cartoon glove with fingers) -->
  <ellipse cx="35" cy="256" rx="18" ry="14" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="22" cy="246" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="16" cy="258" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="22" cy="270" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="34" cy="276" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- RIGHT ARM (spread wide) -->
  <!-- Right arm outline (dark) -->
  <path d="M 335 260 L 450 255" stroke="#5a3a1a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Right arm fill -->
  <path d="M 335 260 L 450 255" stroke="#c89454" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- RIGHT WRIST CUFF -->
  <circle cx="445" cy="256" r="12" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- RIGHT GLOVE (white cartoon glove with fingers) -->
  <ellipse cx="465" cy="256" rx="18" ry="14" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="478" cy="246" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="484" cy="258" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="478" cy="270" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="466" cy="276" r="8" fill="#f0ede8" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- ROBOT LEGS -->
  <!-- Left upper leg -->
  <rect x="198" y="385" width="38" height="45" fill="#a87040" stroke="#5a3a1a" stroke-width="2" rx="4"/>

  <!-- Right upper leg -->
  <rect x="264" y="385" width="38" height="45" fill="#a87040" stroke="#5a3a1a" stroke-width="2" rx="4"/>

  <!-- Left foot -->
  <rect x="184" y="422" width="58" height="28" fill="#5a3a1a" stroke="#3a2010" stroke-width="2" rx="10"/>

  <!-- Right foot -->
  <rect x="258" y="422" width="58" height="28" fill="#5a3a1a" stroke="#3a2010" stroke-width="2" rx="10"/>

  <!-- Ankle joints -->
  <circle cx="217" cy="385" r="8" fill="#8c5e35" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="283" cy="385" r="8" fill="#8c5e35" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- ROBOT TORSO/BODY -->
  <!-- Main body -->
  <rect x="160" y="280" width="180" height="120" fill="#c89454" stroke="#5a3a1a" stroke-width="2.5" rx="10"/>

  <!-- Chest panel -->
  <rect x="175" y="295" width="150" height="90" fill="#a87040" stroke="#5a3a1a" stroke-width="2" rx="7"/>

  <!-- Panel grid lines -->
  <line x1="250" y1="295" x2="250" y2="385" stroke="#5a3a1a" stroke-width="1" opacity="0.35"/>
  <line x1="175" y1="340" x2="325" y2="340" stroke="#5a3a1a" stroke-width="1" opacity="0.35"/>

  <!-- Central button glow ring -->
  <circle cx="250" cy="340" r="20" fill="none" stroke="#f5c542" stroke-width="1.5" opacity="0.5"/>

  <!-- Central button -->
  <circle cx="250" cy="340" r="14" fill="#f5c542" stroke="#c8961a" stroke-width="2"/>

  <!-- Button shine -->
  <circle cx="246" cy="336" r="4" fill="#fff" opacity="0.6"/>

  <!-- Corner bolts (chest panel) -->
  <circle cx="180" cy="300" r="5" fill="#d4a84b" stroke="#8c5e35" stroke-width="1"/>
  <circle cx="320" cy="300" r="5" fill="#d4a84b" stroke="#8c5e35" stroke-width="1"/>
  <circle cx="180" cy="380" r="5" fill="#d4a84b" stroke="#8c5e35" stroke-width="1"/>
  <circle cx="320" cy="380" r="5" fill="#d4a84b" stroke="#8c5e35" stroke-width="1"/>

  <!-- Shoulder bolts -->
  <circle cx="160" cy="290" r="7" fill="#a87040" stroke="#5a3a1a" stroke-width="1.5"/>
  <circle cx="340" cy="290" r="7" fill="#a87040" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- ROBOT HEAD / CRT TV MONITOR -->
  <!-- Shadow behind head -->
  <rect x="162" y="160" width="186" height="142" fill="#5a3a1a" rx="24" opacity="0.25"/>

  <!-- Outer bezel -->
  <rect x="158" y="155" width="184" height="140" fill="#7a4e2a" stroke="#3a2010" stroke-width="3" rx="22"/>

  <!-- Inner bezel -->
  <rect x="164" y="161" width="172" height="128" fill="#b5814f" stroke="#5a3a1a" stroke-width="2" rx="19"/>

  <!-- Screen bezel (dark green border) -->
  <rect x="178" y="173" width="144" height="108" fill="#2a5c10" stroke="#1a3808" stroke-width="2" rx="8"/>

  <!-- Screen background -->
  <rect x="181" y="176" width="138" height="102" fill="#7ecf4a" rx="6"/>

  <!-- Sky area in screen (lighter green top) -->
  <rect x="181" y="176" width="138" height="55" fill="#a8e060" rx="6" opacity="0.6"/>

  <!-- Cloud blobs in screen -->
  <ellipse cx="220" cy="196" rx="25" ry="12" fill="#fff" opacity="0.4"/>
  <ellipse cx="240" cy="192" rx="18" ry="10" fill="#fff" opacity="0.35"/>
  <ellipse cx="290" cy="198" rx="20" ry="9" fill="#fff" opacity="0.3"/>

  <!-- Screen highlight -->
  <ellipse cx="215" cy="185" rx="35" ry="12" fill="#fff" opacity="0.3"/>

  <!-- Antenna base -->
  <rect x="246" y="152" width="8" height="15" fill="#8c5e35" stroke="#5a3a1a" stroke-width="1"/>

  <!-- Antenna -->
  <line x1="250" y1="152" x2="272" y2="118" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- Antenna ball -->
  <circle cx="272" cy="115" r="6" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1.5"/>

  <!-- Bezel corner screws -->
  <circle cx="165" cy="165" r="5" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1"/>
  <circle cx="335" cy="165" r="5" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1"/>
  <circle cx="165" cy="285" r="5" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1"/>
  <circle cx="335" cy="285" r="5" fill="#d4a84b" stroke="#5a3a1a" stroke-width="1"/>

  <!-- WIZARD HAT (DRAWN LAST - on top of everything) -->
  <!-- Hat cone with curved/drooping tip -->
  <path d="M 252 32 Q 295 60 292 105 Q 270 145 312 188 L 188 188 Z" fill="#1e3a6e" stroke="#0d1f3f" stroke-width="2.5"/>

  <!-- Hat brim -->
  <ellipse cx="250" cy="188" rx="132" ry="26" fill="#162850" stroke="#0d1f3f" stroke-width="2.5"/>

  <!-- Hat brim top highlight -->
  <ellipse cx="250" cy="186" rx="132" ry="22" fill="#1e3a6e" opacity="0.85"/>

  <!-- STARS ON HAT (gold #f5c542, 5-pointed) -->
  <!-- Large star at cone center (size ~22) -->
  <path d="M 255 55 L 259.6 67 L 272.8 67 L 261.2 74.6 L 265.8 86.6 L 255 79 L 244.2 86.6 L 248.8 74.6 L 237.2 67 L 250.4 67 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Medium star upper-left cone (size ~16) -->
  <path d="M 215 108 L 218.7 117 L 229.2 117 L 220.1 123.5 L 223.8 132.5 L 215 126 L 206.2 132.5 L 209.9 123.5 L 200.8 117 L 211.3 117 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Medium star upper-right cone (size ~16) -->
  <path d="M 290 118 L 293.7 127 L 304.2 127 L 295.1 133.5 L 298.8 142.5 L 290 136 L 281.2 142.5 L 284.9 133.5 L 275.8 127 L 286.3 127 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Small star left brim (size ~12) -->
  <path d="M 152 186 L 155 193.5 L 163.2 193.5 L 156.6 198.5 L 159.6 206 L 152 201 L 144.4 206 L 147.4 198.5 L 140.8 193.5 L 149 193.5 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Small star right brim (size ~12) -->
  <path d="M 348 186 L 351 193.5 L 359.2 193.5 L 352.6 198.5 L 355.6 206 L 348 201 L 340.4 206 L 343.4 198.5 L 336.8 193.5 L 345 193.5 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Small star lower left cone (size ~12) -->
  <path d="M 210 158 L 213 165.5 L 221.2 165.5 L 214.6 170.5 L 217.6 178 L 210 173 L 202.4 178 L 205.4 170.5 L 198.8 165.5 L 207 165.5 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Small star lower right cone (size ~12) -->
  <path d="M 288 160 L 291 167.5 L 299.2 167.5 L 292.6 172.5 L 295.6 180 L 288 175 L 280.4 180 L 283.4 172.5 L 276.8 167.5 L 285 167.5 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- Tiny star hat tip area (size ~10) -->
  <path d="M 278 65 L 280.5 71 L 287.5 71 L 281.5 75.5 L 284 81.5 L 278 77 L 272 81.5 L 274.5 75.5 L 268.5 71 L 275.5 71 Z" fill="#f5c542" stroke="#d4a84b" stroke-width="0.5"/>

  <!-- CRESCENT MOONS (TWO-CIRCLE APPROACH - most reliable) -->
  <!-- Moon 1 (left cone, upper) -->
  <circle cx="228" cy="130" r="10" fill="#f5c542"/>
  <circle cx="233" cy="130" r="8" fill="#1e3a6e"/>

  <!-- Moon 2 (right cone, upper) -->
  <circle cx="275" cy="148" r="9" fill="#f5c542"/>
  <circle cx="280" cy="148" r="7" fill="#1e3a6e"/>

  <!-- Moon 3 (left brim, small) -->
  <circle cx="178" cy="188" r="7" fill="#f5c542"/>
  <circle cx="182" cy="188" r="5.5" fill="#162850"/>

  <!-- Moon 4 (right brim, small) -->
  <circle cx="322" cy="188" r="7" fill="#f5c542"/>
  <circle cx="318" cy="188" r="5.5" fill="#162850"/>

  <!-- Moon 5 (upper cone center, tiny) -->
  <circle cx="265" cy="68" r="6" fill="#f5c542"/>
  <circle cx="269" cy="68" r="4.5" fill="#1e3a6e"/>
</svg>