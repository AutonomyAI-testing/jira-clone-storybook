<svg viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8dd468;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5aaa40;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c49a6c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a07848;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a4fa8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3680;stop-opacity:1" />
    </linearGradient>
    
    <!-- Parchment texture pattern -->
    <pattern id="parchmentNoise" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="45" r="1.5" fill="#d4b896" opacity="0.3"/>
      <circle cx="78" cy="12" r="1" fill="#d4b896" opacity="0.25"/>
      <circle cx="150" cy="88" r="1.2" fill="#d4b896" opacity="0.3"/>
      <circle cx="42" cy="165" r="1.5" fill="#d4b896" opacity="0.28"/>
      <circle cx="185" cy="142" r="0.8" fill="#d4b896" opacity="0.25"/>
      <circle cx="95" cy="175" r="1" fill="#d4b896" opacity="0.3"/>
      <circle cx="168" cy="45" r="1.3" fill="#d4b896" opacity="0.25"/>
      <circle cx="12" cy="98" r="1" fill="#d4b896" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Parchment background with speckle texture -->
  <rect width="500" height="560" fill="#f5e8cc"/>
  <rect width="500" height="560" fill="url(#parchmentNoise)"/>

  <!-- VITRUVIAN FRAME (visible guides) -->
  <!-- Circle -->
  <circle cx="250" cy="310" r="190" fill="none" stroke="#8a5858" stroke-width="2.5" opacity="0.65"/>
  
  <!-- Rectangle -->
  <rect x="100" y="205" width="300" height="300" fill="none" stroke="#8a5858" stroke-width="2.5" opacity="0.65"/>

  <!-- ======== WIZARD HAT ======== -->
  <!-- Hat cone (tall cone pointing up, tip at y=30) -->
  <path d="M 265 30 Q 290 70 315 140 L 175 140 Q 200 70 265 30 Z" fill="url(#hatGradient)" stroke="#0f2451" stroke-width="2.5"/>
  
  <!-- Hat brim (wide ellipse) -->
  <ellipse cx="245" cy="140" rx="130" ry="38" fill="#1a3680" stroke="#0f2451" stroke-width="2.5"/>
  
  <!-- Hat brim highlight for 3D effect -->
  <ellipse cx="245" cy="135" rx="130" ry="18" fill="#2a4fa8" opacity="0.65"/>

  <!-- Stars on hat -->
  <!-- Star 1 (top right) -->
  <polygon points="310,75 313,85 324,85 316,91 319,102 310,96 301,102 304,91 296,85 307,85" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  
  <!-- Star 2 (top left) -->
  <polygon points="180,75 183,85 194,85 186,91 189,102 180,96 171,102 174,91 166,85 177,85" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  
  <!-- Star 3 (right side) -->
  <polygon points="315,125 318,135 329,135 321,141 324,152 315,146 306,152 309,141 301,135 312,135" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  
  <!-- Star 4 (left side) -->
  <polygon points="175,125 178,135 189,135 181,141 184,152 175,146 166,152 169,141 161,135 172,135" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  
  <!-- Star 5 (brim right) -->
  <polygon points="325,125 327,132 336,132 329,137 331,145 325,140 319,145 321,137 314,132 323,132" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  
  <!-- Star 6 (brim left) -->
  <polygon points="165,125 167,132 176,132 169,137 171,145 165,140 159,145 161,137 154,132 163,132" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  
  <!-- Moon on hat (upper center-left area) -->
  <circle cx="240" cy="68" r="9" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  <circle cx="237" cy="68" r="8" fill="#1a3680"/>
  
  <!-- Moon on hat (right side) -->
  <circle cx="290" cy="95" r="8" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  <circle cx="287" cy="95" r="7" fill="#1a3680"/>
  
  <!-- Moon on hat (left side) -->
  <circle cx="205" cy="100" r="7" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>
  <circle cx="202" cy="100" r="6" fill="#1a3680"/>
  
  <!-- Moon on hat (center) -->
  <path d="M 245 105 Q 240 110 240 120 Q 240 130 245 135 Q 248 130 248 120 Q 248 110 245 105 Z" fill="#f5b922" stroke="#d4a520" stroke-width="0.5"/>

  <!-- ======== ROBOT HEAD (MONITOR SCREEN) ======== -->
  <!-- Head outer bezel (brown frame) -->
  <rect x="170" y="150" width="150" height="130" rx="12" fill="#a07848" stroke="#6b5339" stroke-width="2"/>
  
  <!-- Screen bezel (darker inner frame) -->
  <rect x="183" y="162" width="124" height="108" rx="8" fill="#8a6c3e" stroke="#5d4a28" stroke-width="1.5"/>
  
  <!-- Green screen display -->
  <rect x="193" y="172" width="104" height="90" rx="4" fill="url(#screenGradient)" stroke="#4a7830" stroke-width="1"/>
  
  <!-- Screen gloss/shine effect -->
  <ellipse cx="220" cy="185" rx="25" ry="20" fill="#ffffff" opacity="0.25"/>

  <!-- ======== NECK ======== -->
  <rect x="200" y="278" width="100" height="20" rx="4" fill="#a07848" stroke="#6b5339" stroke-width="1.5"/>

  <!-- ======== BODY ======== -->
  <!-- Main body (brown rectangular form) -->
  <rect x="155" y="295" width="190" height="160" rx="10" fill="url(#bodyGradient)" stroke="#6b5339" stroke-width="2"/>
  
  <!-- Chest panel (darker area for detail) -->
  <rect x="185" y="330" width="130" height="90" rx="6" fill="#8a6c3e" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Central button (yellow circle) -->
  <circle cx="250" cy="395" r="12" fill="#f5b922" stroke="#d4a520" stroke-width="1.5"/>
  
  <!-- Button depression/shadow -->
  <circle cx="250" cy="395" r="10" fill="none" stroke="#9a7a1a" stroke-width="1" opacity="0.6"/>

  <!-- ======== LEFT ARM ======== -->
  <!-- Thick line arm from body to wrist -->
  <line x1="155" y1="360" x2="75" y2="335" stroke="#a07848" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Left elbow joint -->
  <circle cx="110" cy="345" r="14" fill="#a07848" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Left wrist cuff -->
  <circle cx="75" cy="335" r="15" fill="#8a6c3e" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Left hand palm -->
  <circle cx="48" cy="325" r="28" fill="#f0eeec" stroke="#a07848" stroke-width="2"/>
  
  <!-- Left hand fingers (glove) -->
  <!-- Top finger -->
  <ellipse cx="48" cy="290" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5"/>
  
  <!-- Top-left finger -->
  <ellipse cx="23" cy="298" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5" transform="rotate(-30 23 298)"/>
  
  <!-- Left finger -->
  <ellipse cx="15" cy="325" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5" transform="rotate(-60 15 325)"/>
  
  <!-- Bottom-left finger -->
  <ellipse cx="23" cy="352" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5" transform="rotate(-90 23 352)"/>

  <!-- ======== RIGHT ARM ======== -->
  <!-- Thick line arm from body to wrist -->
  <line x1="345" y1="360" x2="425" y2="335" stroke="#a07848" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Right elbow joint -->
  <circle cx="390" cy="345" r="14" fill="#a07848" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Right wrist cuff -->
  <circle cx="425" cy="335" r="15" fill="#8a6c3e" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Right hand palm (mirrored: 500 - 48 = 452) -->
  <circle cx="452" cy="325" r="28" fill="#f0eeec" stroke="#a07848" stroke-width="2"/>
  
  <!-- Right hand fingers (glove) -->
  <!-- Top finger -->
  <ellipse cx="452" cy="290" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5"/>
  
  <!-- Top-right finger -->
  <ellipse cx="477" cy="298" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5" transform="rotate(30 477 298)"/>
  
  <!-- Right finger -->
  <ellipse cx="485" cy="325" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5" transform="rotate(60 485 325)"/>
  
  <!-- Bottom-right finger -->
  <ellipse cx="477" cy="352" rx="10" ry="19" fill="#f0eeec" stroke="#a07848" stroke-width="1.5" transform="rotate(90 477 352)"/>

  <!-- ======== LEGS & BOOTS ======== -->
  <!-- Left leg -->
  <rect x="205" y="455" width="26" height="45" rx="6" fill="#a07848" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Left boot -->
  <rect x="190" y="496" width="58" height="28" rx="6" fill="#6b5339" stroke="#4a3a25" stroke-width="1.5"/>
  
  <!-- Left boot detail -->
  <rect x="195" y="500" width="48" height="8" rx="3" fill="#5a4a35" opacity="0.7"/>

  <!-- Right leg -->
  <rect x="269" y="455" width="26" height="45" rx="6" fill="#a07848" stroke="#6b5339" stroke-width="1.5"/>
  
  <!-- Right boot -->
  <rect x="254" y="496" width="58" height="28" rx="6" fill="#6b5339" stroke="#4a3a25" stroke-width="1.5"/>
  
  <!-- Right boot detail -->
  <rect x="259" y="500" width="48" height="8" rx="3" fill="#5a4a35" opacity="0.7"/>
</svg>