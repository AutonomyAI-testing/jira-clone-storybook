<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Background -->
  <rect width="120" height="80" fill="#fdf4ff" rx="4"/>

  <!-- Header bar -->
  <rect width="120" height="14" fill="#7c3aed" rx="4"/>
  <rect y="10" width="120" height="4" fill="#7c3aed"/>
  <!-- Logo dot -->
  <circle cx="8" cy="7" r="3" fill="#f0abfc"/>
  <!-- Nav dots -->
  <rect x="16" y="4" width="20" height="6" fill="#a855f7" rx="2"/>
  <rect x="42" y="4" width="14" height="6" fill="#c084fc" rx="2"/>

  <!-- Board columns area -->
  <!-- Column 1 - purple -->
  <rect x="6" y="20" width="32" height="9" fill="#ede9fe" rx="3"/>
  <rect x="6" y="31" width="32" height="18" fill="#ffffff" rx="3" stroke="#ddd6fe" stroke-width="0.5"/>
  <rect x="6" y="51" width="32" height="18" fill="#ffffff" rx="3" stroke="#ddd6fe" stroke-width="0.5"/>

  <!-- Column 2 - pink -->
  <rect x="44" y="20" width="32" height="9" fill="#fce7f3" rx="3"/>
  <rect x="44" y="31" width="32" height="18" fill="#ffffff" rx="3" stroke="#fbcfe8" stroke-width="0.5"/>

  <!-- Column 3 - green -->
  <rect x="82" y="20" width="32" height="9" fill="#dcfce7" rx="3"/>
  <rect x="82" y="31" width="32" height="18" fill="#ffffff" rx="3" stroke="#bbf7d0" stroke-width="0.5"/>

  <!-- Column text lines -->
  <rect x="9" y="23" width="18" height="3" fill="#7c3aed" rx="1"/>
  <rect x="47" y="23" width="18" height="3" fill="#ec4899" rx="1"/>
  <rect x="85" y="23" width="18" height="3" fill="#16a34a" rx="1"/>

  <!-- Card content lines -->
  <rect x="9" y="34" width="22" height="2" fill="#a78bfa" rx="1"/>
  <rect x="9" y="38" width="16" height="2" fill="#c4b5fd" rx="1"/>
  <rect x="9" y="54" width="24" height="2" fill="#a78bfa" rx="1"/>
  <rect x="9" y="58" width="12" height="2" fill="#c4b5fd" rx="1"/>
  <rect x="47" y="34" width="22" height="2" fill="#f9a8d4" rx="1"/>
  <rect x="47" y="38" width="15" height="2" fill="#fbcfe8" rx="1"/>
  <rect x="85" y="34" width="20" height="2" fill="#86efac" rx="1"/>
  <rect x="85" y="38" width="14" height="2" fill="#bbf7d0" rx="1"/>

  <!-- Confetti decorations -->
  <!-- Purple circles -->
  <circle cx="3" cy="40" r="2" fill="#a855f7" opacity="0.7"/>
  <circle cx="117" cy="35" r="2.5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="115" cy="65" r="1.5" fill="#c084fc" opacity="0.8"/>

  <!-- Pink confetti -->
  <rect x="1" y="60" width="4" height="4" fill="#ec4899" rx="1" opacity="0.7" transform="rotate(20 3 62)"/>
  <rect x="114" y="50" width="4" height="4" fill="#f9a8d4" rx="1" opacity="0.8" transform="rotate(-15 116 52)"/>

  <!-- Yellow confetti -->
  <rect x="1" y="28" width="3" height="5" fill="#fbbf24" rx="1" opacity="0.8" transform="rotate(30 2.5 30)"/>
  <circle cx="116" cy="20" r="2" fill="#fde047" opacity="0.9"/>

  <!-- Green confetti -->
  <rect x="110" y="70" width="4" height="4" fill="#4ade80" rx="1" opacity="0.7" transform="rotate(10 112 72)"/>
  <circle cx="4" cy="70" r="2" fill="#86efac" opacity="0.8"/>

  <!-- Stars/sparkles -->
  <text x="110" y="17" font-size="6" fill="#fbbf24" opacity="0.9">✦</text>
  <text x="2" y="17" font-size="5" fill="#f0abfc" opacity="0.9">✦</text>
  <text x="108" y="78" font-size="4" fill="#a855f7" opacity="0.7">✦</text>
</svg>
