<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      .wizard-outline { stroke: #1a1a1a; stroke-linecap: round; stroke-linejoin: round; }
      .dark-navy { fill: #1e3a5f; }
      .light-highlight { fill: #ffffff; opacity: 0.25; }
      .body-brown { fill: #9e7a5c; }
      .dark-brown { fill: #6b4e35; }
    </style>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND CIRCLE & DA VINCI FRAME -->
  <!-- Outer circular frame (darker brown/maroon) -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#6b4a3a" stroke-width="2" />
  
  <!-- Warm beige background inside circle -->
  <circle cx="250" cy="250" r="238" fill="#e8dcc4" />
  
  <!-- Da Vinci reference frame lines -->
  <g stroke="#9e7a5c" stroke-width="1.5" opacity="0.3" fill="none">
    <!-- Horizontal lines -->
    <line x1="50" y1="250" x2="450" y2="250" />
    <line x1="50" y1="150" x2="450" y2="150" />
    <line x1="50" y1="350" x2="450" y2="350" />
    <!-- Vertical lines -->
    <line x1="250" y1="50" x2="250" y2="450" />
    <line x1="150" y1="50" x2="150" y2="450" />
    <line x1="350" y1="50" x2="350" y2="450" />
    <!-- Square grid -->
    <rect x="80" y="80" width="340" height="340" fill="none" />
  </g>

  <!-- WIZARD HAT -->
  <!-- Hat cone base (dark navy) -->
  <polygon points="250,20 160,200 340,200" fill="#1e3a5f" class="wizard-outline" stroke-width="2.5"/>
  
  <!-- Hat cone shading (darker side) -->
  <polygon points="250,20 160,200 205,200" fill="#0f1f35" opacity="0.6"/>
  
  <!-- Cone highlight (lighter side) -->
  <polygon points="250,20 340,200 295,200" fill="#2d5a8c" opacity="0.4"/>
  
  <!-- Hat brim (large ellipse, dark navy) -->
  <ellipse cx="250" cy="200" rx="170" ry="35" fill="#1e3a5f" class="wizard-outline" stroke-width="2.5"/>
  
  <!-- Brim shading (darker bottom) -->
  <ellipse cx="250" cy="203" rx="168" ry="12" fill="#0f1f35" opacity="0.5"/>
  
  <!-- Brim highlight (lighter top) -->
  <ellipse cx="250" cy="197" rx="168" ry="8" fill="#2d5a8c" opacity="0.3"/>
  
  <!-- Stars on hat cone (larger, more prominent) -->
  <text x="210" y="110" font-size="32" fill="#f5c518" text-anchor="middle" font-weight="bold">★</text>
  <text x="290" y="80" font-size="28" fill="#f5c518" text-anchor="middle" font-weight="bold">★</text>
  <text x="250" y="160" font-size="24" fill="#f5c518" text-anchor="middle" font-weight="bold">★</text>
  
  <!-- Moons on hat cone (larger, more prominent) -->
  <text x="270" y="130" font-size="26" fill="#f5c518" text-anchor="middle" font-weight="bold">☽</text>
  <text x="225" y="145" font-size="22" fill="#f5c518" text-anchor="middle" font-weight="bold">☽</text>
  
  <!-- Stars on brim (larger) -->
  <text x="140" y="210" font-size="28" fill="#f5c518" text-anchor="middle" font-weight="bold">★</text>
  <text x="200" y="205" font-size="20" fill="#f5c518" text-anchor="middle" font-weight="bold">☽</text>
  <text x="300" y="205" font-size="20" fill="#f5c518" text-anchor="middle" font-weight="bold">☽</text>
  <text x="360" y="210" font-size="28" fill="#f5c518" text-anchor="middle" font-weight="bold">★</text>
  <text x="250" y="223" font-size="18" fill="#f5c518" text-anchor="middle" font-weight="bold">★</text>

  <!-- ROBOT HEAD/BODY (TV MONITOR STYLE) -->
  <!-- Head frame (thick brown border with rounded corners) -->
  <rect x="160" y="210" width="180" height="140" rx="14" ry="14" fill="#8b6f47" class="wizard-outline" stroke-width="3"/>
  
  <!-- Head body fill (lighter brown) -->
  <rect x="165" y="215" width="170" height="130" rx="10" ry="10" fill="#9e7a5c"/>
  
  <!-- Screen (green display with rounded corners) -->
  <rect x="180" y="230" width="140" height="95" rx="8" ry="8" fill="#5db85d" class="wizard-outline" stroke-width="2"/>
  
  <!-- Screen darker areas (shading) -->
  <ellipse cx="220" cy="250" rx="45" ry="25" fill="#3d8a3d" opacity="0.3"/>
  <ellipse cx="280" cy="275" rx="50" ry="20" fill="#2d6b2d" opacity="0.2"/>
  
  <!-- Screen white glare/shine (prominent highlights) -->
  <ellipse cx="210" cy="245" rx="35" ry="22" fill="#ffffff" opacity="0.35"/>
  <ellipse cx="270" cy="270" rx="28" ry="18" fill="#ffffff" opacity="0.2"/>
  <ellipse cx="240" cy="235" rx="15" ry="12" fill="#ffffff" opacity="0.25"/>
  
  <!-- Screen border details (mounting screws) -->
  <circle cx="184" cy="235" r="2.5" fill="#5c4030" stroke="#3d2a1a" stroke-width="0.5"/>
  <circle cx="316" cy="235" r="2.5" fill="#5c4030" stroke="#3d2a1a" stroke-width="0.5"/>
  <circle cx="184" cy="318" r="2.5" fill="#5c4030" stroke="#3d2a1a" stroke-width="0.5"/>
  <circle cx="316" cy="318" r="2.5" fill="#5c4030" stroke="#3d2a1a" stroke-width="0.5"/>

  <!-- ROBOT TORSO -->
  <!-- Torso main body (brown with rounded corners) -->
  <rect x="165" y="350" width="170" height="100" rx="10" ry="10" fill="#9e7a5c" class="wizard-outline" stroke-width="2.5"/>
  
  <!-- Torso darker shading (left side) -->
  <rect x="165" y="350" width="40" height="100" rx="10" ry="10" fill="#7a5c40" opacity="0.4"/>
  
  <!-- Torso panel detail (wood-grain frame) -->
  <rect x="190" y="370" width="120" height="60" rx="6" ry="6" fill="#7a5c40" class="wizard-outline" stroke-width="1.5"/>
  
  <!-- Panel inner shading (wood texture) -->
  <rect x="195" y="375" width="110" height="50" fill="#6b4e35" opacity="0.3"/>
  <line x1="195" y1="385" x2="305" y2="385" stroke="#5c4030" stroke-width="1" opacity="0.4"/>
  <line x1="195" y1="395" x2="305" y2="395" stroke="#5c4030" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Golden button/orb (with dimensional shading) -->
  <circle cx="250" cy="400" r="18" fill="#c9970a" class="wizard-outline" stroke-width="2"/>
  <circle cx="250" cy="400" r="14" fill="#d4a017"/>
  <circle cx="250" cy="400" r="10" fill="#f0c040" opacity="0.7"/>
  <!-- Button highlight -->
  <ellipse cx="244" cy="396" rx="6" ry="5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Side bolts on torso -->
  <g class="wizard-outline" stroke-width="1.5">
    <circle cx="172" cy="385" r="6" fill="#7a5c40"/>
    <circle cx="328" cy="385" r="6" fill="#7a5c40"/>
  </g>

  <!-- LEFT ARM -->
  <!-- Upper left arm segment -->
  <rect x="90" y="300" width="75" height="26" rx="10" fill="#555555" class="wizard-outline" stroke-width="2"/>
  
  <!-- Joint 1 (dark shading at connection) -->
  <circle cx="165" cy="313" r="8" fill="#333333" class="wizard-outline" stroke-width="1.5"/>
  
  <!-- Lower left arm segment (angled ~45° outward) -->
  <g transform="translate(90, 330) rotate(-25)">
    <rect x="0" y="0" width="75" height="22" rx="9" fill="#555555" class="wizard-outline" stroke-width="2"/>
  </g>
  
  <!-- Joint 2 (darker shading) -->
  <circle cx="60" cy="355" r="7" fill="#333333" class="wizard-outline" stroke-width="1.5"/>
  
  <!-- Left glove/hand (large white with finger separation) -->
  <ellipse cx="35" cy="375" rx="38" ry="32" fill="#f0ede8" class="wizard-outline" stroke-width="2"/>
  
  <!-- Left glove shading (dimensional) -->
  <ellipse cx="42" cy="382" rx="32" ry="26" fill="#ddd" opacity="0.4"/>
  
  <!-- Left hand fingers (more prominent) -->
  <ellipse cx="8" cy="355" rx="12" ry="22" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(-35 8 355)"/>
  <ellipse cx="-8" cy="375" rx="12" ry="20" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(-55 -8 375)"/>
  <ellipse cx="10" cy="405" rx="12" ry="18" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(30 10 405)"/>
  <ellipse cx="42" cy="415" rx="10" ry="16" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(50 42 415)"/>
  
  <!-- Left glove finger shading -->
  <ellipse cx="8" cy="355" rx="8" ry="16" fill="#d4d0ca" opacity="0.4" transform="rotate(-35 8 355)"/>
  <ellipse cx="-8" cy="375" rx="8" ry="14" fill="#d4d0ca" opacity="0.4" transform="rotate(-55 -8 375)"/>
  
  <!-- Left wrist cuff -->
  <rect x="32" y="330" width="28" height="45" rx="6" fill="#ddd" class="wizard-outline" stroke-width="1.5"/>
  <line x1="38" y1="335" x2="54" y2="335" stroke="#bbb" stroke-width="1" opacity="0.6"/>
  <line x1="38" y1="345" x2="54" y2="345" stroke="#bbb" stroke-width="1" opacity="0.6"/>

  <!-- RIGHT ARM -->
  <!-- Upper right arm segment -->
  <rect x="335" y="300" width="75" height="26" rx="10" fill="#555555" class="wizard-outline" stroke-width="2"/>
  
  <!-- Joint 1 (dark shading at connection) -->
  <circle cx="335" cy="313" r="8" fill="#333333" class="wizard-outline" stroke-width="1.5"/>
  
  <!-- Lower right arm segment (angled ~45° outward) -->
  <g transform="translate(410, 330) rotate(25)">
    <rect x="0" y="0" width="75" height="22" rx="9" fill="#555555" class="wizard-outline" stroke-width="2"/>
  </g>
  
  <!-- Joint 2 (darker shading) -->
  <circle cx="440" cy="355" r="7" fill="#333333" class="wizard-outline" stroke-width="1.5"/>
  
  <!-- Right glove/hand (large white with finger separation) -->
  <ellipse cx="465" cy="375" rx="38" ry="32" fill="#f0ede8" class="wizard-outline" stroke-width="2"/>
  
  <!-- Right glove shading (dimensional) -->
  <ellipse cx="458" cy="382" rx="32" ry="26" fill="#ddd" opacity="0.4"/>
  
  <!-- Right hand fingers (more prominent) -->
  <ellipse cx="492" cy="355" rx="12" ry="22" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(35 492 355)"/>
  <ellipse cx="508" cy="375" rx="12" ry="20" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(55 508 375)"/>
  <ellipse cx="490" cy="405" rx="12" ry="18" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(-30 490 405)"/>
  <ellipse cx="458" cy="415" rx="10" ry="16" fill="#f0ede8" class="wizard-outline" stroke-width="1.5" transform="rotate(-50 458 415)"/>
  
  <!-- Right glove finger shading -->
  <ellipse cx="492" cy="355" rx="8" ry="16" fill="#d4d0ca" opacity="0.4" transform="rotate(35 492 355)"/>
  <ellipse cx="508" cy="375" rx="8" ry="14" fill="#d4d0ca" opacity="0.4" transform="rotate(55 508 375)"/>
  
  <!-- Right wrist cuff -->
  <rect x="440" y="330" width="28" height="45" rx="6" fill="#ddd" class="wizard-outline" stroke-width="1.5"/>
  <line x1="446" y1="335" x2="462" y2="335" stroke="#bbb" stroke-width="1" opacity="0.6"/>
  <line x1="446" y1="345" x2="462" y2="345" stroke="#bbb" stroke-width="1" opacity="0.6"/>

  <!-- ROBOT LEGS & BOOTS -->
  <!-- Left upper leg -->
  <rect x="205" y="450" width="40" height="60" rx="8" fill="#7a5c40" class="wizard-outline" stroke-width="2"/>
  
  <!-- Left upper leg shading -->
  <rect x="205" y="450" width="15" height="60" rx="8" fill="#5c4030" opacity="0.4"/>
  
  <!-- Left lower leg / foot -->
  <rect x="185" y="505" width="65" height="40" rx="10" fill="#5c3d28" class="wizard-outline" stroke-width="2"/>
  
  <!-- Left foot shading and details -->
  <rect x="185" y="520" width="65" height="8" fill="#3d2a1a" opacity="0.5"/>
  <ellipse cx="210" cy="540" rx="18" ry="6" fill="#3d2a1a" opacity="0.3"/>
  
  <!-- Left boot highlight -->
  <ellipse cx="210" cy="508" rx="28" ry="8" fill="#7a5c40" opacity="0.3"/>
  
  <!-- Right upper leg -->
  <rect x="255" y="450" width="40" height="60" rx="8" fill="#7a5c40" class="wizard-outline" stroke-width="2"/>
  
  <!-- Right upper leg shading -->
  <rect x="255" y="450" width="15" height="60" rx="8" fill="#5c4030" opacity="0.4"/>
  
  <!-- Right lower leg / foot -->
  <rect x="250" y="505" width="65" height="40" rx="10" fill="#5c3d28" class="wizard-outline" stroke-width="2"/>
  
  <!-- Right foot shading and details -->
  <rect x="250" y="520" width="65" height="8" fill="#3d2a1a" opacity="0.5"/>
  <ellipse cx="280" cy="540" rx="18" ry="6" fill="#3d2a1a" opacity="0.3"/>
  
  <!-- Right boot highlight -->
  <ellipse cx="280" cy="508" rx="28" ry="8" fill="#7a5c40" opacity="0.3"/>
  
  <!-- Knee joint details -->
  <circle cx="225" cy="452" r="6" fill="#5c4030" class="wizard-outline" stroke-width="1"/>
  <circle cx="275" cy="452" r="6" fill="#5c4030" class="wizard-outline" stroke-width="1"/>
</svg>
