<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ece0c4"/>
      <stop offset="85%" stop-color="#d8ccb0"/>
      <stop offset="100%" stop-color="#c4b898"/>
    </radialGradient>
    <radialGradient id="scr" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9ae050"/>
      <stop offset="50%" stop-color="#58c02a"/>
      <stop offset="100%" stop-color="#2c6c0c"/>
    </radialGradient>
    <radialGradient id="btn" cx="32%" cy="25%" r="58%">
      <stop offset="0%" stop-color="#fce868"/>
      <stop offset="100%" stop-color="#c09010"/>
    </radialGradient>
    <linearGradient id="hat" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2c62cc"/>
      <stop offset="100%" stop-color="#0a2468"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dab878"/>
      <stop offset="45%" stop-color="#c29058"/>
      <stop offset="100%" stop-color="#985830"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d2a870"/>
      <stop offset="50%" stop-color="#be8448"/>
      <stop offset="100%" stop-color="#965530"/>
    </linearGradient>
  </defs>

  <!-- PARCHMENT CIRCLE (Vitruvian background) -->
  <circle cx="400" cy="400" r="310" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="310" stroke="#8a6a50" stroke-width="2.5" fill="none" opacity="0.7"/>
  <!-- Vitruvian square -->
  <rect x="172" y="172" width="456" height="456" stroke="#8a6a50" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Cross lines -->
  <line x1="172" y1="400" x2="628" y2="400" stroke="#8a6a50" stroke-width="1.2" opacity="0.4"/>
  <line x1="400" y1="172" x2="400" y2="628" stroke="#8a6a50" stroke-width="1.2" opacity="0.4"/>

  <!-- ============ WIZARD HAT ============ -->
  <!-- Very wide brim ellipse -->
  <ellipse cx="400" cy="232" rx="196" ry="36" fill="#122872"/>
  <ellipse cx="400" cy="232" rx="196" ry="36" fill="#2456b4" opacity="0.45"/>
  <!-- Brim underside -->
  <ellipse cx="400" cy="238" rx="190" ry="28" fill="#080e44" opacity="0.5"/>
  <!-- Brim border -->
  <ellipse cx="400" cy="232" rx="196" ry="36" stroke="#060c3a" stroke-width="3" fill="none"/>

  <!-- Hat cone (floppy, droops slightly right) -->
  <path d="M298,228 Q326,152 348,94 Q362,48 382,18 Q398,45 410,94 Q432,155 464,226 Z" fill="url(#hat)"/>
  <!-- Cone highlight -->
  <path d="M310,228 Q334,156 354,100 Q366,56 380,24 Q368,52 360,98 Q342,158 316,226 Z" fill="#3c70d8" opacity="0.5"/>
  <!-- Cone outline -->
  <path d="M298,228 Q326,152 348,94 Q362,48 382,18 Q398,45 410,94 Q432,155 464,226 Z" stroke="#060c3a" stroke-width="3" fill="none"/>

  <!-- STARS on brim — big and prominent -->
  <g fill="#f6cc1e">
    <!-- Far left star -->
    <path d="M215,225 L218,234 L228,234 L220,240 L223,249 L215,243 L207,249 L210,240 L202,234 L212,234 Z"/>
    <!-- Mid-left star -->
    <path d="M274,217 L276.5,224.5 L284.5,224.5 L278.5,229 L280.5,236.5 L274,232 L267.5,236.5 L269.5,229 L263.5,224.5 L271.5,224.5 Z"/>
    <!-- Mid-right star -->
    <path d="M492,215 L494.5,222.5 L502.5,222.5 L496.5,227 L498.5,234.5 L492,230 L485.5,234.5 L487.5,227 L481.5,222.5 L489.5,222.5 Z"/>
    <!-- Far right star -->
    <path d="M548,222 L551,231 L561,231 L553,237 L556,246 L548,240 L540,246 L543,237 L535,231 L545,231 Z"/>
  </g>
  <!-- MOONS on brim — prominent crescents -->
  <g fill="#f6cc1e">
    <path d="M183,232 a14,14 0 1,1 17,-4 a10,10 0 1,0 -17,4 Z"/>
    <path d="M582,228 a13,13 0 1,1 15,-3 a9,9 0 1,0 -15,3 Z"/>
  </g>
  <!-- Stars on cone -->
  <g fill="#f6cc1e">
    <path d="M354,138 L356,144 L363,144 L358,148 L360,154 L354,150 L348,154 L350,148 L345,144 L352,144 Z"/>
    <path d="M384,95 L386,101 L393,101 L388,105 L390,111 L384,107 L378,111 L380,105 L375,101 L382,101 Z"/>
  </g>
  <!-- Moon on cone -->
  <path d="M362,65 a14,14 0 1,1 18,-2 a10,10 0 1,0 -18,2 Z" fill="#f6cc1e"/>

  <!-- ============ LEFT ARM (Vitruvian wide spread) ============ -->
  <!-- Upper arm: horizontal from shoulder at ~x=230 going left to ~x=130 at y=370 -->
  <rect x="120" y="355" width="120" height="22" rx="11" fill="#484848"/>
  <!-- Forearm: angles diagonally down-left from elbow at x=120 -->
  <rect x="68" y="372" width="74" height="20" rx="10" fill="#555" transform="rotate(35,105,382)"/>
  <!-- Glove cuff -->
  <ellipse cx="88" cy="430" rx="28" ry="14" fill="#e4e0d8" transform="rotate(-10,88,430)"/>
  <ellipse cx="88" cy="430" rx="28" ry="14" stroke="#c8c0b6" stroke-width="2.5" fill="none" transform="rotate(-10,88,430)"/>
  <!-- Glove palm -->
  <ellipse cx="80" cy="453" rx="30" ry="24" fill="#f0ece6"/>
  <!-- Fingers (5 spread) -->
  <line x1="54" y1="445" x2="38" y2="427" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="65" y1="437" x2="54" y2="416" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="79" y1="432" x2="73" y2="409" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="95" y1="433" x2="94" y2="410" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="108" y1="440" x2="114" y2="418" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <!-- Finger shadow lines -->
  <line x1="54" y1="445" x2="38" y2="427" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="437" x2="54" y2="416" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="79" y1="432" x2="73" y2="409" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="433" x2="94" y2="410" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="108" y1="440" x2="114" y2="418" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="80" cy="453" rx="30" ry="24" stroke="#ccc4ba" stroke-width="2" fill="none"/>

  <!-- ============ RIGHT ARM (Vitruvian wide spread) ============ -->
  <!-- Upper arm: horizontal from shoulder at ~x=570 going right to ~x=680 at y=370 -->
  <rect x="560" y="355" width="120" height="22" rx="11" fill="#484848"/>
  <!-- Forearm: angles down-right from ~x=680 -->
  <rect x="658" y="372" width="74" height="20" rx="10" fill="#555" transform="rotate(-35,695,382)"/>
  <!-- Glove cuff -->
  <ellipse cx="712" cy="430" rx="28" ry="14" fill="#e4e0d8" transform="rotate(10,712,430)"/>
  <ellipse cx="712" cy="430" rx="28" ry="14" stroke="#c8c0b6" stroke-width="2.5" fill="none" transform="rotate(10,712,430)"/>
  <!-- Glove palm -->
  <ellipse cx="720" cy="453" rx="30" ry="24" fill="#f0ece6"/>
  <!-- Fingers (5 spread) -->
  <line x1="746" y1="445" x2="762" y2="427" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="735" y1="437" x2="746" y2="416" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="721" y1="432" x2="727" y2="409" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="705" y1="433" x2="706" y2="410" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <line x1="692" y1="440" x2="686" y2="418" stroke="#f0ece6" stroke-width="12" stroke-linecap="round"/>
  <!-- Finger shadow lines -->
  <line x1="746" y1="445" x2="762" y2="427" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="735" y1="437" x2="746" y2="416" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="721" y1="432" x2="727" y2="409" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="705" y1="433" x2="706" y2="410" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="692" y1="440" x2="686" y2="418" stroke="#ccc4ba" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="720" cy="453" rx="30" ry="24" stroke="#ccc4ba" stroke-width="2" fill="none"/>

  <!-- ============ ROBOT HEAD (TV) ============ -->
  <rect x="262" y="258" width="276" height="200" rx="18" fill="url(#head)"/>
  <!-- Head left highlight -->
  <rect x="262" y="258" width="52" height="200" rx="18" fill="#e0c090" opacity="0.4"/>
  <!-- Head right shadow -->
  <rect x="440" y="258" width="98" height="200" rx="18" fill="#7c4220" opacity="0.35"/>
  <!-- Screen -->
  <rect x="292" y="280" width="216" height="148" rx="10" fill="url(#scr)"/>
  <!-- Screen cloud reflections -->
  <ellipse cx="332" cy="310" rx="50" ry="30" fill="white" opacity="0.2"/>
  <ellipse cx="355" cy="296" rx="30" ry="17" fill="white" opacity="0.15"/>
  <ellipse cx="415" cy="315" rx="26" ry="14" fill="white" opacity="0.10"/>
  <!-- Screen bezel -->
  <rect x="292" y="280" width="216" height="148" rx="10" stroke="#162e08" stroke-width="4" fill="none"/>
  <!-- Corner bolts -->
  <circle cx="278" cy="275" r="10" fill="#b07840"/>
  <circle cx="278" cy="275" r="6" fill="#cc9860"/>
  <circle cx="522" cy="275" r="10" fill="#b07840"/>
  <circle cx="522" cy="275" r="6" fill="#cc9860"/>
  <circle cx="278" cy="448" r="10" fill="#b07840"/>
  <circle cx="278" cy="448" r="6" fill="#cc9860"/>
  <circle cx="522" cy="448" r="10" fill="#b07840"/>
  <circle cx="522" cy="448" r="6" fill="#cc9860"/>
  <!-- Head outline -->
  <rect x="262" y="258" width="276" height="200" rx="18" stroke="#7c4220" stroke-width="4" fill="none"/>
  <!-- Neck -->
  <rect x="350" y="454" width="100" height="22" rx="11" fill="#b07840"/>
  <rect x="350" y="454" width="100" height="22" rx="11" stroke="#7c4220" stroke-width="2.5" fill="none"/>

  <!-- ============ TORSO ============ -->
  <rect x="278" y="474" width="244" height="168" rx="18" fill="url(#body)"/>
  <!-- Torso left highlight -->
  <rect x="278" y="474" width="48" height="168" rx="18" fill="#deb880" opacity="0.35"/>
  <!-- Torso right shadow -->
  <rect x="452" y="474" width="70" height="168" rx="18" fill="#7c3e18" opacity="0.3"/>
  <!-- Inner panel -->
  <rect x="302" y="492" width="196" height="130" rx="10" fill="#904a20" opacity="0.55"/>
  <!-- Power button -->
  <circle cx="400" cy="558" r="34" fill="#7a3a18"/>
  <circle cx="400" cy="558" r="25" fill="url(#btn)"/>
  <path d="M400 546 L400 558 M392 548 a10.5 10.5 0 1 0 16 0" stroke="rgba(255,250,200,0.92)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Torso rivets -->
  <circle cx="292" cy="490" r="7" fill="#b07840"/><circle cx="292" cy="490" r="4" fill="#cc9860"/>
  <circle cx="508" cy="490" r="7" fill="#b07840"/><circle cx="508" cy="490" r="4" fill="#cc9860"/>
  <circle cx="292" cy="636" r="7" fill="#b07840"/><circle cx="292" cy="636" r="4" fill="#cc9860"/>
  <circle cx="508" cy="636" r="7" fill="#b07840"/><circle cx="508" cy="636" r="4" fill="#cc9860"/>
  <!-- Torso outline -->
  <rect x="278" y="474" width="244" height="168" rx="18" stroke="#7c4220" stroke-width="4" fill="none"/>

  <!-- ============ LEGS ============ -->
  <!-- Left upper leg -->
  <rect x="314" y="640" width="70" height="46" rx="9" fill="#a06030"/>
  <rect x="314" y="640" width="70" height="46" rx="9" stroke="#7c4020" stroke-width="3.5" fill="none"/>
  <!-- Left lower leg -->
  <rect x="320" y="680" width="58" height="38" rx="7" fill="#8a4e22"/>
  <rect x="320" y="680" width="58" height="38" rx="7" stroke="#6a3010" stroke-width="3" fill="none"/>
  <!-- Left boot -->
  <rect x="302" y="712" width="82" height="32" rx="12" fill="#5a3010"/>
  <rect x="296" y="732" width="92" height="26" rx="13" fill="#4a2810"/>
  <rect x="296" y="732" width="92" height="26" rx="13" stroke="#2c1606" stroke-width="3" fill="none"/>

  <!-- Right upper leg -->
  <rect x="416" y="640" width="70" height="46" rx="9" fill="#a06030"/>
  <rect x="416" y="640" width="70" height="46" rx="9" stroke="#7c4020" stroke-width="3.5" fill="none"/>
  <!-- Right lower leg -->
  <rect x="422" y="680" width="58" height="38" rx="7" fill="#8a4e22"/>
  <rect x="422" y="680" width="58" height="38" rx="7" stroke="#6a3010" stroke-width="3" fill="none"/>
  <!-- Right boot -->
  <rect x="416" y="712" width="82" height="32" rx="12" fill="#5a3010"/>
  <rect x="412" y="732" width="92" height="26" rx="13" fill="#4a2810"/>
  <rect x="412" y="732" width="92" height="26" rx="13" stroke="#2c1606" stroke-width="3" fill="none"/>
</svg>
