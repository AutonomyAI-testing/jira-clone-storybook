<svg viewBox="0 0 280 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Wizard Hat -->
  <polygon points="140,20 100,100 180,100" fill="#2B4DB8" stroke="#333" stroke-width="2" />

  <!-- Hat Brim -->
  <ellipse cx="140" cy="102" rx="82" ry="18" fill="#2B4DB8" />

  <!-- Stars on Hat -->
  <g fill="#F5C518">
    <!-- Star 1 - upper left -->
    <polygon points="115,50 118,60 128,60 120,66 123,76 115,70 107,76 110,66 102,60 112,60" />
    <!-- Star 2 - upper right -->
    <polygon points="165,50 168,60 178,60 170,66 173,76 165,70 157,76 160,66 152,60 162,60" />
    <!-- Star 3 - middle -->
    <polygon points="140,65 143,75 153,75 145,81 148,91 140,85 132,91 135,81 127,75 137,75" />
    <!-- Star 4 - lower left -->
    <polygon points="110,85 113,95 123,95 115,101 118,111 110,105 102,111 105,101 97,95 107,95" />
    <!-- Star 5 - lower right -->
    <polygon points="170,85 173,95 183,95 175,101 178,111 170,105 162,111 165,101 157,95 167,95" />
  </g>

  <!-- Moons on Hat -->
  <g fill="#F5C518">
    <!-- Moon 1 -->
    <path d="M 125 70 Q 120 70 118 75 Q 120 75 125 75 Z" />
    <!-- Moon 2 -->
    <path d="M 155 70 Q 150 70 148 75 Q 150 75 155 75 Z" />
    <!-- Moon 3 -->
    <path d="M 125 100 Q 120 100 118 105 Q 120 105 125 105 Z" />
  </g>

  <!-- Monitor Body - Main Rectangle -->
  <rect x="60" y="110" width="160" height="140" rx="15" fill="#A0785A" stroke="#333" stroke-width="2" />

  <!-- Screen Area -->
  <rect x="80" y="130" width="120" height="90" rx="8" fill="#5FCC38" stroke="#333" stroke-width="2" />

  <!-- Screen Glare/Reflection -->
  <rect x="90" y="140" width="40" height="25" rx="4" fill="#E8F5E9" opacity="0.6" />

  <!-- Body Center Button/Knob -->
  <circle cx="140" cy="240" r="8" fill="#F5C518" stroke="#333" stroke-width="1" />

  <!-- Left Arm -->
  <rect x="35" y="150" width="25" height="80" rx="5" fill="#4A4A4A" stroke="#333" stroke-width="2" />

  <!-- Left Hand/Glove -->
  <ellipse cx="25" cy="200" rx="18" ry="22" fill="white" stroke="#333" stroke-width="2" />

  <!-- Left Hand Fingers -->
  <g fill="white" stroke="#333" stroke-width="1">
    <rect x="10" y="185" width="4" height="8" />
    <rect x="15" y="182" width="4" height="10" />
    <rect x="20" y="183" width="4" height="10" />
    <rect x="25" y="185" width="4" height="8" />
  </g>

  <!-- Right Arm -->
  <rect x="220" y="150" width="25" height="80" rx="5" fill="#4A4A4A" stroke="#333" stroke-width="2" />

  <!-- Right Hand/Glove -->
  <ellipse cx="255" cy="200" rx="18" ry="22" fill="white" stroke="#333" stroke-width="2" />

  <!-- Right Hand Fingers -->
  <g fill="white" stroke="#333" stroke-width="1">
    <rect x="250" y="185" width="4" height="8" />
    <rect x="255" y="182" width="4" height="10" />
    <rect x="260" y="183" width="4" height="10" />
    <rect x="265" y="185" width="4" height="8" />
  </g>

  <!-- Left Leg -->
  <rect x="85" y="250" width="25" height="40" rx="4" fill="#7B4B2A" stroke="#333" stroke-width="2" />

  <!-- Left Foot -->
  <rect x="80" y="290" width="35" height="20" rx="3" fill="#5A3520" stroke="#333" stroke-width="2" />

  <!-- Right Leg -->
  <rect x="170" y="250" width="25" height="40" rx="4" fill="#7B4B2A" stroke="#333" stroke-width="2" />

  <!-- Right Foot -->
  <rect x="165" y="290" width="35" height="20" rx="3" fill="#5A3520" stroke="#333" stroke-width="2" />

  <!-- Base Disc -->
  <ellipse cx="140" cy="315" rx="70" ry="15" fill="#333" opacity="0.3" />
</svg>
