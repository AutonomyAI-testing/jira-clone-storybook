<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      .guide-lines { stroke: #8B7355; stroke-width: 1.5; fill: none; }
      .guide-line-circle { stroke: #8B7355; stroke-width: 1.5; fill: none; }
    </style>
    <radialGradient id="screenGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#A8D5A8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7BC97B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5FA85F;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Beige/cream textured background -->
  <rect width="500" height="500" fill="#E8DCC8"/>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" seed="2"/>
    <feColorMatrix in="noise" type="saturate" values="0.3"/>
    <feBlend in="SourceGraphic" in2="noise" mode="overlay"/>
  </filter>
  <rect width="500" height="500" fill="#E8DCC8" opacity="0.15" filter="url(#grain)"/>
  
  <!-- Vitruvian Man guide lines (adjusted for 500x500 canvas) -->
  <!-- Outer circle -->
  <circle cx="250" cy="250" r="200" class="guide-line-circle"/>
  
  <!-- Rectangle frame -->
  <rect x="80" y="80" width="340" height="340" class="guide-lines"/>
  
  <!-- Horizontal center line -->
  <line x1="80" y1="250" x2="420" y2="250" class="guide-lines"/>
  
  <!-- Vertical center line -->
  <line x1="250" y1="80" x2="250" y2="420" class="guide-lines"/>
  
  <!-- Upper horizontal line (for proportions) -->
  <line x1="80" y1="160" x2="420" y2="160" class="guide-lines"/>
  
  <!-- Wizard Hat - tall and prominent with darker navy -->
  <!-- Hat cone - tall dark navy blue -->
  <path d="M 250 15 Q 210 60 190 110 Q 185 135 250 165 Q 315 135 310 110 Q 290 60 250 15" fill="#152d5e" stroke="#0d1f4a" stroke-width="2.5"/>
  
  <!-- Hat cone shading -->
  <path d="M 250 25 Q 230 65 215 115" fill="none" stroke="#0d1f4a" stroke-width="2" opacity="0.5"/>
  
  <!-- Hat brim - very wide flat disk -->
  <ellipse cx="250" cy="165" rx="145" ry="48" fill="#1e3f8a" stroke="#0d1f4a" stroke-width="2.5"/>
  <ellipse cx="250" cy="162" rx="142" ry="45" fill="#1e3f8a"/>
  
  <!-- Hat brim shadow/depth on edges -->
  <ellipse cx="250" cy="169" rx="128" ry="32" fill="#1a3a7a" opacity="0.4"/>
  
  <!-- Hat brim front edge highlight -->
  <ellipse cx="250" cy="160" rx="140" ry="11" fill="#3d7ac8" opacity="0.6"/>
  
  <!-- Yellow stars on hat - more prominent -->
  <!-- Star 1 (top cone) -->
  <g transform="translate(235, 70)">
    <polygon points="0,-8 2.4,-2.5 8,-1 3.5,3 5.5,9 0,4 -5.5,9 -3.5,3 -8,-1 -2.4,-2.5" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Star 2 (top cone right) -->
  <g transform="translate(265, 65)">
    <polygon points="0,-8 2.4,-2.5 8,-1 3.5,3 5.5,9 0,4 -5.5,9 -3.5,3 -8,-1 -2.4,-2.5" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Star 3 (middle cone) -->
  <g transform="translate(250, 55)">
    <polygon points="0,-9 2.7,-3 9,-1.5 4,3 6,10 0,5 -6,10 -4,3 -9,-1.5 -2.7,-3" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Star 4 (upper left cone) -->
  <g transform="translate(210, 100)">
    <polygon points="0,-7 2.1,-2 7,-0.5 3,2.5 5,8 0,4 -5,8 -3,2.5 -7,-0.5 -2.1,-2" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Star 5 (upper right cone) -->
  <g transform="translate(290, 105)">
    <polygon points="0,-7 2.1,-2 7,-0.5 3,2.5 5,8 0,4 -5,8 -3,2.5 -7,-0.5 -2.1,-2" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Star 6 (brim left) -->
  <g transform="translate(170, 155)">
    <polygon points="0,-6 1.8,-1.5 6,-0.5 2.5,2.5 4,7 0,3.5 -4,7 -2.5,2.5 -6,-0.5 -1.8,-1.5" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Star 7 (brim right) -->
  <g transform="translate(330, 160)">
    <polygon points="0,-6 1.8,-1.5 6,-0.5 2.5,2.5 4,7 0,3.5 -4,7 -2.5,2.5 -6,-0.5 -1.8,-1.5" fill="#FFD700" stroke="#E6A500" stroke-width="1"/>
  </g>
  
  <!-- Crescent moon on hat - left upper -->
  <g transform="translate(215, 95)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="9" fill="#FFD700"/>
    <!-- Inner circle (cutout) for crescent -->
    <circle cx="3" cy="0" r="9" fill="#1a3a7a"/>
  </g>
  
  <!-- Crescent moon on hat - right upper -->
  <g transform="translate(285, 100)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="9" fill="#FFD700"/>
    <!-- Inner circle (cutout) for crescent -->
    <circle cx="3" cy="0" r="9" fill="#1a3a7a"/>
  </g>
  
  <!-- Crescent moon on hat - center lower -->
  <g transform="translate(250, 130)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="8" fill="#FFD700"/>
    <!-- Inner circle (cutout) for crescent -->
    <circle cx="2.5" cy="0" r="8" fill="#1a3a7a"/>
  </g>
  
  <!-- Crescent moon on hat - left side of brim -->
  <g transform="translate(175, 160)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="7" fill="#FFD700"/>
    <!-- Inner circle (cutout) for crescent -->
    <circle cx="2" cy="0" r="7" fill="#1a3a7a"/>
  </g>
  
  <!-- Crescent moon on hat - right side of brim -->
  <g transform="translate(325, 165)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="7" fill="#FFD700"/>
    <!-- Inner circle (cutout) for crescent -->
    <circle cx="2" cy="0" r="7" fill="#1a3a7a"/>
  </g>
  
  <!-- Robot body - rectangular/boxy shape -->
  <!-- Main body/torso outer rect -->
  <rect x="168" y="245" width="164" height="145" rx="28" fill="#A0826D" stroke="#6B5344" stroke-width="2.5"/>
  <!-- Main body/torso inner rect -->
  <rect x="173" y="250" width="154" height="135" rx="25" fill="#B89968"/>
  
  <!-- Body left side shadow/shading -->
  <ellipse cx="195" cy="320" rx="45" ry="55" fill="#8B6F4E" opacity="0.5"/>
  
  <!-- Body right side highlight -->
  <ellipse cx="305" cy="310" rx="40" ry="48" fill="#D4AF82" opacity="0.4"/>
  
  <!-- Shoulder/body top -->
  <ellipse cx="250" cy="215" rx="100" ry="58" fill="#B89968" stroke="#6B5344" stroke-width="2.5"/>
  <ellipse cx="250" cy="213" rx="97" ry="55" fill="#C9A87A"/>
  
  <!-- Pocket on body -->
  <rect x="230" y="335" width="40" height="50" rx="5" fill="#6B5344" stroke="#4A3A2A" stroke-width="1.5"/>
  <rect x="238" y="343" width="24" height="34" fill="#8B7355" rx="3"/>
  
  <!-- Button/knob on pocket (larger and more visible) -->
  <circle cx="250" cy="380" r="10" fill="#D4A550" stroke="#A68840" stroke-width="2"/>
  <circle cx="250" cy="380" r="7" fill="#E8C86A"/>
  <circle cx="253" cy="377" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Legs/boots - larger and blockier (adjusted for 500x500) -->
  <!-- Left boot -->
  <ellipse cx="205" cy="430" rx="48" ry="60" fill="#6B5344" stroke="#4A3A2A" stroke-width="2"/>
  <rect x="162" y="440" width="86" height="50" rx="8" fill="#6B5344" stroke="#4A3A2A" stroke-width="2"/>
  <!-- Left boot sole -->
  <rect x="162" y="480" width="86" height="18" fill="#3A2A1A" stroke="#1A0A0A" stroke-width="1"/>
  <!-- Left boot detail -->
  <rect x="165" y="405" width="80" height="12" rx="4" fill="#8B7355" opacity="0.6"/>
  
  <!-- Right boot -->
  <ellipse cx="295" cy="430" rx="48" ry="60" fill="#6B5344" stroke="#4A3A2A" stroke-width="2"/>
  <rect x="252" y="440" width="86" height="50" rx="8" fill="#6B5344" stroke="#4A3A2A" stroke-width="2"/>
  <!-- Right boot sole -->
  <rect x="252" y="480" width="86" height="18" fill="#3A2A1A" stroke="#1A0A0A" stroke-width="1"/>
  <!-- Right boot detail -->
  <rect x="255" y="405" width="80" height="12" rx="4" fill="#8B7355" opacity="0.6"/>
  
  <!-- Arms/Gloves - Vitruvian Man pose with 4 arms spreading wide (repositioned for 500x500) -->
  <!-- Upper left arm (angling up-outward) -->
  <line x1="155" y1="230" x2="55" y2="115" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round"/>
  <!-- Upper left glove (drawn after arm so it appears on top) -->
  <g transform="translate(55, 115)">
    <circle cx="0" cy="0" r="28" fill="#F5F0E8" stroke="#000" stroke-width="3"/>
    <ellipse cx="0" cy="16" rx="26" ry="11" fill="#E8DED0" stroke="#000" stroke-width="2"/>
    <g fill="#F5F0E8" stroke="#000" stroke-width="1.5">
      <circle cx="-18" cy="-14" r="9"/>
      <circle cx="0" cy="-20" r="10"/>
      <circle cx="18" cy="-16" r="9"/>
      <circle cx="16" cy="12" r="8"/>
    </g>
  </g>
  
  <!-- Upper right arm (angling up-outward) -->
  <line x1="345" y1="230" x2="445" y2="115" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round"/>
  <!-- Upper right glove (drawn after arm so it appears on top) -->
  <g transform="translate(445, 115)">
    <circle cx="0" cy="0" r="28" fill="#F5F0E8" stroke="#000" stroke-width="3"/>
    <ellipse cx="0" cy="16" rx="26" ry="11" fill="#E8DED0" stroke="#000" stroke-width="2"/>
    <g fill="#F5F0E8" stroke="#000" stroke-width="1.5">
      <circle cx="-18" cy="-14" r="9"/>
      <circle cx="0" cy="-20" r="10"/>
      <circle cx="18" cy="-16" r="9"/>
      <circle cx="-16" cy="12" r="8"/>
    </g>
  </g>
  
  <!-- Lower left arm (angling down-outward) -->
  <line x1="165" y1="390" x2="80" y2="455" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round"/>
  <!-- Lower left glove (drawn after arm so it appears on top) -->
  <g transform="translate(80, 455)">
    <circle cx="0" cy="0" r="26" fill="#F5F0E8" stroke="#000" stroke-width="3"/>
    <ellipse cx="0" cy="-14" rx="24" ry="10" fill="#E8DED0" stroke="#000" stroke-width="2"/>
    <g fill="#F5F0E8" stroke="#000" stroke-width="1.5">
      <circle cx="-16" cy="-12" r="8"/>
      <circle cx="0" cy="-18" r="9"/>
      <circle cx="16" cy="-14" r="8"/>
      <circle cx="14" cy="10" r="7"/>
    </g>
  </g>
  
  <!-- Lower right arm (angling down-outward) -->
  <line x1="335" y1="390" x2="420" y2="455" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round"/>
  <!-- Lower right glove (drawn after arm so it appears on top) -->
  <g transform="translate(420, 455)">
    <circle cx="0" cy="0" r="26" fill="#F5F0E8" stroke="#000" stroke-width="3"/>
    <ellipse cx="0" cy="-14" rx="24" ry="10" fill="#E8DED0" stroke="#000" stroke-width="2"/>
    <g fill="#F5F0E8" stroke="#000" stroke-width="1.5">
      <circle cx="-16" cy="-12" r="8"/>
      <circle cx="0" cy="-18" r="9"/>
      <circle cx="16" cy="-14" r="8"/>
      <circle cx="-14" cy="10" r="7"/>
    </g>
  </g>
  
  <!-- TV Screen Head (drawn LAST so it appears on top of body - enlarged to fill more head area) -->
  <!-- Screen frame/bezel - brown outer (150x120 to fill more head area) -->
  <rect x="175" y="130" width="150" height="130" rx="14" fill="#6B5344" stroke="#4A3A2A" stroke-width="2.5"/>
  <!-- Screen frame/bezel - brown inner -->
  <rect x="184" y="139" width="132" height="112" rx="12" fill="#8B6F4E" stroke="#6B5344" stroke-width="2"/>
  <rect x="191" y="146" width="118" height="98" rx="10" fill="#A0826D"/>
  
  <!-- Screen glass/display - green gradient (made larger: 110x80 to fill more of head) -->
  <rect x="205" y="160" width="110" height="80" rx="6" fill="url(#screenGradient)" stroke="#4A8A4A" stroke-width="1.5"/>
  
  <!-- Screen white highlight/reflection blob (larger and more prominent) -->
  <ellipse cx="225" cy="175" rx="26" ry="20" fill="#FFFFFF" opacity="0.75"/>
  <ellipse cx="250" cy="195" rx="15" ry="12" fill="#F5F5F5" opacity="0.5"/>
  
  <!-- Screen lines (CRT effect) -->
  <line x1="205" y1="168" x2="315" y2="168" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="178" x2="315" y2="178" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="188" x2="315" y2="188" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="198" x2="315" y2="198" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="208" x2="315" y2="208" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="218" x2="315" y2="218" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
  <line x1="205" y1="228" x2="315" y2="228" stroke="#3A7A3A" stroke-width="0.5" opacity="0.3"/>
</svg>
