<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
  <defs>
    <radialGradient id="screenGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c8ff70"/>
      <stop offset="60%" stop-color="#6acd00"/>
      <stop offset="100%" stop-color="#3a8a00"/>
    </radialGradient>
    <radialGradient id="hatShade" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3a5ccc"/>
      <stop offset="100%" stop-color="#1a2e6a"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b89060"/>
      <stop offset="100%" stop-color="#7a5a30"/>
    </radialGradient>
  </defs>

  <!-- Parchment background with texture -->
  <rect width="520" height="520" fill="#ede3cc"/>
  <circle cx="80" cy="60" r="2.5" fill="#c0a878" opacity="0.5"/>
  <circle cx="420" cy="80" r="2.5" fill="#c0a878" opacity="0.5"/>
  <circle cx="50" cy="350" r="2.5" fill="#c0a878" opacity="0.4"/>
  <circle cx="480" cy="400" r="3" fill="#c0a878" opacity="0.5"/>
  <circle cx="490" cy="270" r="2" fill="#c0a878" opacity="0.4"/>
  <circle cx="30" cy="200" r="2" fill="#c0a878" opacity="0.35"/>
  <circle cx="300" cy="50" r="1.8" fill="#c0a878" opacity="0.4"/>
  <circle cx="100" cy="460" r="2.5" fill="#c0a878" opacity="0.45"/>

  <!-- Vitruvian Man geometric lines - prominent brownish-red -->
  <circle cx="260" cy="300" r="200" fill="none" stroke="#8a5530" stroke-width="2.5" opacity="0.75"/>
  <rect x="108" y="190" width="304" height="268" fill="none" stroke="#8a5530" stroke-width="2.2" opacity="0.72"/>
  <line x1="260" y1="95" x2="260" y2="505" stroke="#8a5530" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="300" x2="460" y2="300" stroke="#8a5530" stroke-width="1" opacity="0.3"/>

  <!-- ====== LEFT ARM - fully horizontal with slight downward ====== -->
  <!-- Upper arm -->
  <rect x="110" y="256" width="76" height="16" rx="8" fill="#484848" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Elbow joint with bolts -->
  <circle cx="110" cy="264" r="13" fill="#363636" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="110" cy="264" r="6" fill="#505050" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="104" cy="258" r="2.5" fill="#666" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="116" cy="270" r="2.5" fill="#666" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Forearm -->
  <rect x="40" y="257" width="74" height="14" rx="7" fill="#484848" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Wrist cuff -->
  <rect x="30" y="251" width="18" height="26" rx="5" fill="white" stroke="#222" stroke-width="2"/>

  <!-- Left glove - prominent, clear fingers spread open -->  
  <!-- Wrist connector -->
  <ellipse cx="32" cy="264" rx="12" ry="9" fill="white" stroke="#222" stroke-width="2"/>
  <g transform="translate(32,264)">
    <!-- Palm -->
    <ellipse cx="-14" cy="0" rx="18" ry="15" fill="white" stroke="#222" stroke-width="2.2"/>
    <!-- Thumb pointing up -->
    <ellipse cx="-10" cy="-18" rx="8" ry="5.5" fill="white" stroke="#222" stroke-width="2" transform="rotate(-10,-10,-18)"/>
    <!-- Index -->
    <ellipse cx="-22" cy="-24" rx="7.5" ry="5" fill="white" stroke="#222" stroke-width="2" transform="rotate(-35,-22,-24)"/>
    <!-- Middle -->
    <ellipse cx="-31" cy="-21" rx="7.5" ry="5" fill="white" stroke="#222" stroke-width="2" transform="rotate(-58,-31,-21)"/>
    <!-- Ring -->
    <ellipse cx="-35" cy="-10" rx="7" ry="4.8" fill="white" stroke="#222" stroke-width="2" transform="rotate(-76,-35,-10)"/>
    <!-- Pinky -->
    <ellipse cx="-33" cy="3" rx="6" ry="4.2" fill="white" stroke="#222" stroke-width="2" transform="rotate(-92,-33,3)"/>
  </g>

  <!-- ====== RIGHT ARM - fully horizontal with slight downward ====== -->
  <!-- Upper arm -->
  <rect x="334" y="256" width="76" height="16" rx="8" fill="#484848" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Elbow joint with bolts -->
  <circle cx="410" cy="264" r="13" fill="#363636" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="410" cy="264" r="6" fill="#505050" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="404" cy="258" r="2.5" fill="#666" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="416" cy="270" r="2.5" fill="#666" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Forearm -->
  <rect x="406" y="257" width="74" height="14" rx="7" fill="#484848" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Wrist cuff -->
  <rect x="472" y="251" width="18" height="26" rx="5" fill="white" stroke="#222" stroke-width="2"/>

  <!-- Right glove - prominent, clear fingers spread open (mirrored) -->
  <!-- Wrist connector -->
  <ellipse cx="488" cy="264" rx="12" ry="9" fill="white" stroke="#222" stroke-width="2"/>
  <g transform="translate(488,264)">
    <!-- Palm -->
    <ellipse cx="14" cy="0" rx="18" ry="15" fill="white" stroke="#222" stroke-width="2.2"/>
    <!-- Thumb pointing up -->
    <ellipse cx="10" cy="-18" rx="8" ry="5.5" fill="white" stroke="#222" stroke-width="2" transform="rotate(10,10,-18)"/>
    <!-- Index -->
    <ellipse cx="22" cy="-24" rx="7.5" ry="5" fill="white" stroke="#222" stroke-width="2" transform="rotate(35,22,-24)"/>
    <!-- Middle -->
    <ellipse cx="31" cy="-21" rx="7.5" ry="5" fill="white" stroke="#222" stroke-width="2" transform="rotate(58,31,-21)"/>
    <!-- Ring -->
    <ellipse cx="35" cy="-10" rx="7" ry="4.8" fill="white" stroke="#222" stroke-width="2" transform="rotate(76,35,-10)"/>
    <!-- Pinky -->
    <ellipse cx="33" cy="3" rx="6" ry="4.2" fill="white" stroke="#222" stroke-width="2" transform="rotate(92,33,3)"/>
  </g>

  <!-- ====== ROBOT BODY ====== -->
  <!-- Shoulder connectors -->
  <circle cx="186" cy="265" r="17" fill="url(#bodyGrad)" stroke="#222" stroke-width="2.5"/>
  <circle cx="334" cy="265" r="17" fill="url(#bodyGrad)" stroke="#222" stroke-width="2.5"/>

  <!-- Torso -->
  <rect x="163" y="282" width="194" height="132" rx="12" fill="url(#bodyGrad)" stroke="#222" stroke-width="2.5"/>
  <!-- Side panels -->
  <rect x="168" y="289" width="28" height="119" rx="6" fill="#7a5a30" stroke="#222" stroke-width="1.5"/>
  <rect x="324" y="289" width="28" height="119" rx="6" fill="#7a5a30" stroke="#222" stroke-width="1.5"/>
  <!-- Bolts -->
  <circle cx="176" cy="303" r="4.5" fill="#c8a060" stroke="#222" stroke-width="1.5"/>
  <circle cx="176" cy="393" r="4.5" fill="#c8a060" stroke="#222" stroke-width="1.5"/>
  <circle cx="344" cy="303" r="4.5" fill="#c8a060" stroke="#222" stroke-width="1.5"/>
  <circle cx="344" cy="393" r="4.5" fill="#c8a060" stroke="#222" stroke-width="1.5"/>
  <!-- Chest panel -->
  <rect x="198" y="305" width="124" height="86" rx="8" fill="#6a4a20" stroke="#222" stroke-width="2"/>
  <!-- Chest ridges -->
  <rect x="198" y="333" width="124" height="7" rx="2" fill="#5a3a15" stroke="#222" stroke-width="1"/>
  <rect x="198" y="355" width="124" height="7" rx="2" fill="#5a3a15" stroke="#222" stroke-width="1"/>
  <!-- Golden button -->
  <circle cx="260" cy="348" r="18" fill="#c88820" stroke="#222" stroke-width="2"/>
  <circle cx="260" cy="348" r="13" fill="#f0b030" stroke="#222" stroke-width="1.5"/>
  <circle cx="260" cy="348" r="6" fill="#c88820" stroke="#222" stroke-width="1"/>
  <ellipse cx="255" cy="342" rx="5" ry="3.5" fill="white" opacity="0.4"/>

  <!-- ====== LEGS ====== -->
  <rect x="196" y="412" width="42" height="30" rx="6" fill="#7a5a30" stroke="#222" stroke-width="2.2"/>
  <rect x="200" y="437" width="34" height="9" rx="3" fill="#5a4020" stroke="#222" stroke-width="1.5"/>
  <rect x="182" y="444" width="64" height="26" rx="8" fill="#3a2810" stroke="#222" stroke-width="2.2"/>
  <ellipse cx="202" cy="454" rx="10" ry="5" fill="#5a3820" opacity="0.5"/>
  <rect x="282" y="412" width="42" height="30" rx="6" fill="#7a5a30" stroke="#222" stroke-width="2.2"/>
  <rect x="286" y="437" width="34" height="9" rx="3" fill="#5a4020" stroke="#222" stroke-width="1.5"/>
  <rect x="274" y="444" width="64" height="26" rx="8" fill="#3a2810" stroke="#222" stroke-width="2.2"/>
  <ellipse cx="318" cy="454" rx="10" ry="5" fill="#5a3820" opacity="0.5"/>

  <!-- ====== ROBOT HEAD (TV Monitor) ====== -->
  <!-- Neck -->
  <rect x="236" y="270" width="48" height="18" rx="5" fill="#7a5a30" stroke="#222" stroke-width="2"/>
  <!-- Monitor outer frame -->
  <rect x="150" y="165" width="220" height="112" rx="14" fill="url(#bodyGrad)" stroke="#222" stroke-width="3"/>
  <!-- Inner bezel -->
  <rect x="166" y="178" width="188" height="87" rx="9" fill="#6a4a20" stroke="#222" stroke-width="2"/>
  <!-- CRT Screen -->
  <rect x="175" y="186" width="170" height="71" rx="6" fill="url(#screenGlow)"/>
  <!-- Screen glare - more dynamic highlights -->
  <ellipse cx="217" cy="208" rx="48" ry="20" fill="white" opacity="0.32" transform="rotate(-12,217,208)"/>
  <ellipse cx="206" cy="199" rx="26" ry="11" fill="white" opacity="0.55" transform="rotate(-12,206,199)"/>
  <!-- Cloud organic shapes on screen (like reference) -->
  <ellipse cx="316" cy="220" rx="24" ry="15" fill="#c8f060" opacity="0.5"/>
  <ellipse cx="298" cy="230" rx="18" ry="12" fill="#90d030" opacity="0.4"/>
  <ellipse cx="320" cy="232" rx="12" ry="8" fill="#b0e850" opacity="0.35"/>
  <!-- Vents -->
  <rect x="155" y="198" width="8" height="4" rx="2" fill="#5a3a10"/>
  <rect x="155" y="206" width="8" height="4" rx="2" fill="#5a3a10"/>
  <rect x="155" y="214" width="8" height="4" rx="2" fill="#5a3a10"/>
  <rect x="357" y="198" width="8" height="4" rx="2" fill="#5a3a10"/>
  <rect x="357" y="206" width="8" height="4" rx="2" fill="#5a3a10"/>
  <rect x="357" y="214" width="8" height="4" rx="2" fill="#5a3a10"/>
  <!-- Monitor chin -->
  <rect x="220" y="275" width="80" height="7" rx="3.5" fill="#6a4a20" stroke="#222" stroke-width="1.5"/>

  <!-- ====== WIZARD HAT ====== -->
  <!-- Brim shadow -->
  <ellipse cx="264" cy="183" rx="152" ry="27" fill="#08144a" opacity="0.42"/>
  <!-- Brim main surface -->
  <ellipse cx="260" cy="178" rx="148" ry="24" fill="#2a40a0" stroke="#0a1030" stroke-width="2.5"/>
  <!-- Brim highlight -->
  <ellipse cx="236" cy="172" rx="102" ry="13" fill="#4060cc" opacity="0.6"/>
  <!-- Brim inner rim -->
  <ellipse cx="260" cy="184" rx="122" ry="16" fill="#1a2860" opacity="0.3"/>

  <!-- Hat cone body - clean triangle cone leaning slightly right -->
  <polygon points="152,174 348,174 325,18" fill="url(#hatShade)" stroke="#0a1030" stroke-width="2.5"/>
  <!-- Right shadow side -->
  <polygon points="255,174 348,174 325,18" fill="#08142a" opacity="0.38"/>
  <!-- Left highlight side -->
  <polygon points="152,174 255,174 325,18" fill="#4060cc" opacity="0.22"/>
  <!-- Drooping tip - small curved accent to the right -->
  <path d="M325,18 Q352,22 358,48 Q350,38 338,28 Z" fill="#2a40a0" stroke="#0a1030" stroke-width="1.5"/>

  <!-- Stars on hat with dimension - lighter colors to match lighter blue -->
  <!-- Main star on cone -->
  <g transform="translate(256,108) rotate(6)">
    <polygon points="0,-14 3.5,-5 13,-5 5.5,1 8.5,11 0,5 -8.5,11 -5.5,1 -13,-5 -3.5,-5" fill="#ffd700" stroke="#b8860b" stroke-width="1.2"/>
    <polygon points="0,-14 3.5,-5 0,-8 -3.5,-5" fill="#ffe880" opacity="0.65"/>
  </g>
  <!-- Star left brim -->
  <g transform="translate(182,171)">
    <polygon points="0,-11 2.8,-4 10.5,-4 4.4,1 6.8,8.5 0,4 -6.8,8.5 -4.4,1 -10.5,-4 -2.8,-4" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <polygon points="0,-11 2.8,-4 0,-6.5 -2.8,-4" fill="#ffe880" opacity="0.6"/>
  </g>
  <!-- Star right brim -->
  <g transform="translate(342,170)">
    <polygon points="0,-11 2.8,-4 10.5,-4 4.4,1 6.8,8.5 0,4 -6.8,8.5 -4.4,1 -10.5,-4 -2.8,-4" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
  </g>
  <!-- Star on lower-left cone -->
  <g transform="translate(213,138) rotate(-5)">
    <polygon points="0,-10 2.5,-3.5 9.5,-3.5 4,1 6,8 0,4 -6,8 -4,1 -9.5,-3.5 -2.5,-3.5" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <polygon points="0,-10 2.5,-3.5 0,-6 -2.5,-3.5" fill="#ffe880" opacity="0.5"/>
  </g>
  <!-- Star on drooping tip area -->
  <g transform="translate(310,72) rotate(18)">
    <polygon points="0,-9 2.2,-3 8.5,-3 3.5,0.8 5.5,7 0,3.5 -5.5,7 -3.5,0.8 -8.5,-3 -2.2,-3" fill="#ffd700" stroke="#b8860b" stroke-width="0.9"/>
  </g>

  <!-- Crescent moons on hat -->
  <!-- Moon on tip area -->
  <g transform="translate(314,42) rotate(30)">
    <circle cx="0" cy="0" r="12" fill="#ffd700" stroke="#b8860b" stroke-width="1.2"/>
    <circle cx="7" cy="-4" r="9.5" fill="#1a2a6a"/>
    <ellipse cx="-4" cy="-5" rx="3" ry="2" fill="#ffe880" opacity="0.5"/>
  </g>
  <!-- Moon left brim -->
  <g transform="translate(222,174) rotate(-5)">
    <circle cx="0" cy="0" r="10" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="6" cy="-3" r="8" fill="#1a2a6a"/>
    <ellipse cx="-3" cy="-4" rx="2.5" ry="1.5" fill="#ffe880" opacity="0.5"/>
  </g>
  <!-- Moon right brim -->
  <g transform="translate(312,174) rotate(10)">
    <circle cx="0" cy="0" r="9" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
    <circle cx="5" cy="-3" r="7" fill="#1a2a6a"/>
  </g>
  <!-- Moon mid-left cone -->
  <g transform="translate(237,118) rotate(-18)">
    <circle cx="0" cy="0" r="8" fill="#ffd700" stroke="#b8860b" stroke-width="0.8"/>
    <circle cx="5" cy="-2" r="6.2" fill="#1a2a6a"/>
  </g>
</svg>
