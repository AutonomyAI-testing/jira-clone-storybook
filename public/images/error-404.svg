<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550">
  <defs>
    <!-- Filters for texture and effects -->
    <filter id="parchmentTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" />
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2" />
    </filter>
    
    <!-- Screen display gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7FD862;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6BC74F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA840;stop-opacity:1" />
    </linearGradient>
    
    <!-- Potion liquid pattern -->
    <pattern id="potionPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <ellipse cx="25" cy="20" rx="15" ry="10" fill="#9FD562" opacity="0.5" />
      <ellipse cx="60" cy="40" rx="18" ry="12" fill="#7FD862" opacity="0.6" />
      <path d="M 30 50 Q 50 45 70 60" stroke="#AAEA6A" stroke-width="2" fill="none" opacity="0.4" />
    </pattern>
  </defs>
  
  <!-- Background with aged paper texture -->
  <rect width="500" height="550" fill="#F5E6D3" />
  
  <!-- Speckled texture overlay for aged paper effect -->
  <g opacity="0.15">
    <circle cx="50" cy="80" r="1.5" fill="#8B7355" />
    <circle cx="120" cy="150" r="1" fill="#8B7355" />
    <circle cx="200" cy="100" r="1.2" fill="#8B7355" />
    <circle cx="300" cy="180" r="1" fill="#8B7355" />
    <circle cx="380" cy="120" r="1.5" fill="#8B7355" />
    <circle cx="420" cy="250" r="1" fill="#8B7355" />
    <circle cx="80" cy="350" r="1.2" fill="#8B7355" />
    <circle cx="160" cy="400" r="1" fill="#8B7355" />
    <circle cx="250" cy="450" r="1.5" fill="#8B7355" />
    <circle cx="350" cy="380" r="1" fill="#8B7355" />
    <circle cx="450" cy="320" r="1.2" fill="#8B7355" />
  </g>
  
  <!-- Outer decorative circle frame -->
  <circle cx="250" cy="270" r="180" fill="none" stroke="#8B7355" stroke-width="2" opacity="0.6" />
  
  <!-- Inner rectangle frame -->
  <rect x="130" y="120" width="240" height="300" fill="none" stroke="#8B7355" stroke-width="1.5" opacity="0.5" />
  
  <!-- Horizontal dividing line -->
  <line x1="130" y1="270" x2="370" y2="270" stroke="#8B7355" stroke-width="1" opacity="0.4" />
  
  <!-- WIZARD HAT GROUP -->
  <g id="wizard-hat" filter="url(#shadow)">
    <!-- Hat brim - wide oval base -->
    <ellipse cx="250" cy="155" rx="80" ry="22" fill="#1e3a5f" stroke="#0f2236" stroke-width="1.5" />
    
    <!-- Shading on brim -->
    <ellipse cx="250" cy="158" rx="75" ry="12" fill="#152e50" opacity="0.4" />
    
    <!-- Main hat cone using curved path for droopy effect -->
    <path d="M 170 155 Q 160 130 155 95 Q 152 60 250 40 Q 348 60 345 95 Q 340 130 330 155 Z" 
          fill="#1e3a5f" stroke="#0f2236" stroke-width="1.5" />
    
    <!-- Hat tip - droopy curved end -->
    <path d="M 245 40 Q 240 25 235 15 Q 232 8 240 5 Q 248 12 250 30 Z" 
          fill="#1e3a5f" stroke="#0f2236" stroke-width="1" />
    
    <!-- Hat shading for dimension -->
    <ellipse cx="220" cy="80" rx="30" ry="50" fill="#152e50" opacity="0.3" />
    
    <!-- STARS on hat - scattered pattern -->
    <!-- Top star -->
    <g transform="translate(250, 55)">
      <polygon points="0,-6 1.5,-2 6,-2 2.5,1 4,6 0,3 -4,6 -2.5,1 -6,-2 -1.5,-2" 
               fill="#FFD700" stroke="#DAA500" stroke-width="0.5" />
    </g>
    
    <!-- Left upper star -->
    <g transform="translate(195, 75)">
      <polygon points="0,-5 1.2,-1.5 5,-1.5 2,1.5 3.5,5.5 0,2.5 -3.5,5.5 -2,1.5 -5,-1.5 -1.2,-1.5" 
               fill="#FFD700" stroke="#DAA500" stroke-width="0.4" />
    </g>
    
    <!-- Right upper star -->
    <g transform="translate(305, 75)">
      <polygon points="0,-5 1.2,-1.5 5,-1.5 2,1.5 3.5,5.5 0,2.5 -3.5,5.5 -2,1.5 -5,-1.5 -1.2,-1.5" 
               fill="#FFD700" stroke="#DAA500" stroke-width="0.4" />
    </g>
    
    <!-- Left middle star -->
    <g transform="translate(180, 110)">
      <polygon points="0,-4 1,-1 4,-1 1.5,1 2.5,4.5 0,2 -2.5,4.5 -1.5,1 -4,-1 -1,-1" 
               fill="#FFD700" stroke="#DAA500" stroke-width="0.3" />
    </g>
    
    <!-- Right middle star -->
    <g transform="translate(320, 110)">
      <polygon points="0,-4 1,-1 4,-1 1.5,1 2.5,4.5 0,2 -2.5,4.5 -1.5,1 -4,-1 -1,-1" 
               fill="#FFD700" stroke="#DAA500" stroke-width="0.3" />
    </g>
    
    <!-- MOONS on hat -->
    <!-- Left moon crescent -->
    <g transform="translate(200, 130)">
      <circle cx="0" cy="0" r="7" fill="#FFD700" />
      <circle cx="3" cy="0" r="7" fill="#1e3a5f" />
    </g>
    
    <!-- Right moon crescent -->
    <g transform="translate(300, 130)">
      <circle cx="0" cy="0" r="7" fill="#FFD700" />
      <circle cx="3" cy="0" r="7" fill="#1e3a5f" />
    </g>
  </g>
  
  <!-- ROBOT BODY GROUP -->
  <g id="robot-body" filter="url(#shadow)">
    <!-- Main body - enlarged proportions -->
    <rect x="145" y="170" width="210" height="200" rx="12" fill="#A0826B" stroke="#654321" stroke-width="2" />
    
    <!-- Body darker shading for dimension -->
    <rect x="145" y="170" width="210" height="40" rx="12" fill="#8B7355" opacity="0.5" />
    <ellipse cx="250" cy="175" rx="105" ry="25" fill="#6B5845" opacity="0.3" />
    
    <!-- TV SCREEN FRAME (brown outer frame) -->
    <g id="screen">
      <!-- Outer brown frame with rounded corners -->
      <rect x="175" y="200" width="150" height="110" rx="10" fill="#6B5A3D" stroke="#4A3D2A" stroke-width="2.5" />
      
      <!-- Inner bezel detail -->
      <rect x="180" y="205" width="140" height="100" fill="#5A4A33" rx="8" stroke="#3A2A1D" stroke-width="1" />
      
      <!-- Screen glass/border -->
      <rect x="185" y="210" width="130" height="90" fill="url(#screenGradient)" rx="6" />
      
      <!-- Screen content - potion/liquid pattern -->
      <!-- Base swirling shapes -->
      <ellipse cx="215" cy="235" rx="25" ry="20" fill="#9FD562" opacity="0.7" />
      <ellipse cx="255" cy="245" rx="30" ry="22" fill="#7FD862" opacity="0.8" />
      
      <!-- Curved potion movement lines -->
      <path d="M 200 260 Q 225 255 250 265 Q 270 270 280 250" 
            stroke="#AAEA6A" stroke-width="2" fill="none" opacity="0.6" />
      <path d="M 190 245 Q 220 240 245 250" 
            stroke="#B5F065" stroke-width="1.5" fill="none" opacity="0.5" />
      
      <!-- Light highlights/bubbles -->
      <circle cx="210" cy="225" r="4" fill="#FFF" opacity="0.5" />
      <circle cx="245" cy="240" r="3" fill="#FFF" opacity="0.4" />
      <circle cx="270" cy="255" r="2.5" fill="#FFF" opacity="0.3" />
      
      <!-- Screen shine/reflection -->
      <ellipse cx="200" cy="215" rx="35" ry="12" fill="#FFF" opacity="0.25" />
    </g>
    
    <!-- Chest panel with button -->
    <g id="chest">
      <!-- Chest plate indent -->
      <rect x="190" y="320" width="120" height="40" rx="6" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
      
      <!-- Chest shading -->
      <rect x="190" y="320" width="120" height="15" rx="6" fill="#4A3A2D" opacity="0.5" />
      
      <!-- Large circular button -->
      <circle cx="250" cy="340" r="10" fill="#D4B090" stroke="#8B6F47" stroke-width="1.5" />
      
      <!-- Button shading for dimension -->
      <circle cx="248" cy="338" r="8" fill="#E8C8A0" opacity="0.6" />
      
      <!-- Button highlight -->
      <circle cx="247" cy="337" r="3" fill="#FFF" opacity="0.4" />
    </g>
  </g>
  
  <!-- LEFT ARMS (2 total) -->
  <!-- First left arm (upper) -->
  <g id="left-arm-upper" filter="url(#shadow)">
    <!-- Upper arm segment -->
    <rect x="70" y="215" width="75" height="28" rx="14" fill="#6B5A3D" stroke="#4A3D2A" stroke-width="1.5" />
    
    <!-- Arm shading -->
    <ellipse cx="85" cy="215" rx="20" ry="14" fill="#5A4A33" opacity="0.4" />
    
    <!-- Elbow joint -->
    <circle cx="85" cy="229" r="9" fill="#8B7355" stroke="#654321" stroke-width="1" />
    
    <!-- Forearm segment -->
    <rect x="40" y="220" width="50" height="22" rx="11" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
    
    <!-- Wrist joint -->
    <circle cx="42" cy="231" r="8" fill="#7A6A55" stroke="#5A4A3D" stroke-width="0.5" />
    
    <!-- Connection segment from body -->
    <rect x="143" y="223" width="12" height="18" fill="#3A2A1D" />
    
    <!-- LEFT HAND (upper) with white glove -->
    <g id="left-hand-upper" transform="translate(35, 231)">
      <!-- Glove palm -->
      <circle cx="0" cy="0" r="14" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="1" />
      
      <!-- Glove shading -->
      <ellipse cx="-2" cy="3" rx="12" ry="10" fill="#E8DCCC" opacity="0.3" />
      
      <!-- Fingers spread out -->
      <!-- Pinky -->
      <ellipse cx="-9" cy="-10" rx="4.5" ry="11" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-25 -9 -10)" />
      <circle cx="-9" cy="-21" r="2.5" fill="#E8D4B0" />
      
      <!-- Ring finger -->
      <ellipse cx="-4" cy="-14" rx="4" ry="12" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-10 -4 -14)" />
      <circle cx="-4" cy="-26" r="2.3" fill="#E8D4B0" />
      
      <!-- Middle finger -->
      <ellipse cx="2" cy="-15" rx="4.5" ry="13" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" />
      <circle cx="2" cy="-28" r="2.5" fill="#E8D4B0" />
      
      <!-- Index finger -->
      <ellipse cx="7" cy="-13" rx="4" ry="12" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(10 7 -13)" />
      <circle cx="7" cy="-25" r="2.3" fill="#E8D4B0" />
      
      <!-- Thumb -->
      <ellipse cx="10" cy="-4" rx="4" ry="10" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(35 10 -4)" />
      <circle cx="15" cy="-12" r="2" fill="#E8D4B0" />
      
      <!-- Palm details -->
      <path d="M -6 -2 Q 0 2 6 -2" stroke="#D0C4B0" stroke-width="0.5" fill="none" opacity="0.5" />
      <path d="M -2 3 L 2 5" stroke="#D0C4B0" stroke-width="0.5" fill="none" opacity="0.3" />
    </g>
  </g>
  
  <!-- Second left arm (lower) -->
  <g id="left-arm-lower" filter="url(#shadow)">
    <!-- Upper arm segment -->
    <rect x="75" y="265" width="70" height="26" rx="13" fill="#6B5A3D" stroke="#4A3D2A" stroke-width="1.5" />
    
    <!-- Elbow joint -->
    <circle cx="88" cy="278" r="8" fill="#8B7355" stroke="#654321" stroke-width="1" />
    
    <!-- Forearm segment -->
    <rect x="48" y="268" width="48" height="20" rx="10" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
    
    <!-- Wrist joint -->
    <circle cx="50" cy="278" r="7" fill="#7A6A55" stroke="#5A4A3D" stroke-width="0.5" />
    
    <!-- Connection segment -->
    <rect x="143" y="271" width="12" height="16" fill="#3A2A1D" />
    
    <!-- LEFT HAND (lower) -->
    <g id="left-hand-lower" transform="translate(42, 278)">
      <!-- Glove palm -->
      <circle cx="0" cy="0" r="13" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="1" />
      
      <!-- Fingers spread out -->
      <!-- Pinky -->
      <ellipse cx="-8" cy="-9" rx="4" ry="10" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-25 -8 -9)" />
      <circle cx="-8" cy="-19" r="2.2" fill="#E8D4B0" />
      
      <!-- Ring finger -->
      <ellipse cx="-3" cy="-13" rx="3.8" ry="11" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-10 -3 -13)" />
      <circle cx="-3" cy="-24" r="2" fill="#E8D4B0" />
      
      <!-- Middle finger -->
      <ellipse cx="2" cy="-14" rx="4" ry="12" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" />
      <circle cx="2" cy="-26" r="2.2" fill="#E8D4B0" />
      
      <!-- Index finger -->
      <ellipse cx="6" cy="-12" rx="3.8" ry="11" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(10 6 -12)" />
      <circle cx="6" cy="-23" r="2" fill="#E8D4B0" />
      
      <!-- Thumb -->
      <ellipse cx="9" cy="-3" rx="3.8" ry="9" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(35 9 -3)" />
      <circle cx="13" cy="-11" r="1.8" fill="#E8D4B0" />
    </g>
  </g>
  
  <!-- RIGHT ARMS (2 total - mirrored) -->
  <!-- First right arm (upper) -->
  <g id="right-arm-upper" filter="url(#shadow)">
    <!-- Upper arm segment -->
    <rect x="355" y="215" width="75" height="28" rx="14" fill="#6B5A3D" stroke="#4A3D2A" stroke-width="1.5" />
    
    <!-- Arm shading -->
    <ellipse cx="415" cy="215" rx="20" ry="14" fill="#5A4A33" opacity="0.4" />
    
    <!-- Elbow joint -->
    <circle cx="415" cy="229" r="9" fill="#8B7355" stroke="#654321" stroke-width="1" />
    
    <!-- Forearm segment -->
    <rect x="410" y="220" width="50" height="22" rx="11" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
    
    <!-- Wrist joint -->
    <circle cx="458" cy="231" r="8" fill="#7A6A55" stroke="#5A4A3D" stroke-width="0.5" />
    
    <!-- Connection segment -->
    <rect x="345" y="223" width="12" height="18" fill="#3A2A1D" />
    
    <!-- RIGHT HAND (upper) -->
    <g id="right-hand-upper" transform="translate(465, 231)">
      <!-- Glove palm -->
      <circle cx="0" cy="0" r="14" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="1" />
      
      <!-- Glove shading -->
      <ellipse cx="2" cy="3" rx="12" ry="10" fill="#E8DCCC" opacity="0.3" />
      
      <!-- Fingers (mirrored) -->
      <!-- Thumb -->
      <ellipse cx="-10" cy="-4" rx="4" ry="10" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-35 -10 -4)" />
      <circle cx="-15" cy="-12" r="2" fill="#E8D4B0" />
      
      <!-- Index finger -->
      <ellipse cx="-7" cy="-13" rx="4" ry="12" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-10 -7 -13)" />
      <circle cx="-7" cy="-25" r="2.3" fill="#E8D4B0" />
      
      <!-- Middle finger -->
      <ellipse cx="-2" cy="-15" rx="4.5" ry="13" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" />
      <circle cx="-2" cy="-28" r="2.5" fill="#E8D4B0" />
      
      <!-- Ring finger -->
      <ellipse cx="4" cy="-14" rx="4" ry="12" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(10 4 -14)" />
      <circle cx="4" cy="-26" r="2.3" fill="#E8D4B0" />
      
      <!-- Pinky -->
      <ellipse cx="9" cy="-10" rx="4.5" ry="11" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(25 9 -10)" />
      <circle cx="9" cy="-21" r="2.5" fill="#E8D4B0" />
      
      <!-- Palm details -->
      <path d="M 6 -2 Q 0 2 -6 -2" stroke="#D0C4B0" stroke-width="0.5" fill="none" opacity="0.5" />
      <path d="M 2 3 L -2 5" stroke="#D0C4B0" stroke-width="0.5" fill="none" opacity="0.3" />
    </g>
  </g>
  
  <!-- Second right arm (lower) -->
  <g id="right-arm-lower" filter="url(#shadow)">
    <!-- Upper arm segment -->
    <rect x="355" y="265" width="70" height="26" rx="13" fill="#6B5A3D" stroke="#4A3D2A" stroke-width="1.5" />
    
    <!-- Elbow joint -->
    <circle cx="412" cy="278" r="8" fill="#8B7355" stroke="#654321" stroke-width="1" />
    
    <!-- Forearm segment -->
    <rect x="404" y="268" width="48" height="20" rx="10" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
    
    <!-- Wrist joint -->
    <circle cx="450" cy="278" r="7" fill="#7A6A55" stroke="#5A4A3D" stroke-width="0.5" />
    
    <!-- Connection segment -->
    <rect x="345" y="271" width="12" height="16" fill="#3A2A1D" />
    
    <!-- RIGHT HAND (lower) -->
    <g id="right-hand-lower" transform="translate(458, 278)">
      <!-- Glove palm -->
      <circle cx="0" cy="0" r="13" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="1" />
      
      <!-- Fingers (mirrored) -->
      <!-- Thumb -->
      <ellipse cx="-9" cy="-3" rx="3.8" ry="9" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-35 -9 -3)" />
      <circle cx="-13" cy="-11" r="1.8" fill="#E8D4B0" />
      
      <!-- Index finger -->
      <ellipse cx="-6" cy="-12" rx="3.8" ry="11" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(-10 -6 -12)" />
      <circle cx="-6" cy="-23" r="2" fill="#E8D4B0" />
      
      <!-- Middle finger -->
      <ellipse cx="-2" cy="-14" rx="4" ry="12" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" />
      <circle cx="-2" cy="-26" r="2.2" fill="#E8D4B0" />
      
      <!-- Ring finger -->
      <ellipse cx="3" cy="-13" rx="3.8" ry="11" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(10 3 -13)" />
      <circle cx="3" cy="-24" r="2" fill="#E8D4B0" />
      
      <!-- Pinky -->
      <ellipse cx="8" cy="-9" rx="4" ry="10" fill="#F5F0E8" stroke="#D0C4B0" stroke-width="0.5" 
               transform="rotate(25 8 -9)" />
      <circle cx="8" cy="-19" r="2.2" fill="#E8D4B0" />
    </g>
  </g>
  
  <!-- LEGS -->
  <!-- Left leg with segmented detail -->
  <g id="left-leg" filter="url(#shadow)">
    <!-- Upper leg segment -->
    <rect x="170" y="365" width="38" height="55" rx="6" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
    
    <!-- Leg shading -->
    <ellipse cx="175" cy="375" rx="12" ry="25" fill="#4A3A2D" opacity="0.3" />
    
    <!-- Knee joint -->
    <ellipse cx="189" cy="420" rx="24" ry="12" fill="#3A2A1D" stroke="#1A0A0D" stroke-width="0.5" />
    
    <!-- Lower leg segment -->
    <rect x="175" y="430" width="28" height="45" rx="5" fill="#4A3A2D" stroke="#2A1A1D" stroke-width="1" />
    
    <!-- LEFT FOOT/BOOT -->
    <g id="left-foot">
      <!-- Boot body -->
      <ellipse cx="189" cy="485" rx="32" ry="22" fill="#3A2A1D" stroke="#1A0A0D" stroke-width="1.5" />
      
      <!-- Boot sole -->
      <ellipse cx="189" cy="503" rx="35" ry="10" fill="#2A1A1D" stroke="#0A0A0D" stroke-width="1" />
      
      <!-- Boot shading -->
      <ellipse cx="185" cy="485" rx="15" ry="18" fill="#1A0A1D" opacity="0.3" />
      
      <!-- Tread detail -->
      <line x1="170" y1="503" x2="208" y2="503" stroke="#1A0A0D" stroke-width="0.5" opacity="0.5" />
    </g>
  </g>
  
  <!-- Right leg with segmented detail -->
  <g id="right-leg" filter="url(#shadow)">
    <!-- Upper leg segment -->
    <rect x="292" y="365" width="38" height="55" rx="6" fill="#5A4A3D" stroke="#3A2A1D" stroke-width="1" />
    
    <!-- Leg shading -->
    <ellipse cx="297" cy="375" rx="12" ry="25" fill="#4A3A2D" opacity="0.3" />
    
    <!-- Knee joint -->
    <ellipse cx="311" cy="420" rx="24" ry="12" fill="#3A2A1D" stroke="#1A0A0D" stroke-width="0.5" />
    
    <!-- Lower leg segment -->
    <rect x="297" y="430" width="28" height="45" rx="5" fill="#4A3A2D" stroke="#2A1A1D" stroke-width="1" />
    
    <!-- RIGHT FOOT/BOOT -->
    <g id="right-foot">
      <!-- Boot body -->
      <ellipse cx="311" cy="485" rx="32" ry="22" fill="#3A2A1D" stroke="#1A0A0D" stroke-width="1.5" />
      
      <!-- Boot sole -->
      <ellipse cx="311" cy="503" rx="35" ry="10" fill="#2A1A1D" stroke="#0A0A0D" stroke-width="1" />
      
      <!-- Boot shading -->
      <ellipse cx="315" cy="485" rx="15" ry="18" fill="#1A0A1D" opacity="0.3" />
      
      <!-- Tread detail -->
      <line x1="292" y1="503" x2="330" y2="503" stroke="#1A0A0D" stroke-width="0.5" opacity="0.5" />
    </g>
  </g>
</svg>