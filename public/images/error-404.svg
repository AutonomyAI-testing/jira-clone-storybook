<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -80 340 470">
  <defs>
    <!-- Gradients for screen -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86ef5d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#65c954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a9d47;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screenShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8f0a8;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#c8f0a8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#c8f0a8;stop-opacity:0" />
    </linearGradient>
    
    <!-- Gradients for hat -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3f6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a4f82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2f52;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Warm parchment background -->
  <rect x="-10" y="-80" width="340" height="470" fill="#f5eed8"/>
  
  <!-- Vitruvian Man rectangle frame (faint background) -->
  <rect x="30" y="30" width="260" height="260" fill="none" stroke="#7a6d63" opacity="0.25" stroke-width="2"/>
  
  <!-- Vitruvian Man circle outline (faint background) -->
  <circle cx="160" cy="160" r="130" fill="none" stroke="#7a6d63" opacity="0.25" stroke-width="2"/>
  
  <!-- Vitruvian Man crosshair (faint) -->
  <g opacity="0.15" stroke="#7a6d63" stroke-width="1">
    <line x1="160" y1="30" x2="160" y2="290"/>
    <line x1="30" y1="160" x2="290" y2="160"/>
  </g>
  
  <!-- Drop shadow under character -->
  <ellipse cx="160" cy="330" rx="70" ry="12" fill="#000000" opacity="0.15"/>
  
  <!-- Lower body: Left leg -->
  <rect x="125" y="280" width="22" height="60" fill="#8b6f47" rx="3" stroke="#4a3f36" stroke-width="1.5"/>
  
  <!-- Lower body: Right leg -->
  <rect x="173" y="280" width="22" height="60" fill="#8b6f47" rx="3" stroke="#4a3f36" stroke-width="1.5"/>
  
  <!-- Left boot (chunky with depth) -->
  <g>
    <rect x="118" y="338" width="36" height="22" fill="#6b5436" rx="2" stroke="#4a3f36" stroke-width="1.5"/>
    <!-- Boot sole -->
    <rect x="118" y="358" width="36" height="4" fill="#4a3f36" rx="1"/>
    <!-- Boot shading/depth -->
    <rect x="118" y="338" width="36" height="6" fill="#7a6145" rx="2" opacity="0.6"/>
  </g>
  
  <!-- Right boot (chunky with depth) -->
  <g>
    <rect x="166" y="338" width="36" height="22" fill="#6b5436" rx="2" stroke="#4a3f36" stroke-width="1.5"/>
    <!-- Boot sole -->
    <rect x="166" y="358" width="36" height="4" fill="#4a3f36" rx="1"/>
    <!-- Boot shading/depth -->
    <rect x="166" y="338" width="36" height="6" fill="#7a6145" rx="2" opacity="0.6"/>
  </g>
  
  <!-- Main body (rectangular torso) -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="170" width="120" height="115" fill="#a0845c" rx="4" stroke="#5a4a35" stroke-width="2"/>
    
    <!-- Body highlight/shading on top -->
    <rect x="100" y="170" width="120" height="25" fill="#b39a74" rx="4" opacity="0.7"/>
    
    <!-- Left vertical panel line -->
    <line x1="140" y1="180" x2="140" y2="270" stroke="#5a4a35" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Right vertical panel line -->
    <line x1="180" y1="180" x2="180" y2="270" stroke="#5a4a35" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Horizontal panel line -->
    <line x1="105" y1="215" x2="215" y2="215" stroke="#5a4a35" stroke-width="2" opacity="0.5"/>
    
    <!-- Central gold button/port -->
    <circle cx="160" cy="240" r="12" fill="#C8A84B" stroke="#7a5c1a" stroke-width="2"/>
    <!-- Button shine -->
    <circle cx="157" cy="234" r="5" fill="#e8c857" opacity="0.8"/>
    <!-- Button inner rim (darker) -->
    <circle cx="160" cy="240" r="9" fill="none" stroke="#5a4030" stroke-width="1"/>
    
    <!-- Corner rivets/bolts -->
    <circle cx="108" cy="178" r="2.5" fill="#5a4a35" stroke="#3a2a1f" stroke-width="0.5"/>
    <circle cx="212" cy="178" r="2.5" fill="#5a4a35" stroke="#3a2a1f" stroke-width="0.5"/>
    <circle cx="108" cy="270" r="2.5" fill="#5a4a35" stroke="#3a2a1f" stroke-width="0.5"/>
    <circle cx="212" cy="270" r="2.5" fill="#5a4a35" stroke="#3a2a1f" stroke-width="0.5"/>
  </g>
  
  <!-- LEFT UPPER ARM (spread wide up-left) -->
  <g>
    <!-- Thick arm cylinder -->
    <line x1="100" y1="175" x2="20" y2="110" stroke="#3d3d3d" stroke-width="16" stroke-linecap="round"/>
    <!-- Arm shading -->
    <line x1="100" y1="175" x2="20" y2="110" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round" opacity="0.4" stroke-dasharray="2,4"/>
    
    <!-- Gloved hand with spread fingers -->
    <g transform="translate(15, 105)">
      <!-- Main glove palm (white circle) -->
      <circle cx="0" cy="0" r="14" fill="#f5eed8" stroke="#2d2d2d" stroke-width="2"/>
      <!-- Finger 1 (outer left) -->
      <rect x="-11" y="-20" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-9" cy="-22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 2 -->
      <rect x="-6" y="-24" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-4" cy="-27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 3 (center) -->
      <rect x="-1" y="-26" width="4" height="16" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="1" cy="-29" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 4 -->
      <rect x="4" y="-24" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="6" cy="-27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 5 (outer right) -->
      <rect x="9" y="-20" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="11" cy="-22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Thumb (to the side) -->
      <rect x="14" y="-6" width="4" height="10" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1" transform="rotate(45 16 -1)"/>
    </g>
  </g>
  
  <!-- RIGHT UPPER ARM (spread wide up-right) -->
  <g>
    <!-- Thick arm cylinder -->
    <line x1="220" y1="175" x2="300" y2="110" stroke="#3d3d3d" stroke-width="16" stroke-linecap="round"/>
    <!-- Arm shading -->
    <line x1="220" y1="175" x2="300" y2="110" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round" opacity="0.4" stroke-dasharray="2,4"/>
    
    <!-- Gloved hand with spread fingers -->
    <g transform="translate(305, 105)">
      <!-- Main glove palm (white circle) -->
      <circle cx="0" cy="0" r="14" fill="#f5eed8" stroke="#2d2d2d" stroke-width="2"/>
      <!-- Finger 1 (outer left) -->
      <rect x="-11" y="-20" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-9" cy="-22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 2 -->
      <rect x="-6" y="-24" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-4" cy="-27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 3 (center) -->
      <rect x="-1" y="-26" width="4" height="16" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="1" cy="-29" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 4 -->
      <rect x="4" y="-24" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="6" cy="-27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 5 (outer right) -->
      <rect x="9" y="-20" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="11" cy="-22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Thumb (to the side) -->
      <rect x="14" y="-6" width="4" height="10" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1" transform="rotate(45 16 -1)"/>
    </g>
  </g>
  
  <!-- LEFT LOWER ARM (spread wide down-left) -->
  <g>
    <!-- Thick arm cylinder -->
    <line x1="105" y1="270" x2="25" y2="310" stroke="#3d3d3d" stroke-width="16" stroke-linecap="round"/>
    <!-- Arm shading -->
    <line x1="105" y1="270" x2="25" y2="310" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round" opacity="0.4" stroke-dasharray="2,4"/>
    
    <!-- Gloved hand with spread fingers (pointing down-left) -->
    <g transform="translate(20, 315)">
      <!-- Main glove palm (white circle) -->
      <circle cx="0" cy="0" r="14" fill="#f5eed8" stroke="#2d2d2d" stroke-width="2"/>
      <!-- Finger 1 (outer left) -->
      <rect x="-11" y="8" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-9" cy="22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 2 -->
      <rect x="-6" y="10" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-4" cy="27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 3 (center) -->
      <rect x="-1" y="10" width="4" height="16" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="1" cy="29" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 4 -->
      <rect x="4" y="10" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="6" cy="27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 5 (outer right) -->
      <rect x="9" y="8" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="11" cy="22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Thumb (to the side) -->
      <rect x="14" y="-6" width="4" height="10" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1" transform="rotate(-45 16 -1)"/>
    </g>
  </g>
  
  <!-- RIGHT LOWER ARM (spread wide down-right) -->
  <g>
    <!-- Thick arm cylinder -->
    <line x1="215" y1="270" x2="295" y2="310" stroke="#3d3d3d" stroke-width="16" stroke-linecap="round"/>
    <!-- Arm shading -->
    <line x1="215" y1="270" x2="295" y2="310" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round" opacity="0.4" stroke-dasharray="2,4"/>
    
    <!-- Gloved hand with spread fingers (pointing down-right) -->
    <g transform="translate(300, 315)">
      <!-- Main glove palm (white circle) -->
      <circle cx="0" cy="0" r="14" fill="#f5eed8" stroke="#2d2d2d" stroke-width="2"/>
      <!-- Finger 1 (outer left) -->
      <rect x="-11" y="8" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-9" cy="22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 2 -->
      <rect x="-6" y="10" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="-4" cy="27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 3 (center) -->
      <rect x="-1" y="10" width="4" height="16" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="1" cy="29" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 4 -->
      <rect x="4" y="10" width="4" height="14" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="6" cy="27" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Finger 5 (outer right) -->
      <rect x="9" y="8" width="4" height="12" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1"/>
      <circle cx="11" cy="22" r="2.5" fill="#f5eed8" stroke="#2d2d2d" stroke-width="0.5"/>
      <!-- Thumb (to the side) -->
      <rect x="14" y="-6" width="4" height="10" fill="#f5eed8" rx="2" stroke="#2d2d2d" stroke-width="1" transform="rotate(-45 16 -1)"/>
    </g>
  </g>
  
  <!-- TV SCREEN HEAD (rectangular CRT monitor) -->
  <g filter="url(#dropShadow)">
    <!-- Screen frame outer (brown wood texture) -->
    <rect x="95" y="45" width="130" height="95" fill="#8b7355" rx="4" stroke="#5a4a35" stroke-width="2"/>
    
    <!-- Screen bezel (darker brown inner frame) -->
    <rect x="100" y="50" width="120" height="85" fill="#6b5345" rx="3" stroke="#3d3530" stroke-width="1.5"/>
    
    <!-- Screen display area (gradient green) -->
    <rect x="107" y="57" width="106" height="71" fill="url(#screenGradient)" rx="1" stroke="#2d3a2d" stroke-width="1"/>
    
    <!-- Screen shine/glare effect (light swirl) -->
    <ellipse cx="150" cy="70" rx="32" ry="20" fill="url(#screenShine)"/>
    
    <!-- Scanlines (subtle horizontal lines) -->
    <g opacity="0.2" stroke="#1a1a1a" stroke-width="0.5">
      <line x1="107" y1="63" x2="213" y2="63"/>
      <line x1="107" y1="70" x2="213" y2="70"/>
      <line x1="107" y1="77" x2="213" y2="77"/>
      <line x1="107" y1="84" x2="213" y2="84"/>
      <line x1="107" y1="91" x2="213" y2="91"/>
      <line x1="107" y1="98" x2="213" y2="98"/>
      <line x1="107" y1="105" x2="213" y2="105"/>
      <line x1="107" y1="112" x2="213" y2="112"/>
    </g>
    
    <!-- Inner screen border (darker) -->
    <rect x="107" y="57" width="106" height="71" fill="none" stroke="#1a2515" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Speaker grille/power button area (left side of bezel) -->
    <circle cx="101" cy="108" r="3.5" fill="#4a3f36" stroke="#2d2522" stroke-width="1"/>
    
    <!-- Mounting bolts on frame corners -->
    <circle cx="102" cy="55" r="1.5" fill="#4a3f36"/>
    <circle cx="218" cy="55" r="1.5" fill="#4a3f36"/>
  </g>
  
  <!-- WIZARD HAT (tall pointed cone with brim) -->
  <g filter="url(#dropShadow)">
    <!-- Hat brim (wide dark oval base) -->
    <ellipse cx="160" cy="42" rx="95" ry="16" fill="#2B3F6B" stroke="#1a2f4d" stroke-width="2"/>
    <!-- Brim highlight (light shading on top) -->
    <ellipse cx="160" cy="40" rx="92" ry="12" fill="#3d5a99" opacity="0.5"/>
    
    <!-- Main cone (tall pointed hat - navy gradient) -->
    <polygon points="160,-85 105,42 215,42" fill="url(#hatGradient)" stroke="#1a2f4d" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Hat point tip (slightly curved for 3D effect) -->
    <path d="M 160 -85 Q 162 -95 163 -108 Q 162 -100 160 -85" fill="#1f2f52" stroke="none"/>
    
    <!-- Crescent moon on hat (upper left side) -->
    <g transform="translate(140, 15)">
      <!-- Three-circle technique for clean crescent -->
      <circle cx="0" cy="0" r="7" fill="#fbbf24"/>
      <circle cx="3.5" cy="0" r="7" fill="#2B3F6B"/>
      <circle cx="3.5" cy="0" r="6.5" fill="#f5eed8" opacity="0"/>
    </g>
    
    <!-- Large star on hat (upper right side) -->
    <g transform="translate(180, 10)">
      <polygon points="0,-6 1.8,-1.8 6,-1.8 2.4,1.8 4.2,6 0,2.4 -4.2,6 -2.4,1.8 -6,-1.8 -1.8,-1.8" fill="#fbbf24" stroke="#d9a500" stroke-width="0.5"/>
    </g>
    
    <!-- Crescent moon on hat (left middle) -->
    <g transform="translate(125, 32)">
      <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
      <circle cx="3" cy="0" r="6" fill="#2B3F6B"/>
      <circle cx="3" cy="0" r="5.5" fill="#f5eed8" opacity="0"/>
    </g>
    
    <!-- Star on hat (right middle) -->
    <g transform="translate(195, 30)">
      <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1.5 3.5,5 0,2.5 -3.5,5 -2,1.5 -5,-1.5 -1.5,-1.5" fill="#fbbf24"/>
    </g>
    
    <!-- Star on hat (center, lower on cone) -->
    <g transform="translate(160, 35)">
      <polygon points="0,-4.5 1.35,-1.35 4.5,-1.35 1.8,1.35 3.15,4.5 0,2.25 -3.15,4.5 -1.8,1.35 -4.5,-1.35 -1.35,-1.35" fill="#fbbf24"/>
    </g>
  </g>
  
  <!-- Floating decorative stars around the character (optional sparkles) -->
  <g opacity="0.4">
    <g transform="translate(280, 30)">
      <polygon points="0,-3.5 1,-1 3.5,-1 1.5,0.8 2.2,3.5 0,1.7 -2.2,3.5 -1.5,0.8 -3.5,-1 -1,-1" fill="#fbbf24"/>
    </g>
    <g transform="translate(50, 110)">
      <polygon points="0,-3 0.9,-0.9 3,-0.9 1.2,0.7 1.8,2.8 0,1.4 -1.8,2.8 -1.2,0.7 -3,-0.9 -0.9,-0.9" fill="#fbbf24"/>
    </g>
  </g>
</svg>