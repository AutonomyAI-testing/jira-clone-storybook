<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620">
  <defs>
    <!-- Glow filter for TV screen -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Hat gradient: dark blue to darker blue -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3A5FAD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3070;stop-opacity:1" />
    </linearGradient>
    
    <!-- Body gradient: tan to darker brown -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7244;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4A2A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Screen gradient: bright green to darker green -->
    <radialGradient id="screenGradient" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#8DE98D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8B2E;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gold button gradient: bright center to darker edge -->
    <radialGradient id="buttonGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#FFE066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C88000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Boots gradient: darker brown to very dark -->
    <linearGradient id="bootGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4528;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A2010;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Parchment background -->
  <rect width="500" height="620" fill="#EDE0CC" />

  <!-- Da Vinci style circle (faded) -->
  <circle cx="250" cy="370" r="220" fill="none" stroke="#8B6070" stroke-width="1" opacity="0.25" />

  <!-- Da Vinci style square (faded) -->
  <rect x="55" y="150" width="390" height="390" fill="none" stroke="#8B6070" stroke-width="1" opacity="0.25" />

  <!-- BOOTS (chunky brown blocks) -->
  <g id="boots">
    <!-- Left boot -->
    <rect x="182" y="575" width="58" height="35" rx="8" fill="url(#bootGradient)" stroke="#2A1A0A" stroke-width="2" />
    <!-- Right boot -->
    <rect x="260" y="575" width="58" height="35" rx="8" fill="url(#bootGradient)" stroke="#2A1A0A" stroke-width="2" />
  </g>

  <!-- LEGS (thick brown rectangles) -->
  <g id="legs">
    <!-- Left leg -->
    <rect x="198" y="528" width="36" height="55" rx="5" fill="url(#bodyGradient)" stroke="#2A1A0A" stroke-width="2" />
    <!-- Right leg -->
    <rect x="266" y="528" width="36" height="55" rx="5" fill="url(#bodyGradient)" stroke="#2A1A0A" stroke-width="2" />
  </g>

  <!-- LOWER ARMS with HANDS (thick arms angling down-outward) -->
  <g id="lower-arms">
    <!-- Lower-left arm -->
    <line x1="190" y1="490" x2="70" y2="560" stroke="#7A5030" stroke-width="22" stroke-linecap="round" />
    <!-- Lower-right arm -->
    <line x1="310" y1="490" x2="430" y2="560" stroke="#7A5030" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- TORSO (brown rect with rivets and gold button) -->
  <g id="torso">
    <!-- Main torso rectangle -->
    <rect x="170" y="400" width="160" height="130" rx="8" fill="url(#bodyGradient)" stroke="#2A1A0A" stroke-width="2" />
    
    <!-- Rivet circles at corners -->
    <circle cx="180" cy="410" r="5" fill="#C4A070" stroke="#2A1A0A" stroke-width="1" />
    <circle cx="320" cy="410" r="5" fill="#C4A070" stroke="#2A1A0A" stroke-width="1" />
    <circle cx="180" cy="520" r="5" fill="#C4A070" stroke="#2A1A0A" stroke-width="1" />
    <circle cx="320" cy="520" r="5" fill="#C4A070" stroke="#2A1A0A" stroke-width="1" />
    
    <!-- Lower panel for button -->
    <rect x="182" y="480" width="136" height="42" rx="6" fill="#6B4A2A" stroke="#2A1A0A" stroke-width="2" />
    
    <!-- Gold button: main circle with gradient -->
    <circle cx="250" cy="501" r="16" fill="url(#buttonGradient)" stroke="#8B6000" stroke-width="2" />
    <!-- Gold button inner ring -->
    <circle cx="250" cy="501" r="10" fill="none" stroke="#FFD700" stroke-width="1.5" />
  </g>

  <!-- UPPER ARMS with HANDS (thick arms angling up-outward) -->
  <g id="upper-arms">
    <!-- Upper-left arm -->
    <line x1="195" y1="430" x2="85" y2="340" stroke="#7A5030" stroke-width="22" stroke-linecap="round" />
    <!-- Upper-right arm -->
    <line x1="305" y1="430" x2="415" y2="340" stroke="#7A5030" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- NECK connector -->
  <rect x="228" y="380" width="44" height="25" rx="4" fill="url(#bodyGradient)" stroke="#2A1A0A" stroke-width="2" />

  <!-- TV HEAD (outer casing, beige frame, green screen, glare, scanlines) -->
  <g id="head">
    <!-- Outer brown casing -->
    <rect x="155" y="230" width="190" height="150" rx="14" fill="url(#bodyGradient)" stroke="#2A1A0A" stroke-width="2" />
    
    <!-- Beige inner frame/border -->
    <rect x="165" y="240" width="170" height="130" rx="10" fill="#C4A07A" stroke="#2A1A0A" stroke-width="1" />
    
    <!-- Green screen interior -->
    <rect x="175" y="250" width="150" height="110" rx="8" fill="url(#screenGradient)" stroke="#2A1A0A" stroke-width="2" />
    
    <!-- Cloud blob shapes inside screen (yellowish) -->
    <ellipse cx="215" cy="285" rx="28" ry="18" fill="#C8E840" opacity="0.7" />
    <ellipse cx="255" cy="278" rx="20" ry="14" fill="#E0F060" opacity="0.6" />
    <ellipse cx="240" cy="295" rx="15" ry="10" fill="#D4EC50" opacity="0.5" />
    
    <!-- White glare highlight -->
    <ellipse cx="205" cy="265" rx="22" ry="14" fill="#FFFFFF" opacity="0.55" />
    
    <!-- Glow effect around screen -->
    <rect x="175" y="250" width="150" height="110" rx="8" fill="none" stroke="#7FFF44" stroke-width="3" opacity="0.4" filter="url(#glow)" />
    
    <!-- Scanlines (faint horizontal lines) -->
    <line x1="180" y1="270" x2="320" y2="270" stroke="#2A1A0A" stroke-width="0.5" opacity="0.15" />
    <line x1="180" y1="280" x2="320" y2="280" stroke="#2A1A0A" stroke-width="0.5" opacity="0.15" />
    <line x1="180" y1="290" x2="320" y2="290" stroke="#2A1A0A" stroke-width="0.5" opacity="0.15" />
    <line x1="180" y1="300" x2="320" y2="300" stroke="#2A1A0A" stroke-width="0.5" opacity="0.15" />
    <line x1="180" y1="310" x2="320" y2="310" stroke="#2A1A0A" stroke-width="0.5" opacity="0.15" />
  </g>

  <!-- HANDS (white cartoon gloves with fingers and cuffs) -->
  <g id="hands">
    <!-- Upper-left hand at (72, 330) -->
    <g id="hand-upper-left">
      <!-- Cuff ring -->
      <circle cx="84" cy="342" r="14" fill="#9B7040" stroke="#5A3010" stroke-width="1.5" />
      <!-- Palm ellipse -->
      <ellipse cx="62" cy="324" rx="18" ry="14" fill="#F0EEE8" stroke="#AAAAAA" stroke-width="1" />
      <!-- 4 fingers fanned out -->
      <ellipse cx="44" cy="310" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-35 44 310)" />
      <ellipse cx="55" cy="305" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-15 55 305)" />
      <ellipse cx="68" cy="305" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(5 68 305)" />
      <ellipse cx="80" cy="310" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(25 80 310)" />
    </g>
    
    <!-- Upper-right hand at (428, 330) -->
    <g id="hand-upper-right">
      <!-- Cuff ring -->
      <circle cx="416" cy="342" r="14" fill="#9B7040" stroke="#5A3010" stroke-width="1.5" />
      <!-- Palm ellipse -->
      <ellipse cx="438" cy="324" rx="18" ry="14" fill="#F0EEE8" stroke="#AAAAAA" stroke-width="1" />
      <!-- 4 fingers fanned out (mirrored) -->
      <ellipse cx="456" cy="310" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(35 456 310)" />
      <ellipse cx="445" cy="305" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(15 445 305)" />
      <ellipse cx="432" cy="305" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-5 432 305)" />
      <ellipse cx="420" cy="310" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-25 420 310)" />
    </g>
    
    <!-- Lower-left hand at (57, 565) -->
    <g id="hand-lower-left">
      <!-- Cuff ring -->
      <circle cx="69" cy="577" r="14" fill="#9B7040" stroke="#5A3010" stroke-width="1.5" />
      <!-- Palm ellipse -->
      <ellipse cx="47" cy="559" rx="18" ry="14" fill="#F0EEE8" stroke="#AAAAAA" stroke-width="1" />
      <!-- 4 fingers fanned out -->
      <ellipse cx="29" cy="545" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-35 29 545)" />
      <ellipse cx="40" cy="540" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-15 40 540)" />
      <ellipse cx="53" cy="540" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(5 53 540)" />
      <ellipse cx="65" cy="545" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(25 65 545)" />
    </g>
    
    <!-- Lower-right hand at (440, 565) -->
    <g id="hand-lower-right">
      <!-- Cuff ring -->
      <circle cx="431" cy="577" r="14" fill="#9B7040" stroke="#5A3010" stroke-width="1.5" />
      <!-- Palm ellipse -->
      <ellipse cx="453" cy="559" rx="18" ry="14" fill="#F0EEE8" stroke="#AAAAAA" stroke-width="1" />
      <!-- 4 fingers fanned out (mirrored) -->
      <ellipse cx="471" cy="545" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(35 471 545)" />
      <ellipse cx="460" cy="540" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(15 460 540)" />
      <ellipse cx="447" cy="540" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-5 447 540)" />
      <ellipse cx="435" cy="545" rx="7" ry="4.5" fill="#F0EEE8" stroke="#AAA" stroke-width="1" transform="rotate(-25 435 545)" />
    </g>
  </g>

  <!-- WIZARD HAT (brim, cone, tip curl, stars, moons) -->
  <g id="hat">
    <!-- Hat brim (wide ellipse) -->
    <ellipse cx="250" cy="222" rx="140" ry="28" fill="url(#hatGradient)" stroke="#2A1A0A" stroke-width="2" />
    
    <!-- Hat cone (triangle) -->
    <path d="M 155 220 L 250 50 L 345 220" fill="url(#hatGradient)" stroke="#2A1A0A" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Hat tip curl (leaning right) -->
    <path d="M 250 50 Q 290 5 310 22 Q 312 52 288 58" fill="url(#hatGradient)" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round" />
    
    <!-- Gold stars scattered across hat cone -->
    <!-- Star 1 (top center) -->
    <text x="250" y="85" font-size="32" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Star 2 (upper left) -->
    <text x="210" y="115" font-size="26" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Star 3 (upper right) -->
    <text x="290" y="115" font-size="26" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Star 4 (middle left) -->
    <text x="190" y="150" font-size="22" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Star 5 (middle right) -->
    <text x="310" y="150" font-size="22" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Star 6 (lower left) -->
    <text x="180" y="190" font-size="20" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Star 7 (lower right) -->
    <text x="320" y="190" font-size="20" fill="#FFD700" text-anchor="middle" font-weight="bold">★</text>
    
    <!-- Gold crescent moons on hat -->
    <!-- Moon 1 (left side) -->
    <text x="215" y="135" font-size="24" fill="#FFD700" text-anchor="middle" font-weight="bold">☽</text>
    
    <!-- Moon 2 (right side) -->
    <text x="285" y="135" font-size="24" fill="#FFD700" text-anchor="middle" font-weight="bold">☽</text>
    
    <!-- Moon 3 (center bottom) -->
    <text x="250" y="200" font-size="22" fill="#FFD700" text-anchor="middle" font-weight="bold">☽</text>
  </g>
</svg>
