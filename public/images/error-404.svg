<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 360" fill="none">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D8CB"/>
      <stop offset="100%" stop-color="#9AA5F5"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="170" cy="165" r="148"/>
    </clipPath>
  </defs>

  <!-- Red border ring -->
  <circle cx="170" cy="165" r="155" fill="#EF4444"/>
  <circle cx="170" cy="165" r="148" fill="#F5A623"/>

  <!-- Character inside circle -->
  <!-- Background warm amber fill (already done by circle above) -->

  <!-- Body / jacket dark -->
  <g clip-path="url(#circle)">
    <!-- Amber bg -->
    <circle cx="170" cy="165" r="148" fill="#F5A623"/>

    <!-- Jacket body (dark navy) -->
    <ellipse cx="170" cy="260" rx="100" ry="80" fill="#1a1a2e"/>
    <!-- Left arm/jacket -->
    <ellipse cx="90" cy="240" rx="55" ry="35" fill="#1a1a2e" transform="rotate(-20 90 240)"/>
    <!-- Right arm -->
    <ellipse cx="255" cy="230" rx="45" ry="30" fill="#2d2d44" transform="rotate(15 255 230)"/>

    <!-- Neck -->
    <rect x="155" y="185" width="30" height="30" rx="5" fill="#f0d5b0"/>

    <!-- Face -->
    <ellipse cx="170" cy="175" rx="52" ry="50" fill="#f0d5b0"/>

    <!-- Hair - back layer (dark spiky) -->
    <!-- Large messy hair mass -->
    <path d="M118 150 Q100 80 140 60 Q160 40 185 50 Q220 55 230 80 Q245 110 235 145" fill="#1a1a1a"/>
    <path d="M118 155 Q95 110 110 70 Q125 40 155 35" fill="#1a1a1a"/>
    <!-- Spiky tufts -->
    <path d="M130 90 Q115 60 125 45 Q135 65 140 85" fill="#1a1a1a"/>
    <path d="M155 60 Q150 30 160 20 Q168 40 170 65" fill="#1a1a1a"/>
    <path d="M175 55 Q180 25 195 30 Q190 55 185 70" fill="#1a1a1a"/>
    <path d="M200 70 Q215 45 225 55 Q215 75 205 85" fill="#1a1a1a"/>
    <path d="M220 95 Q238 75 242 90 Q230 105 220 115" fill="#1a1a1a"/>

    <!-- Hair front strands over face -->
    <path d="M130 100 Q125 130 130 155" stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M145 85 Q138 120 142 160" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M210 90 Q218 125 212 158" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Eyes - large amber anime eyes -->
    <!-- Left eye -->
    <ellipse cx="152" cy="178" rx="14" ry="15" fill="#2a2a2a"/>
    <ellipse cx="152" cy="178" rx="11" ry="12" fill="#D4870A"/>
    <ellipse cx="152" cy="178" rx="7" ry="8" fill="#E8A020"/>
    <ellipse cx="152" cy="178" rx="4" ry="5" fill="#1a1a1a"/>
    <ellipse cx="149" cy="175" rx="2" ry="2" fill="white" opacity="0.8"/>
    <!-- Eye outline -->
    <ellipse cx="152" cy="178" rx="14" ry="15" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Right eye -->
    <ellipse cx="188" cy="178" rx="14" ry="15" fill="#2a2a2a"/>
    <ellipse cx="188" cy="178" rx="11" ry="12" fill="#D4870A"/>
    <ellipse cx="188" cy="178" rx="7" ry="8" fill="#E8A020"/>
    <ellipse cx="188" cy="178" rx="4" ry="5" fill="#1a1a1a"/>
    <ellipse cx="185" cy="175" rx="2" ry="2" fill="white" opacity="0.8"/>
    <ellipse cx="188" cy="178" rx="14" ry="15" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Nose -->
    <path d="M168 190 Q170 196 172 190" stroke="#c4a882" stroke-width="1.5" fill="none"/>

    <!-- Mouth slightly open -->
    <path d="M160 200 Q170 205 180 200" stroke="#c4a882" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M138 163 Q152 158 165 163" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M175 163 Q188 158 202 163" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- TEAM text on jacket -->
    <text x="95" y="245" font-family="serif" font-weight="bold" font-size="14" fill="#2d2d44" transform="rotate(-15 95 245)">TEAM</text>
  </g>

  <!-- 404 text below -->
  <text x="170" y="345" font-family="sans-serif" font-weight="900" font-size="28" fill="#1a1a2e" text-anchor="middle" opacity="0.15" letter-spacing="8">404</text>
</svg>
