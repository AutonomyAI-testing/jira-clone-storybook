<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <!-- Parchment background -->
  <rect width="500" height="560" fill="#f2ead8"/>
  
  <!-- Subtle parchment speckles -->
  <circle cx="80" cy="60" r="1.5" fill="#d4c4a0" opacity="0.6"/>
  <circle cx="420" cy="80" r="1" fill="#d4c4a0" opacity="0.5"/>
  <circle cx="50" cy="430" r="1.5" fill="#d4c4a0" opacity="0.6"/>
  <circle cx="450" cy="480" r="1" fill="#d4c4a0" opacity="0.5"/>
  <circle cx="150" cy="500" r="1.2" fill="#d4c4a0" opacity="0.4"/>
  <circle cx="380" cy="30" r="1.3" fill="#d4c4a0" opacity="0.4"/>
  
  <!-- Vitruvian circle (prominent reddish-brown border) -->
  <circle cx="250" cy="310" r="210" fill="none" stroke="#9b6b55" stroke-width="2.5" opacity="0.75"/>
  
  <!-- Vitruvian square guide (subtle) -->
  <rect x="110" y="140" width="280" height="280" fill="none" stroke="#c4a882" stroke-width="1" opacity="0.45"/>
  
  <!-- Horizontal crosshair line -->
  <line x1="40" y1="310" x2="460" y2="310" stroke="#9b6b55" stroke-width="0.8" opacity="0.4"/>
  
  <!-- === WIZARD HAT === -->
  <!-- Hat brim (dark navy ellipse) -->
  <ellipse cx="250" cy="248" rx="145" ry="26" fill="#1a2d6b" stroke="#0d1a42" stroke-width="2"/>
  
  <!-- Hat cone (drooping right — tip curves toward upper right) -->
  <path d="M 125,243 C 155,210 185,160 205,110 C 220,65 250,35 285,35 C 310,35 340,65 375,185 C 388,225 390,243 385,246 Z"
        fill="#253a8a" stroke="#0d1a42" stroke-width="2"/>
  
  <!-- Hat inner shading (left side darker) -->
  <path d="M 128,240 C 158,207 188,157 208,107 C 218,78 230,56 245,44 C 220,60 195,120 168,195 Z"
        fill="#1a2d6b" opacity="0.6"/>
  
  <!-- Star 1 (prominent, upper cone) -->
  <polygon points="230,85 233,95 244,95 236,102 239,112 230,106 221,112 224,102 216,95 227,95" fill="#ffc107" stroke="#e6a800" stroke-width="0.5"/>
  
  <!-- Star 2 (right cone) -->
  <polygon points="320,140 322.5,149 332,149 325,154.5 327.5,163 320,158 312.5,163 315,154.5 308,149 317.5,149" fill="#ffc107" stroke="#e6a800" stroke-width="0.5"/>
  
  <!-- Star 3 (left cone) -->
  <polygon points="175,160 177,167 184,167 179,171 181,178 175,174 169,178 171,171 166,167 173,167" fill="#ffc107" stroke="#e6a800" stroke-width="0.5"/>
  
  <!-- Star 4 (brim right) -->
  <polygon points="338,243 339.5,248 345,248 341,251 342.5,257 338,254 333.5,257 335,251 331,248 336.5,248" fill="#ffc107" stroke="#e6a800" stroke-width="0.5"/>
  
  <!-- Star 5 (brim left) -->
  <polygon points="162,243 163.5,248 169,248 165,251 166.5,257 162,254 157.5,257 159,251 155,248 160.5,248" fill="#ffc107" stroke="#e6a800" stroke-width="0.5"/>
  
  <!-- Star 6 (small, mid cone) -->
  <polygon points="267,125 268.5,130 274,130 270,133 271.5,138 267,135 262.5,138 264,133 260,130 265.5,130" fill="#ffc107" stroke="#e6a800" stroke-width="0.5"/>
  
  <!-- Crescent moon 1 (left cone) -->
  <path d="M 195,183 A 11,11 0 1,1 195,204 A 7.5,7.5 0 1,0 195,183 Z" fill="#ffc107"/>
  
  <!-- Crescent moon 2 (right cone) -->
  <path d="M 350,155 A 10,10 0 1,1 350,175 A 7,7 0 1,0 350,155 Z" fill="#ffc107"/>
  
  <!-- Crescent moon 3 (left brim) -->
  <path d="M 140,237 A 8,8 0 1,1 140,253 A 5.5,5.5 0 1,0 140,237 Z" fill="#ffc107"/>
  
  <!-- Crescent moon 4 (right brim) -->
  <path d="M 352,235 A 8,8 0 1,1 352,251 A 5.5,5.5 0 1,0 352,235 Z" fill="#ffc107"/>

  <!-- === ARMS (4, Vitruvian style — all within viewBox) === -->
  
  <!-- UPPER LEFT ARM (horizontal, ~x=70 to head) -->
  <rect x="72" y="301" width="120" height="17" rx="8.5" fill="#5a4030" stroke="#3a2810" stroke-width="1.5"/>
  <!-- Shoulder socket left -->
  <circle cx="192" cy="309" r="13" fill="#7a6045" stroke="#3a2810" stroke-width="1.5"/>
  <!-- Wrist cuff left upper -->
  <ellipse cx="80" cy="309" rx="11" ry="8" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <!-- Glove left upper -->
  <circle cx="66" cy="309" r="19" fill="white" stroke="#d8d8d8" stroke-width="1.5"/>
  <!-- Fingers left upper -->
  <rect x="40" y="297" width="17" height="9" rx="4" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(-30,48.5,301.5)"/>
  <rect x="35" y="305" width="20" height="9" rx="4" fill="white" stroke="#ccc" stroke-width="0.8"/>
  <rect x="40" y="316" width="17" height="9" rx="4" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(28,48.5,320.5)"/>
  
  <!-- UPPER RIGHT ARM (horizontal, head to ~x=428) -->
  <rect x="308" y="301" width="120" height="17" rx="8.5" fill="#5a4030" stroke="#3a2810" stroke-width="1.5"/>
  <!-- Shoulder socket right -->
  <circle cx="308" cy="309" r="13" fill="#7a6045" stroke="#3a2810" stroke-width="1.5"/>
  <!-- Wrist cuff right upper -->
  <ellipse cx="420" cy="309" rx="11" ry="8" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  <!-- Glove right upper -->
  <circle cx="434" cy="309" r="19" fill="white" stroke="#d8d8d8" stroke-width="1.5"/>
  <!-- Fingers right upper -->
  <rect x="443" y="297" width="17" height="9" rx="4" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(30,451.5,301.5)"/>
  <rect x="445" y="305" width="20" height="9" rx="4" fill="white" stroke="#ccc" stroke-width="0.8"/>
  <rect x="443" y="316" width="17" height="9" rx="4" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(-28,451.5,320.5)"/>
  
  <!-- LOWER LEFT ARM (angled down-left ~35 deg from body) -->
  <!-- Use a straight line approach: from shoulder (175,350) to glove (88,400) -->
  <line x1="192" y1="345" x2="95" y2="400" stroke="#5a4030" stroke-width="17" stroke-linecap="round"/>
  <line x1="192" y1="345" x2="95" y2="400" stroke="#7a6045" stroke-width="13" stroke-linecap="round"/>
  <!-- Lower left wrist cuff -->
  <ellipse cx="97" cy="400" rx="11" ry="8" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" transform="rotate(-35,97,400)"/>
  <!-- Lower left glove -->
  <circle cx="82" cy="410" r="17" fill="white" stroke="#d8d8d8" stroke-width="1.5"/>
  <!-- Lower left fingers -->
  <rect x="57" y="399" width="16" height="8" rx="3.5" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(-35,65,403)"/>
  <rect x="53" y="408" width="18" height="8" rx="3.5" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(-10,62,412)"/>
  <rect x="57" y="418" width="16" height="8" rx="3.5" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(20,65,422)"/>
  
  <!-- LOWER RIGHT ARM (angled down-right ~35 deg from body) -->
  <line x1="308" y1="345" x2="405" y2="400" stroke="#5a4030" stroke-width="17" stroke-linecap="round"/>
  <line x1="308" y1="345" x2="405" y2="400" stroke="#7a6045" stroke-width="13" stroke-linecap="round"/>
  <!-- Lower right wrist cuff -->
  <ellipse cx="403" cy="400" rx="11" ry="8" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" transform="rotate(35,403,400)"/>
  <!-- Lower right glove -->
  <circle cx="418" cy="410" r="17" fill="white" stroke="#d8d8d8" stroke-width="1.5"/>
  <!-- Lower right fingers -->
  <rect x="427" y="399" width="16" height="8" rx="3.5" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(35,435,403)"/>
  <rect x="429" y="408" width="18" height="8" rx="3.5" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(10,438,412)"/>
  <rect x="427" y="418" width="16" height="8" rx="3.5" fill="white" stroke="#ccc" stroke-width="0.8" transform="rotate(-20,435,422)"/>

  <!-- === HEAD (TV Monitor) === -->
  <!-- Outer head / shadow -->
  <rect x="183" y="257" width="144" height="130" rx="14" fill="#4a2a08" opacity="0.2"/>
  <!-- Head outer box -->
  <rect x="180" y="253" width="140" height="126" rx="13" fill="#b88040" stroke="#7a5020" stroke-width="3"/>
  <!-- Left edge shadow for 3D effect -->
  <rect x="180" y="253" width="32" height="126" rx="13" fill="#8a5820" opacity="0.38"/>
  <!-- Screen bezel -->
  <rect x="190" y="263" width="120" height="90" rx="8" fill="#5a3010" stroke="#3a1a00" stroke-width="2"/>
  <!-- Screen glass -->
  <rect x="197" y="270" width="106" height="76" rx="5" fill="#3a9435"/>
  <!-- Screen lighter green center -->
  <rect x="197" y="270" width="106" height="76" rx="5" fill="#5ab550" opacity="0.45"/>
  <!-- Screen highlight blob (top-left) -->
  <ellipse cx="222" cy="286" rx="33" ry="21" fill="white" opacity="0.38" transform="rotate(-18,222,286)"/>
  <!-- Screen secondary highlight -->
  <ellipse cx="268" cy="312" rx="15" ry="9" fill="white" opacity="0.16" transform="rotate(12,268,312)"/>
  <!-- Screen bottom scanline -->
  <rect x="197" y="322" width="106" height="5" fill="#286820" opacity="0.22"/>
  <!-- Corner rivets -->
  <circle cx="192" cy="265" r="5" fill="#9a7040" stroke="#5a3010" stroke-width="1.5"/>
  <circle cx="308" cy="265" r="5" fill="#9a7040" stroke="#5a3010" stroke-width="1.5"/>
  <circle cx="192" cy="371" r="5" fill="#9a7040" stroke="#5a3010" stroke-width="1.5"/>
  <circle cx="308" cy="371" r="5" fill="#9a7040" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Neck connector -->
  <rect x="233" y="380" width="34" height="14" rx="5" fill="#9a7040" stroke="#7a5020" stroke-width="1"/>
  
  <!-- === BODY === -->
  <!-- Shadow -->
  <rect x="198" y="397" width="106" height="78" rx="9" fill="#4a2a08" opacity="0.18"/>
  <!-- Torso main -->
  <rect x="195" y="393" width="110" height="75" rx="9" fill="#c89040" stroke="#7a5020" stroke-width="2.5"/>
  <!-- Left shadow on torso -->
  <rect x="195" y="393" width="27" height="75" rx="9" fill="#8a5820" opacity="0.32"/>
  <!-- Control panel box -->
  <rect x="207" y="403" width="86" height="32" rx="5" fill="#9a6828" stroke="#7a4a18" stroke-width="1.5"/>
  <!-- Panel rivets -->
  <circle cx="212" cy="408" r="3" fill="#7a4818"/>
  <circle cx="288" cy="408" r="3" fill="#7a4818"/>
  <!-- Main power button -->
  <circle cx="250" cy="432" r="13" fill="#e0b018" stroke="#b08800" stroke-width="2"/>
  <circle cx="250" cy="432" r="8" fill="#f5cc30" opacity="0.65"/>
  <!-- Side attachment bolts -->
  <circle cx="199" cy="426" r="5" fill="#9a7040" stroke="#5a3010" stroke-width="1"/>
  <circle cx="301" cy="426" r="5" fill="#9a7040" stroke="#5a3010" stroke-width="1"/>
  
  <!-- === LEGS === -->
  <!-- Left hip -->
  <rect x="207" y="467" width="33" height="17" rx="7" fill="#8a5820" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Left leg -->
  <rect x="211" y="482" width="22" height="30" rx="6" fill="#9a6830" stroke="#7a4818" stroke-width="1.5"/>
  <!-- Left boot -->
  <rect x="199" y="509" width="44" height="25" rx="7" fill="#3e2208" stroke="#1e0e00" stroke-width="2"/>
  <ellipse cx="213" cy="516" rx="10" ry="6" fill="#5a3418" opacity="0.65"/>
  
  <!-- Right hip -->
  <rect x="260" y="467" width="33" height="17" rx="7" fill="#8a5820" stroke="#5a3010" stroke-width="1.5"/>
  <!-- Right leg -->
  <rect x="267" y="482" width="22" height="30" rx="6" fill="#9a6830" stroke="#7a4818" stroke-width="1.5"/>
  <!-- Right boot -->
  <rect x="257" y="509" width="44" height="25" rx="7" fill="#3e2208" stroke="#1e0e00" stroke-width="2"/>
  <ellipse cx="271" cy="516" rx="10" ry="6" fill="#5a3418" opacity="0.65"/>
</svg>