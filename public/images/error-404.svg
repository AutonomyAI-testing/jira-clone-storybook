<svg viewBox="0 0 500 560" width="500" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Screen glow -->
    <radialGradient id="screenGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" style="stop-color:#7FCC00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA800;stop-opacity:0.8" />
    </radialGradient>

    <!-- Hat gradient -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2C4A7F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2D52;stop-opacity:1" />
    </linearGradient>

    <!-- Arm gradient -->
    <linearGradient id="armGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ===== LEGS (back layer) ===== -->
  
  <!-- Left upper leg -->
  <rect x="210" y="425" width="28" height="65" rx="8" fill="#9D7E52" stroke="#6B5344" stroke-width="2" />
  
  <!-- Left lower leg -->
  <rect x="213" y="490" width="22" height="55" rx="6" fill="#8B6F47" stroke="#6B5344" stroke-width="1.5" />
  
  <!-- Left boot -->
  <rect x="200" y="545" width="44" height="40" rx="6" fill="#4A3728" stroke="#2C2315" stroke-width="2" />
  
  <!-- Right upper leg (mirror) -->
  <rect x="262" y="425" width="28" height="65" rx="8" fill="#9D7E52" stroke="#6B5344" stroke-width="2" />
  
  <!-- Right lower leg (mirror) -->
  <rect x="265" y="490" width="22" height="55" rx="6" fill="#8B6F47" stroke="#6B5344" stroke-width="1.5" />
  
  <!-- Right boot (mirror) -->
  <rect x="256" y="545" width="44" height="40" rx="6" fill="#4A3728" stroke="#2C2315" stroke-width="2" />

  <!-- ===== ARMS (plain rectangles, no transforms) ===== -->
  
  <!-- Left upper arm -->
  <rect x="85" y="265" width="90" height="22" rx="11" fill="#1A1A1A" stroke="#0D0D0D" stroke-width="1.5" />
  
  <!-- Left elbow joint -->
  <circle cx="85" cy="276" r="13" fill="#222" stroke="#0D0D0D" stroke-width="1" />
  
  <!-- Left lower arm -->
  <rect x="20" y="268" width="70" height="20" rx="10" fill="#1A1A1A" stroke="#0D0D0D" stroke-width="1.5" />
  
  <!-- Left glove -->
  <!-- Palm circle -->
  <circle cx="25" cy="260" r="28" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2.5" />
  
  <!-- Left glove fingers (4 fingers extending upward) -->
  <ellipse cx="10" cy="235" rx="9" ry="18" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  <ellipse cx="20" cy="225" rx="9" ry="20" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  <ellipse cx="30" cy="225" rx="9" ry="20" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  <ellipse cx="40" cy="235" rx="9" ry="18" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  
  <!-- Left glove cuff -->
  <ellipse cx="25" cy="285" rx="24" ry="12" fill="#2A2A2A" stroke="#0D0D0D" stroke-width="1.5" />
  
  <!-- Right upper arm -->
  <rect x="325" y="265" width="90" height="22" rx="11" fill="#1A1A1A" stroke="#0D0D0D" stroke-width="1.5" />
  
  <!-- Right elbow joint -->
  <circle cx="415" cy="276" r="13" fill="#222" stroke="#0D0D0D" stroke-width="1" />
  
  <!-- Right lower arm -->
  <rect x="410" y="268" width="70" height="20" rx="10" fill="#1A1A1A" stroke="#0D0D0D" stroke-width="1.5" />
  
  <!-- Right glove -->
  <!-- Palm circle -->
  <circle cx="475" cy="260" r="28" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2.5" />
  
  <!-- Right glove fingers (4 fingers extending upward) -->
  <ellipse cx="460" cy="235" rx="9" ry="18" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  <ellipse cx="470" cy="225" rx="9" ry="20" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  <ellipse cx="480" cy="225" rx="9" ry="20" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  <ellipse cx="490" cy="235" rx="9" ry="18" fill="#F5F5F5" stroke="#4A3A2A" stroke-width="2" />
  
  <!-- Right glove cuff -->
  <ellipse cx="475" cy="285" rx="24" ry="12" fill="#2A2A2A" stroke="#0D0D0D" stroke-width="1.5" />

  <!-- ===== TV HEAD ===== -->
  
  <!-- TV outer box -->
  <rect x="165" y="195" width="170" height="130" rx="12" fill="#B08050" stroke="#6B4A2A" stroke-width="3" />
  
  <!-- TV screen -->
  <rect x="178" y="205" width="144" height="100" rx="6" fill="url(#screenGlow)" stroke="#4A3A2A" stroke-width="1.5" />
  
  <!-- Screen highlight blobs -->
  <ellipse cx="205" cy="220" rx="22" ry="16" fill="#FFFFFF" opacity="0.5" />
  <ellipse cx="235" cy="235" rx="20" ry="14" fill="#FFFFFF" opacity="0.4" />
  
  <!-- Screen shine (top-left corner) -->
  <ellipse cx="185" cy="210" rx="12" ry="10" fill="#FFFFFF" opacity="0.6" />

  <!-- ===== ROBOT TORSO ===== -->
  
  <!-- Torso box -->
  <rect x="185" y="325" width="130" height="100" rx="8" fill="#C49060" stroke="#7A5030" stroke-width="2" />
  
  <!-- Torso panel -->
  <rect x="198" y="345" width="105" height="60" rx="6" fill="#B07840" stroke="#7A5030" stroke-width="1.5" />
  
  <!-- Gold button -->
  <circle cx="250" cy="375" r="16" fill="#FFD700" stroke="#B08000" stroke-width="2" />
  
  <!-- Button shine -->
  <circle cx="247" cy="372" r="5" fill="#FFFF99" opacity="0.7" />

  <!-- ===== WIZARD HAT (front layer) ===== -->
  
  <!-- Hat cone -->
  <polygon points="250,10 60,200 440,200" fill="#1E3A6E" stroke="#0D1A33" stroke-width="2" />
  
  <!-- Cone shading -->
  <polygon points="250,10 60,200 250,185" fill="#3D5A8C" opacity="0.3" />
  
  <!-- Hat brim -->
  <ellipse cx="250" cy="195" rx="195" ry="30" fill="#1E3A6E" stroke="#0D1A33" stroke-width="2" />
  
  <!-- Brim highlight -->
  <ellipse cx="250" cy="190" rx="180" ry="22" fill="#2D4A7D" opacity="0.4" />

  <!-- ===== HAT DECORATIONS ===== -->
  
  <!-- Star 1 (top center of cone) -->
  <g transform="translate(250, 35)">
    <polygon points="0,-16 4.8,-5.1 16.8,-3.1 9.6,2.4 11.5,14.3 0,9 -11.5,14.3 -9.6,2.4 -16.8,-3.1 -4.8,-5.1" fill="#FFD700" stroke="#F0A000" stroke-width="1.5" />
  </g>
  
  <!-- Star 2 (upper left) -->
  <g transform="translate(155, 90)">
    <polygon points="0,-14 4.2,-5.6 14.7,-3.4 10.5,2.8 12.6,13.2 0,8.5 -12.6,13.2 -10.5,2.8 -14.7,-3.4 -4.2,-5.6" fill="#FFD700" stroke="#F0A000" stroke-width="1.5" />
  </g>
  
  <!-- Star 3 (upper right) -->
  <g transform="translate(345, 90)">
    <polygon points="0,-14 4.2,-5.6 14.7,-3.4 10.5,2.8 12.6,13.2 0,8.5 -12.6,13.2 -10.5,2.8 -14.7,-3.4 -4.2,-5.6" fill="#FFD700" stroke="#F0A000" stroke-width="1.5" />
  </g>
  
  <!-- Star 4 (mid left) -->
  <g transform="translate(100, 145)">
    <polygon points="0,-14 4.2,-5.6 14.7,-3.4 10.5,2.8 12.6,13.2 0,8.5 -12.6,13.2 -10.5,2.8 -14.7,-3.4 -4.2,-5.6" fill="#FFD700" stroke="#F0A000" stroke-width="1.5" />
  </g>
  
  <!-- Star 5 (mid right) -->
  <g transform="translate(400, 145)">
    <polygon points="0,-14 4.2,-5.6 14.7,-3.4 10.5,2.8 12.6,13.2 0,8.5 -12.6,13.2 -10.5,2.8 -14.7,-3.4 -4.2,-5.6" fill="#FFD700" stroke="#F0A000" stroke-width="1.5" />
  </g>

  <!-- ===== CRESCENT MOONS ===== -->
  
  <!-- Crescent 1 (left side, upper) -->
  <g>
    <circle cx="120" cy="175" r="16" fill="#FFD700" />
    <circle cx="128" cy="172" r="16" fill="#1E3A6E" />
  </g>
  
  <!-- Crescent 2 (right side, upper) -->
  <g>
    <circle cx="380" cy="175" r="16" fill="#FFD700" />
    <circle cx="372" cy="172" r="16" fill="#1E3A6E" />
  </g>
  
  <!-- Crescent 3 (center, middle of cone) -->
  <g>
    <circle cx="250" cy="130" r="14" fill="#FFD700" />
    <circle cx="258" cy="128" r="14" fill="#1E3A6E" />
  </g>
</svg>