<svg viewBox="-50 20 1100 1060" width="1100" height="1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede0c4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e5d5b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dac9a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" style="stop-color:#b8e840;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#88c820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c89060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a87040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#886030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chestPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#503010;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#3a6daa;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1e4d8c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2050;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hatBrimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2858a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2050;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#646464;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#282828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6a4828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a3018;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bootGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6a4020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a2010;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ccc4b0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c89000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="jointGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#4a2a10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Parchment background -->
  <rect x="-50" y="20" width="1100" height="1060" fill="url(#parchment)" />

  <!-- Parchment speckle texture -->
  <circle cx="80" cy="100" r="2" fill="#b0a080" opacity="0.45" />
  <circle cx="200" cy="70" r="1.5" fill="#b0a080" opacity="0.35" />
  <circle cx="920" cy="140" r="2" fill="#b0a080" opacity="0.4" />
  <circle cx="860" cy="320" r="1.5" fill="#b0a080" opacity="0.35" />
  <circle cx="40" cy="520" r="2.5" fill="#b0a080" opacity="0.3" />
  <circle cx="990" cy="700" r="2" fill="#b0a080" opacity="0.35" />
  <circle cx="120" cy="860" r="1.5" fill="#b0a080" opacity="0.3" />
  <circle cx="940" cy="920" r="2.5" fill="#b0a080" opacity="0.28" />
  <circle cx="350" cy="80" r="1.5" fill="#b0a080" opacity="0.3" />
  <circle cx="700" cy="60" r="2" fill="#b0a080" opacity="0.35" />
  <circle cx="30" cy="350" r="1.5" fill="#b0a080" opacity="0.3" />
  <circle cx="1010" cy="450" r="2" fill="#b0a080" opacity="0.32" />

  <!-- Vitruvian circle (larger, more prominent) -->
  <circle cx="500" cy="580" r="450" stroke="#9a6050" stroke-width="3" fill="none" opacity="0.7" />

  <!-- Vitruvian square frame -->
  <rect x="130" y="340" width="740" height="550" stroke="#9a6050" stroke-width="2.5" fill="none" opacity="0.6" />

  <!-- Center cross guides -->
  <line x1="50" y1="580" x2="950" y2="580" stroke="#9a6050" stroke-width="1.5" opacity="0.4" />
  <line x1="500" y1="120" x2="500" y2="900" stroke="#9a6050" stroke-width="1.5" opacity="0.4" />

  <!-- ===== LEFT ARM ===== -->
  <!-- Upper arm (shoulder to elbow) - long dark pipe -->
  <rect x="150" y="548" width="220" height="42" rx="21" fill="url(#armGrad)" stroke="#181818" stroke-width="2.5" />
  <!-- Shoulder ball joint -->
  <circle cx="370" cy="569" r="24" fill="url(#jointGrad)" stroke="#101010" stroke-width="2.5" />
  <circle cx="370" cy="569" r="10" fill="#505050" stroke="#202020" stroke-width="1.5" />

  <!-- Forearm -->
  <rect x="55" y="551" width="130" height="36" rx="18" fill="url(#armGrad)" stroke="#181818" stroke-width="2.5" />
  <!-- Elbow joint -->
  <circle cx="185" cy="569" r="19" fill="url(#jointGrad)" stroke="#101010" stroke-width="2.5" />
  <circle cx="185" cy="569" r="8" fill="#505050" stroke="#202020" stroke-width="1.5" />

  <!-- Wrist cuff (white/light) -->
  <rect x="50" y="549" width="38" height="40" rx="12" fill="#d8d0c0" stroke="#a09080" stroke-width="2.5" />
  <line x1="60" y1="549" x2="60" y2="589" stroke="#b8b0a0" stroke-width="2" opacity="0.7" />
  <line x1="72" y1="549" x2="72" y2="589" stroke="#b8b0a0" stroke-width="2" opacity="0.7" />

  <!-- LEFT HAND / GLOVE -->
  <!-- Palm -->
  <ellipse cx="18" cy="569" rx="34" ry="44" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2.5" />
  <!-- Individual fingers (cartoon style, splayed) -->
  <!-- Pinky (bottom-most) -->
  <ellipse cx="5" cy="536" rx="11" ry="20" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(-35 5 536)" />
  <!-- Ring -->
  <ellipse cx="8" cy="520" rx="12" ry="22" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(-18 8 520)" />
  <!-- Middle (tallest) -->
  <ellipse cx="20" cy="515" rx="13" ry="24" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" />
  <!-- Index -->
  <ellipse cx="35" cy="520" rx="12" ry="22" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(15 35 520)" />
  <!-- Thumb (to the right) -->
  <ellipse cx="52" cy="545" rx="16" ry="11" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(20 52 545)" />
  <!-- Knuckle detail lines -->
  <line x1="6" y1="546" x2="4" y2="555" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <line x1="10" y1="540" x2="8" y2="549" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <line x1="20" y1="538" x2="20" y2="547" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <line x1="33" y1="540" x2="34" y2="549" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <!-- Palm crease -->
  <path d="M -5 572 Q 20 576 46 570" fill="none" stroke="#b8b0a0" stroke-width="1.5" opacity="0.5" />

  <!-- ===== RIGHT ARM ===== -->
  <!-- Upper arm -->
  <rect x="630" y="548" width="220" height="42" rx="21" fill="url(#armGrad)" stroke="#181818" stroke-width="2.5" />
  <!-- Shoulder ball joint -->
  <circle cx="630" cy="569" r="24" fill="url(#jointGrad)" stroke="#101010" stroke-width="2.5" />
  <circle cx="630" cy="569" r="10" fill="#505050" stroke="#202020" stroke-width="1.5" />

  <!-- Forearm -->
  <rect x="815" y="551" width="130" height="36" rx="18" fill="url(#armGrad)" stroke="#181818" stroke-width="2.5" />
  <!-- Elbow joint -->
  <circle cx="815" cy="569" r="19" fill="url(#jointGrad)" stroke="#101010" stroke-width="2.5" />
  <circle cx="815" cy="569" r="8" fill="#505050" stroke="#202020" stroke-width="1.5" />

  <!-- Wrist cuff (white/light) -->
  <rect x="912" y="549" width="38" height="40" rx="12" fill="#d8d0c0" stroke="#a09080" stroke-width="2.5" />
  <line x1="922" y1="549" x2="922" y2="589" stroke="#b8b0a0" stroke-width="2" opacity="0.7" />
  <line x1="934" y1="549" x2="934" y2="589" stroke="#b8b0a0" stroke-width="2" opacity="0.7" />

  <!-- RIGHT HAND / GLOVE -->
  <ellipse cx="982" cy="569" rx="34" ry="44" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2.5" />
  <!-- Fingers (mirrored) -->
  <ellipse cx="995" cy="536" rx="11" ry="20" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(35 995 536)" />
  <ellipse cx="992" cy="520" rx="12" ry="22" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(18 992 520)" />
  <ellipse cx="980" cy="515" rx="13" ry="24" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" />
  <ellipse cx="965" cy="520" rx="12" ry="22" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(-15 965 520)" />
  <ellipse cx="948" cy="545" rx="16" ry="11" fill="url(#gloveGrad)" stroke="#a09080" stroke-width="2" transform="rotate(-20 948 545)" />
  <!-- Knuckle details -->
  <line x1="994" y1="546" x2="996" y2="555" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <line x1="990" y1="540" x2="992" y2="549" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <line x1="980" y1="538" x2="980" y2="547" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <line x1="967" y1="540" x2="966" y2="549" stroke="#b8b0a0" stroke-width="1.5" opacity="0.6" />
  <path d="M 954 572 Q 980 576 1005 570" fill="none" stroke="#b8b0a0" stroke-width="1.5" opacity="0.5" />

  <!-- ===== ROBOT BODY ===== -->
  <!-- Body shadow -->
  <rect x="345" y="435" width="310" height="292" rx="22" fill="#3a1808" opacity="0.22" transform="translate(8,8)" />

  <!-- Main monitor casing -->
  <rect x="340" y="425" width="320" height="288" rx="22" fill="url(#bodyGrad)" stroke="#4a2a10" stroke-width="3.5" />

  <!-- Side panel shading left -->
  <rect x="340" y="445" width="20" height="248" rx="8" fill="#7a4820" opacity="0.5" />
  <!-- Side panel shading right -->
  <rect x="640" y="445" width="20" height="248" rx="8" fill="#7a4820" opacity="0.5" />

  <!-- Corner bolts/rivets -->
  <circle cx="360" cy="445" r="9" fill="#906040" stroke="#4a2a10" stroke-width="2" />
  <circle cx="640" cy="445" r="9" fill="#906040" stroke="#4a2a10" stroke-width="2" />
  <circle cx="360" cy="695" r="9" fill="#906040" stroke="#4a2a10" stroke-width="2" />
  <circle cx="640" cy="695" r="9" fill="#906040" stroke="#4a2a10" stroke-width="2" />

  <!-- Screen bezel (dark) -->
  <rect x="360" y="440" width="280" height="210" rx="14" fill="#1e1e1e" stroke="#0a0a0a" stroke-width="3" />

  <!-- Screen surface (green) -->
  <rect x="373" y="452" width="254" height="186" rx="8" fill="url(#screenGrad)" />

  <!-- Screen top highlight reflection -->
  <rect x="373" y="452" width="254" height="70" rx="8" fill="#d8f860" opacity="0.15" />

  <!-- White blob highlight (like in reference - organic cloud shape) -->
  <path d="M 395 475 Q 420 455 455 462 Q 485 468 490 490 Q 496 510 475 522 Q 452 534 428 522 Q 402 510 395 490 Z"
        fill="#f0ffc0" opacity="0.55" />
  <path d="M 455 480 Q 480 468 500 478 Q 515 488 510 500 Q 502 512 485 508 Q 468 504 460 492 Z"
        fill="#ffffff" opacity="0.45" />

  <!-- Chest panel (lower body section) -->
  <rect x="358" y="658" width="284" height="50" rx="12" fill="url(#chestPanelGrad)" stroke="#3a1808" stroke-width="2.5" />

  <!-- Chest detail lines -->
  <line x1="370" y1="668" x2="630" y2="668" stroke="#6a3818" stroke-width="1.5" opacity="0.7" />
  <line x1="370" y1="678" x2="630" y2="678" stroke="#6a3818" stroke-width="1.5" opacity="0.7" />
  <line x1="370" y1="688" x2="630" y2="688" stroke="#6a3818" stroke-width="1.5" opacity="0.7" />

  <!-- Central golden power button -->
  <circle cx="500" cy="680" r="24" fill="#8a6008" stroke="#4a3008" stroke-width="2.5" />
  <circle cx="500" cy="680" r="20" fill="url(#buttonGrad)" stroke="#a08010" stroke-width="2" />
  <circle cx="500" cy="680" r="9" fill="#ffe888" />
  <circle cx="494" cy="674" r="3.5" fill="#fffff0" opacity="0.7" />

  <!-- Body bottom dividing line -->
  <line x1="340" y1="710" x2="660" y2="710" stroke="#3a1808" stroke-width="2" opacity="0.4" />

  <!-- ===== LEGS ===== -->
  <!-- Left upper leg -->
  <rect x="408" y="713" width="54" height="88" rx="20" fill="url(#legGrad)" stroke="#3a1808" stroke-width="2.5" />
  <!-- Left knee joint disc -->
  <ellipse cx="435" cy="800" rx="30" ry="20" fill="#7a5028" stroke="#3a1808" stroke-width="2.5" />
  <!-- Left lower leg segment -->
  <rect x="412" y="814" width="46" height="72" rx="14" fill="url(#armGrad)" stroke="#181818" stroke-width="2.5" />

  <!-- Left boot (wide mechanical foot) -->
  <rect x="388" y="878" width="95" height="55" rx="16" fill="url(#bootGrad)" stroke="#1a0808" stroke-width="3" />
  <ellipse cx="448" cy="905" rx="38" ry="20" fill="#4a2a12" stroke="#1a0808" stroke-width="2" />
  <line x1="396" y1="892" x2="475" y2="892" stroke="#7a4820" stroke-width="2" opacity="0.6" />
  <line x1="396" y1="902" x2="475" y2="902" stroke="#7a4820" stroke-width="2" opacity="0.6" />
  <!-- Left heel -->
  <rect x="388" y="898" width="30" height="35" rx="8" fill="#3a1808" stroke="#1a0808" stroke-width="2" />

  <!-- Right upper leg -->
  <rect x="538" y="713" width="54" height="88" rx="20" fill="url(#legGrad)" stroke="#3a1808" stroke-width="2.5" />
  <!-- Right knee joint disc -->
  <ellipse cx="565" cy="800" rx="30" ry="20" fill="#7a5028" stroke="#3a1808" stroke-width="2.5" />
  <!-- Right lower leg -->
  <rect x="542" y="814" width="46" height="72" rx="14" fill="url(#armGrad)" stroke="#181818" stroke-width="2.5" />

  <!-- Right boot -->
  <rect x="517" y="878" width="95" height="55" rx="16" fill="url(#bootGrad)" stroke="#1a0808" stroke-width="3" />
  <ellipse cx="552" cy="905" rx="38" ry="20" fill="#4a2a12" stroke="#1a0808" stroke-width="2" />
  <line x1="525" y1="892" x2="604" y2="892" stroke="#7a4820" stroke-width="2" opacity="0.6" />
  <line x1="525" y1="902" x2="604" y2="902" stroke="#7a4820" stroke-width="2" opacity="0.6" />
  <!-- Right heel -->
  <rect x="582" y="898" width="30" height="35" rx="8" fill="#3a1808" stroke="#1a0808" stroke-width="2" />

  <!-- ===== WIZARD HAT ===== -->
  <!-- Hat drop shadow -->
  <ellipse cx="505" cy="432" rx="285" ry="58" fill="#183060" opacity="0.20" />

  <!-- Wide hat brim ellipse (the characteristic wide flat brim) -->
  <ellipse cx="500" cy="420" rx="278" ry="56" fill="url(#hatBrimGrad)" stroke="#05152a" stroke-width="4" />

  <!-- Brim top sheen -->
  <ellipse cx="500" cy="412" rx="275" ry="46" fill="none" stroke="#5080c0" stroke-width="2.5" opacity="0.4" />
  <!-- Brim edge highlight -->
  <ellipse cx="500" cy="420" rx="276" ry="52" fill="none" stroke="#3060a0" stroke-width="1.5" opacity="0.35" />

  <!-- Hat brim decorations - STARS AND MOONS spread across the brim -->
  <!-- Left side moons and stars on brim -->
  <circle cx="275" cy="418" r="13" fill="#ffd600" />
  <circle cx="280" cy="415" r="11" fill="url(#hatBrimGrad)" />

  <g fill="#ffd600" stroke="#c8a000" stroke-width="1.2">
    <polygon points="330,408 334,419 346,420 337,429 340,440 330,433 320,440 323,429 314,420 326,419" />
  </g>

  <circle cx="405" cy="408" r="11" fill="#ffd600" />
  <circle cx="410" cy="405" r="9" fill="url(#hatBrimGrad)" />

  <g fill="#ffd600" stroke="#c8a000" stroke-width="1.2">
    <polygon points="460,406 463,415 473,416 466,423 468,432 460,427 452,432 454,423 447,416 457,415" />
    <polygon points="545,406 548,415 558,416 551,423 553,432 545,427 537,432 539,423 532,416 542,415" />
  </g>

  <circle cx="600" cy="408" r="11" fill="#ffd600" />
  <circle cx="607" cy="405" r="9" fill="url(#hatBrimGrad)" />

  <g fill="#ffd600" stroke="#c8a000" stroke-width="1.2">
    <polygon points="670,408 674,419 686,420 677,429 680,440 670,433 660,440 663,429 654,420 666,419" />
  </g>

  <circle cx="725" cy="418" r="13" fill="#ffd600" />
  <circle cx="732" cy="415" r="11" fill="url(#hatBrimGrad)" />

  <!-- Hat cone (tall, with bent tip, slightly drooping to left) -->
  <!-- Main cone body -->
  <path d="M 308 418 C 350 310 420 200 462 115 C 478 80 492 55 500 45 C 508 55 522 80 538 115 C 580 200 650 310 692 418 Z"
        fill="url(#hatGrad)" stroke="#05152a" stroke-width="4" />

  <!-- Cone left highlight -->
  <path d="M 308 418 C 350 310 420 200 462 115 C 445 140 400 240 365 360 Z"
        fill="#4878c0" opacity="0.20" />

  <!-- Cone right shadow -->
  <path d="M 692 418 C 650 310 580 200 538 115 C 568 160 618 272 655 385 Z"
        fill="#030f28" opacity="0.30" />

  <!-- Hat tip bent over to the left (drooping) -->
  <path d="M 462 115 C 440 88 408 60 382 48 C 368 42 358 40 356 46 C 354 52 366 58 382 68 C 400 80 418 98 438 118 C 452 132 460 148 462 165"
        fill="url(#hatGrad)" stroke="#05152a" stroke-width="3.5" />
  <!-- Bent tip ball -->
  <circle cx="362" cy="46" r="11" fill="#1a3a7a" stroke="#05152a" stroke-width="2.5" />

  <!-- Stars and moons ON the cone (scattered) -->
  <!-- Top area moon -->
  <circle cx="490" cy="200" r="14" fill="#ffd600" />
  <circle cx="497" cy="197" r="12" fill="url(#hatGrad)" />

  <g fill="#ffd600" stroke="#c8a000" stroke-width="1.3">
    <!-- Star - upper center -->
    <polygon points="510,155 514,167 526,168 517,177 520,189 510,182 500,189 503,177 494,168 506,167" />
    <!-- Star upper right area -->
    <polygon points="568,235 572,245 583,246 575,254 578,264 568,258 558,264 561,254 553,246 564,245" />
    <!-- Star middle left -->
    <polygon points="420,270 424,280 435,281 427,289 430,299 420,293 410,299 413,289 405,281 416,280" />
    <!-- Star lower right -->
    <polygon points="575,330 578,339 588,340 581,347 583,356 575,351 567,356 569,347 562,340 572,339" />
    <!-- Small star top left cone -->
    <polygon points="450,200 453,208 461,209 455,215 457,223 450,218 443,223 445,215 439,209 447,208" />
    <!-- Crescent moon mid-cone -->
    <circle cx="435" cy="330" r="16" fill="#ffd600" />
  </g>
  <circle cx="441" cy="327" r="13" fill="url(#hatGrad)" />

</svg>
