<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460">
  <defs>
    <!-- Paper texture filter -->
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" seed="2" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5" />
    </filter>
    
    <!-- Subtle grain effect -->
    <filter id="grainEffect">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" />
    </filter>

    <!-- Screen gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7FD556;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5FC839;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D8659;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Parchment background -->
  <rect width="420" height="460" fill="#f0e0c0" />
  <rect width="420" height="460" fill="#f0e0c0" filter="url(#grainEffect)" opacity="0.15" />

  <!-- Vitruvian square outline -->
  <rect x="60" y="80" width="300" height="300" fill="none" stroke="#9B6E4B" stroke-width="2.5" opacity="0.5" />

  <!-- Vitruvian circle -->
  <circle cx="210" cy="230" r="165" fill="none" stroke="#9B6E4B" stroke-width="2.5" opacity="0.6" />

  <!-- Horizontal and vertical guide lines -->
  <line x1="60" y1="230" x2="360" y2="230" stroke="#9B6E4B" stroke-width="1" opacity="0.3" />
  <line x1="210" y1="80" x2="210" y2="380" stroke="#9B6E4B" stroke-width="1" opacity="0.3" />

  <!-- ===== WIZARD HAT ===== -->
  <g id="wizard-hat">
    <!-- Hat brim - wide ellipse (drawn first, behind cone) -->
    <ellipse cx="210" cy="170" rx="115" ry="22" fill="#1a3a8f" stroke="#2d1a00" stroke-width="3" />
    <!-- Brim top edge highlight -->
    <ellipse cx="210" cy="165" rx="113" ry="15" fill="#2244aa" opacity="0.35" />
    <!-- Brim bottom shadow -->
    <ellipse cx="210" cy="177" rx="110" ry="10" fill="#0d1f4f" opacity="0.5" />

    <!-- Hat cone - tall and tilted right -->
    <path d="M 225 20 L 130 165 L 285 165 Z" fill="#1a3a8f" stroke="#2d1a00" stroke-width="3" stroke-linejoin="round" />
    <!-- Cone left side shading -->
    <path d="M 225 20 L 130 165 L 210 165 Z" fill="#0d1f4f" opacity="0.4" />
    <!-- Cone right side highlight -->
    <path d="M 225 20 L 285 165 L 210 165 Z" fill="#2244aa" opacity="0.25" />

    <!-- STARS ON HAT - scattered on cone and brim -->
    <!-- Star 1 - upper right on cone (inside cone) -->
    <g id="star1">
      <path d="M 255 70 L 258 77 L 266 77 L 260 82 L 263 90 L 255 85 L 247 90 L 250 82 L 244 77 L 252 77 Z" 
            fill="#ffd700" stroke="#d4a500" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Star 2 - left side of cone (inside cone) -->
    <g id="star2">
      <path d="M 165 100 L 168 107 L 176 107 L 170 112 L 173 120 L 165 115 L 157 120 L 160 112 L 154 107 L 162 107 Z" 
            fill="#ffd700" stroke="#d4a500" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Star 3 - center-right on cone (inside cone) -->
    <g id="star3">
      <path d="M 245 115 L 248 122 L 256 122 L 250 127 L 253 135 L 245 130 L 237 135 L 240 127 L 234 122 L 242 122 Z" 
            fill="#ffd700" stroke="#d4a500" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Star 4 - on brim left -->
    <g id="star4">
      <path d="M 115 172 L 118 179 L 126 179 L 120 184 L 123 192 L 115 187 L 107 192 L 110 184 L 104 179 L 112 179 Z" 
            fill="#ffd700" stroke="#d4a500" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- Star 5 - on brim right -->
    <g id="star5">
      <path d="M 295 168 L 298 175 L 306 175 L 300 180 L 303 188 L 295 183 L 287 188 L 290 180 L 284 175 L 292 175 Z" 
            fill="#ffd700" stroke="#d4a500" stroke-width="1.5" stroke-linejoin="round" />
    </g>

    <!-- MOONS ON HAT - created with overlapping circles -->
    <!-- Moon 1 - upper on cone (inside cone) -->
    <g id="moon1">
      <circle cx="215" cy="55" r="9" fill="#ffd700" />
      <circle cx="221" cy="52" r="8" fill="#1a3a8f" />
    </g>

    <!-- Moon 2 - left lower on cone (inside cone) -->
    <g id="moon2">
      <circle cx="175" cy="130" r="9" fill="#ffd700" />
      <circle cx="181" cy="128" r="8" fill="#1a3a8f" />
    </g>

    <!-- Moon 3 - on brim right -->
    <g id="moon3">
      <circle cx="270" cy="165" r="9" fill="#ffd700" />
      <circle cx="276" cy="163" r="8" fill="#1a3a8f" />
    </g>

    <!-- Moon 4 - on brim left -->
    <g id="moon4">
      <circle cx="145" cy="168" r="9" fill="#ffd700" />
      <circle cx="151" cy="166" r="8" fill="#1a3a8f" />
    </g>
  </g>

  <!-- ===== TV MONITOR HEAD ===== -->
  <g id="monitor-head">
    <!-- Outer frame/bezel - darker copper brown -->
    <rect x="155" y="175" width="110" height="95" rx="8" fill="#8B6310" stroke="#2d1a00" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Frame highlight -->
    <rect x="155" y="175" width="110" height="95" rx="8" fill="#b8956f" opacity="0.3" />
    <!-- Inner shadow/bevel on TV frame -->
    <rect x="155" y="175" width="110" height="90" rx="8" fill="none" stroke="#5a3a00" stroke-width="1" opacity="0.5" />

    <!-- Screen back layer -->
    <rect x="162" y="182" width="96" height="81" rx="6" fill="#2d2416" stroke="none" />

    <!-- Screen glass with gradient -->
    <rect x="167" y="187" width="86" height="71" rx="4" fill="url(#screenGradient)" stroke="none" />

    <!-- Screen bezel/border -->
    <rect x="167" y="187" width="86" height="71" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1" />

    <!-- White glare/highlights on screen -->
    <!-- Top-left oval gloss -->
    <ellipse cx="182" cy="201" rx="16" ry="13" fill="#ffffff" opacity="0.28" />
    <!-- Center-top gloss -->
    <ellipse cx="210" cy="191" rx="13" ry="8" fill="#ffffff" opacity="0.2" />
    <!-- Bottom-right glare -->
    <ellipse cx="238" cy="238" rx="14" ry="10" fill="#ffffff" opacity="0.15" />

    <!-- Screen scanlines -->
    <line x1="170" y1="195" x2="250" y2="195" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="202" x2="250" y2="202" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="209" x2="250" y2="209" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="216" x2="250" y2="216" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="223" x2="250" y2="223" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="230" x2="250" y2="230" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="237" x2="250" y2="237" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
    <line x1="170" y1="244" x2="250" y2="244" stroke="#ffffff" stroke-width="0.5" opacity="0.08" />
  </g>

  <!-- ===== LEFT ARM ===== -->
  <g id="left-arm">
    <!-- Upper arm - angled down and out -->
    <rect x="45" y="240" width="90" height="20" rx="7" fill="#555555" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" transform="rotate(-12 90 250)" />
    
    <!-- Elbow joint -->
    <circle cx="60" cy="255" r="7" fill="#4a4a4a" stroke="#2d1a00" stroke-width="2" />
    
    <!-- Lower arm - continues angle -->
    <rect x="20" y="250" width="70" height="20" rx="7" fill="#555555" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" transform="rotate(-15 55 260)" />
    
    <!-- Wrist joint -->
    <circle cx="35" cy="270" r="6" fill="#4a4a4a" stroke="#2d1a00" stroke-width="2" />
  </g>

  <!-- ===== RIGHT ARM ===== -->
  <g id="right-arm">
    <!-- Upper arm - angled down and out -->
    <rect x="285" y="240" width="90" height="20" rx="7" fill="#555555" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" transform="rotate(12 330 250)" />
    
    <!-- Elbow joint -->
    <circle cx="360" cy="255" r="7" fill="#4a4a4a" stroke="#2d1a00" stroke-width="2" />
    
    <!-- Lower arm - continues angle -->
    <rect x="330" y="250" width="70" height="20" rx="7" fill="#555555" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" transform="rotate(15 365 260)" />
    
    <!-- Wrist joint -->
    <circle cx="385" cy="270" r="6" fill="#4a4a4a" stroke="#2d1a00" stroke-width="2" />
  </g>

  <!-- ===== LEFT GLOVED HAND ===== -->
  <g id="left-glove">
    <!-- Palm base -->
    <ellipse cx="30" cy="280" rx="10" ry="12" fill="#ffffff" stroke="#2d1a00" stroke-width="1.8" />
    
    <!-- Fingers fanning out -->
    <!-- Thumb -->
    <ellipse cx="18" cy="272" rx="4" ry="8" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Index -->
    <ellipse cx="26" cy="266" rx="4" ry="9" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Middle -->
    <ellipse cx="34" cy="264" rx="4" ry="10" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Ring -->
    <ellipse cx="42" cy="266" rx="4" ry="9" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Pinky -->
    <ellipse cx="48" cy="274" rx="4" ry="8" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    
    <!-- Hand shadow -->
    <ellipse cx="30" cy="280" rx="10" ry="12" fill="#e8e8e8" opacity="0.3" stroke="none" />
  </g>

  <!-- ===== RIGHT GLOVED HAND ===== -->
  <g id="right-glove">
    <!-- Palm base -->
    <ellipse cx="390" cy="280" rx="10" ry="12" fill="#ffffff" stroke="#2d1a00" stroke-width="1.8" />
    
    <!-- Fingers fanning out -->
    <!-- Pinky -->
    <ellipse cx="372" cy="274" rx="4" ry="8" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Ring -->
    <ellipse cx="378" cy="266" rx="4" ry="9" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Middle -->
    <ellipse cx="386" cy="264" rx="4" ry="10" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Index -->
    <ellipse cx="394" cy="266" rx="4" ry="9" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Thumb -->
    <ellipse cx="402" cy="272" rx="4" ry="8" fill="#ffffff" stroke="#2d1a00" stroke-width="1.5" />
    
    <!-- Hand shadow -->
    <ellipse cx="390" cy="280" rx="10" ry="12" fill="#e8e8e8" opacity="0.3" stroke="none" />
  </g>

  <!-- ===== ROBOT BODY/TORSO ===== -->
  <g id="robot-body">
    <!-- Main body box - warm bronze, wider and taller -->
    <rect x="155" y="280" width="110" height="75" rx="7" fill="#b87333" stroke="#2d1a00" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Body highlight -->
    <rect x="155" y="280" width="55" height="75" rx="7" fill="#c9a870" opacity="0.35" />

    <!-- Center panel with dashed border -->
    <rect x="167" y="293" width="86" height="52" rx="3" fill="none" stroke="#2d1a00" stroke-width="2" stroke-dasharray="3,2" />

    <!-- Center button/dial - gold circle -->
    <circle cx="210" cy="319" r="9" fill="#ffd700" stroke="#2d1a00" stroke-width="1.5" />
    <!-- Button highlight -->
    <circle cx="207" cy="316" r="3.5" fill="#ffeb99" opacity="0.6" />

    <!-- Left side rivets -->
    <circle cx="163" cy="300" r="3" fill="#8B6914" stroke="#2d1a00" stroke-width="0.8" />
    <circle cx="163" cy="319" r="3" fill="#8B6914" stroke="#2d1a00" stroke-width="0.8" />
    <circle cx="163" cy="338" r="3" fill="#8B6914" stroke="#2d1a00" stroke-width="0.8" />

    <!-- Right side rivets -->
    <circle cx="257" cy="300" r="3" fill="#8B6914" stroke="#2d1a00" stroke-width="0.8" />
    <circle cx="257" cy="319" r="3" fill="#8B6914" stroke="#2d1a00" stroke-width="0.8" />
    <circle cx="257" cy="338" r="3" fill="#8B6914" stroke="#2d1a00" stroke-width="0.8" />
  </g>

  <!-- ===== LEFT LEG ===== -->
  <g id="left-leg">
    <!-- Upper leg -->
    <rect x="180" y="355" width="16" height="35" rx="5" fill="#6b5946" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Knee joint -->
    <circle cx="188" cy="365" r="5" fill="#555555" stroke="#2d1a00" stroke-width="1.5" />
    
    <!-- Lower leg -->
    <rect x="180" y="385" width="16" height="35" rx="5" fill="#6b5946" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Ankle joint -->
    <circle cx="188" cy="397" r="4" fill="#555555" stroke="#2d1a00" stroke-width="1.5" />
  </g>

  <!-- ===== RIGHT LEG ===== -->
  <g id="right-leg">
    <!-- Upper leg -->
    <rect x="224" y="355" width="16" height="35" rx="5" fill="#6b5946" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Knee joint -->
    <circle cx="232" cy="365" r="5" fill="#555555" stroke="#2d1a00" stroke-width="1.5" />
    
    <!-- Lower leg -->
    <rect x="224" y="385" width="16" height="35" rx="5" fill="#6b5946" stroke="#2d1a00" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Ankle joint -->
    <circle cx="232" cy="397" r="4" fill="#555555" stroke="#2d1a00" stroke-width="1.5" />
  </g>

  <!-- ===== LEFT BOOT ===== -->
  <g id="left-boot">
    <!-- Boot box - large chunky -->
    <rect x="175" y="418" width="26" height="24" rx="4" fill="#4a2c0a" stroke="#2d1a00" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Boot shading -->
    <rect x="175" y="418" width="26" height="12" rx="4" fill="#6b4820" opacity="0.4" />
    <!-- Boot sole -->
    <rect x="175" y="436" width="26" height="3" fill="#3a1f0a" stroke="none" />
  </g>

  <!-- ===== RIGHT BOOT ===== -->
  <g id="right-boot">
    <!-- Boot box - large chunky -->
    <rect x="219" y="418" width="26" height="24" rx="4" fill="#4a2c0a" stroke="#2d1a00" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Boot shading -->
    <rect x="219" y="418" width="26" height="12" rx="4" fill="#6b4820" opacity="0.4" />
    <!-- Boot sole -->
    <rect x="219" y="436" width="26" height="3" fill="#3a1f0a" stroke="none" />
  </g>
</svg>