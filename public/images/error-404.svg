<svg
  viewBox="0 0 520 520"
  width="520"
  height="520"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Screen gradient from light to dark green -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#88ee66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#339922;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Parchment background with subtle noise texture -->
  <rect width="520" height="520" fill="#f5eedc" />
  <!-- Subtle noise circles scattered for texture -->
  <circle cx="80" cy="60" r="2" fill="#d4c4a0" opacity="0.3" />
  <circle cx="450" cy="120" r="1.5" fill="#d4c4a0" opacity="0.25" />
  <circle cx="520" cy="380" r="2.5" fill="#d4c4a0" opacity="0.2" />
  <circle cx="40" cy="450" r="1.8" fill="#d4c4a0" opacity="0.3" />
  <circle cx="380" cy="480" r="2" fill="#d4c4a0" opacity="0.25" />
  <circle cx="150" cy="500" r="1.5" fill="#d4c4a0" opacity="0.2" />

  <!-- Vitruvian frame: Large circle -->
  <circle cx="260" cy="270" r="210" stroke="#7a5c3c" stroke-width="2" fill="none" />

  <!-- Vitruvian frame: Square -->
  <rect x="75" y="100" width="370" height="340" stroke="#7a5c3c" stroke-width="2" fill="none" />

  <!-- WIZARD HAT (large and prominent) -->
  <g id="wizard-hat">
    <!-- Hat brim (wide ellipse) -->
    <ellipse cx="260" cy="225" rx="145" ry="28" fill="#3d5a8a" stroke="#0a1a4a" stroke-width="2" />

    <!-- Brim shading (darker left side) -->
    <ellipse cx="260" cy="225" rx="145" ry="28" fill="#2a3f6a" opacity="0.4" clip-path="polygon(0 0, 50% 0, 50% 100%, 0 100%)" />

    <!-- Hat cone/point (tall triangle) -->
    <polygon points="275,25 170,225 350,225" fill="#3d5a8a" stroke="#0a1a4a" stroke-width="2" />

    <!-- Cone shading (darker left side for depth) -->
    <polygon points="275,25 170,225 210,225" fill="#2a3f6a" opacity="0.5" />

    <!-- Yellow stars on hat (5 stars) -->
    <!-- Star 1 (top of cone) -->
    <polygon
      points="260,60 263,70 274,70 266,76 269,86 260,81 251,86 254,76 246,70 257,70"
      fill="#ffd700"
      stroke="#e8a800"
      stroke-width="0.5"
    />
    <!-- Star 2 (upper left) -->
    <polygon
      points="210,120 213,128 224,128 216,133 219,142 210,137 201,142 204,133 196,128 207,128"
      fill="#ffd700"
      stroke="#e8a800"
      stroke-width="0.5"
    />
    <!-- Star 3 (upper right) -->
    <polygon
      points="310,120 313,128 324,128 316,133 319,142 310,137 301,142 304,133 296,128 307,128"
      fill="#ffd700"
      stroke="#e8a800"
      stroke-width="0.5"
    />
    <!-- Star 4 (lower left) -->
    <polygon
      points="190,200 193,208 204,208 196,213 199,222 190,217 181,222 184,213 176,208 187,208"
      fill="#ffd700"
      stroke="#e8a800"
      stroke-width="0.5"
    />
    <!-- Star 5 (lower right) -->
    <polygon
      points="330,200 333,208 344,208 336,213 339,222 330,217 321,222 324,213 316,208 327,208"
      fill="#ffd700"
      stroke="#e8a800"
      stroke-width="0.5"
    />

    <!-- Yellow crescent moons (4-5 moons) -->
    <!-- Moon 1 (upper-left of cone) -->
    <g>
      <circle cx="225" cy="80" r="9" fill="#ffd700" />
      <circle cx="230" cy="80" r="7" fill="#3d5a8a" />
    </g>
    <!-- Moon 2 (upper-right of cone) -->
    <g>
      <circle cx="295" cy="90" r="9" fill="#ffd700" />
      <circle cx="300" cy="90" r="7" fill="#3d5a8a" />
    </g>
    <!-- Moon 3 (mid-left of cone) -->
    <g>
      <circle cx="205" cy="130" r="7" fill="#ffd700" />
      <circle cx="211" cy="130" r="5.5" fill="#3d5a8a" />
    </g>
    <!-- Moon 4 (left side of brim) -->
    <g>
      <circle cx="155" cy="248" r="8" fill="#ffd700" />
      <circle cx="161" cy="248" r="6" fill="#3d5a8a" />
    </g>
    <!-- Moon 5 (right side of brim) -->
    <g>
      <circle cx="365" cy="248" r="8" fill="#ffd700" />
      <circle cx="359" cy="248" r="6" fill="#3d5a8a" />
    </g>
  </g>

  <!-- ROBOT HEAD/TV SCREEN -->
  <g id="robot-head">
    <!-- Head outer frame (rounded rect, brown) -->
    <rect
      x="195"
      y="220"
      width="130"
      height="110"
      rx="12"
      fill="#9a6835"
      stroke="#3a1a00"
      stroke-width="3"
    />

    <!-- Head shading (darker top) -->
    <rect x="195" y="220" width="130" height="30" rx="12" fill="#3a1a00" opacity="0.2" />

    <!-- Screen inner display (bright green) -->
    <rect
      x="210"
      y="235"
      width="100"
      height="75"
      rx="4"
      fill="url(#screenGradient)"
      stroke="#4a7a2a"
      stroke-width="1"
    />

    <!-- Screen highlights (white semi-transparent organic blobs) -->
    <ellipse cx="225" cy="250" rx="18" ry="14" fill="#ffffff" opacity="0.35" />
    <ellipse cx="240" cy="260" rx="12" ry="8" fill="#ffffff" opacity="0.25" />

    <!-- Rivets at head corners -->
    <circle cx="205" cy="230" r="3" fill="#3a1a00" />
    <circle cx="315" cy="230" r="3" fill="#3a1a00" />
  </g>

  <!-- ROBOT BODY/TORSO -->
  <g id="robot-body">
    <!-- Main torso (rounded rect, tan/brown) -->
    <rect
      x="205"
      y="340"
      width="110"
      height="90"
      rx="10"
      fill="#b07040"
      stroke="#3a1a00"
      stroke-width="3"
    />

    <!-- Body shading (darker top) -->
    <rect x="205" y="340" width="110" height="25" rx="10" fill="#3a1a00" opacity="0.15" />

    <!-- Power button (gold circle) -->
    <circle cx="260" cy="385" r="8" fill="#e8b830" stroke="#3a1a00" stroke-width="1" />
  </g>

  <!-- LEGS -->
  <g id="legs">
    <!-- Left leg -->
    <rect x="225" y="435" width="20" height="30" rx="3" fill="#7a4820" stroke="#3a1a00" stroke-width="2" />
    <!-- Right leg -->
    <rect x="275" y="435" width="20" height="30" rx="3" fill="#7a4820" stroke="#3a1a00" stroke-width="2" />
  </g>

  <!-- BOOTS -->
  <g id="boots">
    <!-- Left boot -->
    <rect x="210" y="468" width="50" height="22" rx="3" fill="#7a4820" stroke="#3a1a00" stroke-width="2" />
    <!-- Left boot front panel (lighter) -->
    <rect x="215" y="470" width="35" height="18" fill="#9a5830" opacity="0.7" />

    <!-- Right boot -->
    <rect x="260" y="468" width="50" height="22" rx="3" fill="#7a4820" stroke="#3a1a00" stroke-width="2" />
    <!-- Right boot front panel (lighter) -->
    <rect x="265" y="470" width="35" height="18" fill="#9a5830" opacity="0.7" />
  </g>

  <!-- UPPER LEFT ARM (angled up-left) -->
  <g id="upper-left-arm">
    <!-- Arm bar from body going up-left -->
    <rect x="100" y="270" width="95" height="20" rx="10" fill="#5a3510" stroke="#3a1a00" stroke-width="2" transform="rotate(-35 195 280)" />
  </g>

  <!-- UPPER RIGHT ARM (angled up-right) -->
  <g id="upper-right-arm">
    <!-- Arm bar from body going up-right -->
    <rect x="325" y="270" width="95" height="20" rx="10" fill="#5a3510" stroke="#3a1a00" stroke-width="2" transform="rotate(35 325 280)" />
  </g>

  <!-- LOWER LEFT ARM (angled down-left) -->
  <g id="lower-left-arm">
    <!-- Arm bar from body going down-left -->
    <rect x="85" y="305" width="110" height="18" rx="9" fill="#5a3510" stroke="#3a1a00" stroke-width="2" transform="rotate(-25 195 310)" />
  </g>

  <!-- LOWER RIGHT ARM (angled down-right) -->
  <g id="lower-right-arm">
    <!-- Arm bar from body going down-right -->
    <rect x="325" y="305" width="110" height="18" rx="9" fill="#5a3510" stroke="#3a1a00" stroke-width="2" transform="rotate(25 325 310)" />
  </g>

  <!-- LEFT GLOVED HAND (upper arm end) -->
  <g id="left-hand-upper">
    <!-- Main hand circle -->
    <circle cx="100" cy="195" r="20" fill="#ffffff" stroke="#3a1a00" stroke-width="2" />
    <!-- Finger bumps on top of hand -->
    <circle cx="88" cy="185" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="100" cy="175" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="112" cy="185" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
  </g>

  <!-- RIGHT GLOVED HAND (upper arm end) -->
  <g id="right-hand-upper">
    <!-- Main hand circle -->
    <circle cx="420" cy="195" r="20" fill="#ffffff" stroke="#3a1a00" stroke-width="2" />
    <!-- Finger bumps on top of hand -->
    <circle cx="408" cy="185" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="420" cy="175" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="432" cy="185" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
  </g>

  <!-- LEFT GLOVED HAND (lower arm end) -->
  <g id="left-hand-lower">
    <!-- Main hand circle -->
    <circle cx="110" cy="370" r="20" fill="#ffffff" stroke="#3a1a00" stroke-width="2" />
    <!-- Finger bumps on top of hand -->
    <circle cx="98" cy="360" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="110" cy="350" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="122" cy="360" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
  </g>

  <!-- RIGHT GLOVED HAND (lower arm end) -->
  <g id="right-hand-lower">
    <!-- Main hand circle -->
    <circle cx="410" cy="370" r="20" fill="#ffffff" stroke="#3a1a00" stroke-width="2" />
    <!-- Finger bumps on top of hand -->
    <circle cx="398" cy="360" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="410" cy="350" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
    <circle cx="422" cy="360" r="6" fill="#ffffff" stroke="#3a1a00" stroke-width="1" />
  </g>
</svg>