<svg viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .wizard-star { fill: #FFD700; stroke: #C8A000; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background parchment -->
  <rect width="500" height="560" fill="#e8dcc8"/>

  <!-- Texture circles (speckles) -->
  <circle cx="50" cy="80" r="1.5" fill="#c4a882" opacity="0.5"/>
  <circle cx="450" cy="120" r="1.5" fill="#c4a882" opacity="0.5"/>
  <circle cx="80" cy="380" r="1.5" fill="#c4a882" opacity="0.5"/>
  <circle cx="420" cy="420" r="1.5" fill="#c4a882" opacity="0.5"/>
  <circle cx="350" cy="100" r="1.5" fill="#c4a882" opacity="0.5"/>

  <!-- Geometric guides: Large circle (Vitruvian Man style) -->
  <circle cx="250" cy="310" r="200" fill="none" stroke="#9B6B5A" stroke-width="2"/>

  <!-- Geometric guides: Rectangle -->
  <rect x="120" y="120" width="260" height="380" fill="none" stroke="#9B6B5A" stroke-width="2"/>

  <!-- LAYER 3: Diagonal left arm (back) -->
  <line x1="190" y1="360" x2="70" y2="460" stroke="#3d3d3d" stroke-width="22" stroke-linecap="round"/>

  <!-- LAYER 4: Diagonal right arm (back) -->
  <line x1="310" y1="360" x2="430" y2="460" stroke="#3d3d3d" stroke-width="22" stroke-linecap="round"/>

  <!-- LAYER 5: Horizontal left arm (T-pose) -->
  <line x1="185" y1="245" x2="55" y2="245" stroke="#3d3d3d" stroke-width="22" stroke-linecap="round"/>

  <!-- LAYER 6: Horizontal right arm (T-pose) -->
  <line x1="315" y1="245" x2="445" y2="245" stroke="#3d3d3d" stroke-width="22" stroke-linecap="round"/>

  <!-- LAYER 7: Left diagonal glove (spreading fingers down-left) -->
  <g id="left-diagonal-glove">
    <circle cx="62" cy="468" r="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <!-- fingers pointing down-left -->
    <rect x="25" y="458" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(-30 35 461.5)"/>
    <rect x="20" y="468" width="22" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(-15 31 471.5)"/>
    <rect x="25" y="478" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(0 35 481.5)"/>
  </g>

  <!-- LAYER 8: Right diagonal glove (spreading fingers down-right) -->
  <g id="right-diagonal-glove">
    <circle cx="438" cy="468" r="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <!-- fingers pointing down-right -->
    <rect x="458" y="458" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(30 468 461.5)"/>
    <rect x="458" y="468" width="22" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(15 469 471.5)"/>
    <rect x="458" y="478" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(0 468 481.5)"/>
  </g>

  <!-- LAYER 9: Left horizontal glove (T-pose, fingers left) -->
  <g id="left-horizontal-glove">
    <circle cx="45" cy="245" r="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <!-- fingers pointing left -->
    <rect x="10" y="237" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <rect x="8" y="245" width="22" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <rect x="10" y="253" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  </g>

  <!-- LAYER 10: Right horizontal glove (T-pose, fingers right) -->
  <g id="right-horizontal-glove">
    <circle cx="455" cy="245" r="20" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <!-- fingers pointing right -->
    <rect x="470" y="237" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <rect x="470" y="245" width="22" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <rect x="470" y="253" width="20" height="7" rx="3.5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  </g>

  <!-- LAYER 11: Left leg -->
  <rect x="207" y="425" width="24" height="55" rx="4" fill="#7a5c40" stroke="#5a3f28" stroke-width="2"/>

  <!-- LAYER 12: Right leg -->
  <rect x="269" y="425" width="24" height="55" rx="4" fill="#7a5c40" stroke="#5a3f28" stroke-width="2"/>

  <!-- LAYER 13: Left boot -->
  <ellipse cx="219" cy="485" rx="36" ry="22" fill="#4a3528" stroke="#3a2518" stroke-width="2"/>
  <rect x="200" y="479" width="38" height="4" rx="2" fill="#5a4a38"/>
  <!-- Left boot toe cap -->
  <ellipse cx="205" cy="497" rx="16" ry="10" fill="#3a2518" opacity="0.5"/>

  <!-- LAYER 14: Right boot -->
  <ellipse cx="281" cy="485" rx="36" ry="22" fill="#4a3528" stroke="#3a2518" stroke-width="2"/>
  <rect x="262" y="479" width="38" height="4" rx="2" fill="#5a4a38"/>
  <!-- Right boot toe cap -->
  <ellipse cx="295" cy="497" rx="16" ry="10" fill="#3a2518" opacity="0.5"/>

  <!-- LAYER 15: Torso -->
  <rect x="185" y="295" width="130" height="130" rx="6" fill="#9b7b5a" stroke="#6b5035" stroke-width="3"/>

  <!-- Body shading (right side darker stripe) -->
  <rect x="295" y="295" width="20" height="130" fill="#5a3f28" opacity="0.25" rx="0"/>

  <!-- Wood grain lines (vertical) -->
  <line x1="205" y1="300" x2="205" y2="420" stroke="#7a5c40" stroke-width="1" opacity="0.35"/>
  <line x1="225" y1="300" x2="225" y2="420" stroke="#7a5c40" stroke-width="1" opacity="0.35"/>
  <line x1="245" y1="300" x2="245" y2="420" stroke="#7a5c40" stroke-width="1" opacity="0.35"/>
  <line x1="265" y1="300" x2="265" y2="420" stroke="#7a5c40" stroke-width="1" opacity="0.35"/>
  <line x1="285" y1="300" x2="285" y2="420" stroke="#7a5c40" stroke-width="1" opacity="0.35"/>

  <!-- Gold button -->
  <circle cx="250" cy="375" r="14" fill="#d4a520" stroke="#a07800" stroke-width="2"/>
  <circle cx="245" cy="370" r="5" fill="#ffe080" opacity="0.6"/>

  <!-- Rivets/bolts at corners (small dark circles) -->
  <circle cx="195" cy="305" r="4" fill="#5a3f28" stroke="#3a2518" stroke-width="1"/>
  <circle cx="305" cy="305" r="4" fill="#5a3f28" stroke="#3a2518" stroke-width="1"/>
  <circle cx="195" cy="415" r="4" fill="#5a3f28" stroke="#3a2518" stroke-width="1"/>
  <circle cx="305" cy="415" r="4" fill="#5a3f28" stroke="#3a2518" stroke-width="1"/>

  <!-- LAYER 16: Head/screen module -->
  <rect x="175" y="175" width="150" height="120" rx="8" fill="#9b7b5a" stroke="#6b5035" stroke-width="3"/>

  <!-- CRT screen -->
  <rect x="195" y="190" width="110" height="90" rx="5" fill="#5cbd5c" stroke="#4a3525" stroke-width="2"/>

  <!-- Screen glow gradient (lighter green ellipse) -->
  <ellipse cx="250" cy="235" rx="50" ry="35" fill="#7de87d" opacity="0.4"/>

  <!-- Neck/connector between head and torso -->
  <rect x="225" y="295" width="50" height="12" rx="4" fill="#7a5c40" stroke="#5a3f28" stroke-width="1.5"/>

  <!-- Large upper-left glare blob -->
  <ellipse cx="215" cy="200" rx="18" ry="12" fill="white" opacity="0.45"/>
  <!-- Small secondary glare -->
  <ellipse cx="238" cy="193" rx="8" ry="5" fill="white" opacity="0.30"/>

  <!-- LAYER 17: Wizard Hat Brim -->
  <ellipse cx="250" cy="175" rx="110" ry="28" fill="#1a2a5e" stroke="#0d1430" stroke-width="2.5"/>

  <!-- LAYER 18: Wizard Hat Cone (curved) -->
  <path d="M 265,18 C 290,60 310,100 310,140 L 190,180 C 220,140 240,80 265,18 Z" fill="#1a2a5e" stroke="#0d1430" stroke-width="2.5"/>

  <!-- Hat cone highlight (3D effect on left side) -->
  <path d="M 265,18 C 280,50 290,90 295,140 L 220,175 C 235,120 250,60 265,18 Z" fill="#2d4a8e" opacity="0.35"/>

  <!-- LAYER 19: Stars on Hat -->

  <!-- Star 1: Top left of cone (13px radius) -->
  <polygon class="wizard-star" points="215,42 218.6,50.5 227.5,50.5 220.4,55.8 223.1,64.3 215,59 206.9,64.3 209.6,55.8 202.5,50.5 211.4,50.5"/>

  <!-- Star 2: Top right of cone (11px radius) -->
  <polygon class="wizard-star" points="290,32 292.7,38.8 300.5,39 294.4,43.8 296.9,50.5 290,46 283.1,50.5 285.6,43.8 279.5,39 287.3,38.8"/>

  <!-- Star 3: Left side mid-cone (10px radius) -->
  <polygon class="wizard-star" points="175,120 177.6,126.5 185.5,126.5 178.4,131.8 181.1,140.3 175,135 168.9,140.3 171.6,131.8 164.5,126.5 172.4,126.5"/>

  <!-- Star 4: Right side mid-cone (10px radius) -->
  <polygon class="wizard-star" points="330,115 332.6,121.5 340.5,121.5 333.4,126.8 336.1,135.3 330,130 323.9,135.3 326.6,126.8 319.5,121.5 327.4,121.5"/>

  <!-- Star 5: Left brim (9px radius) -->
  <polygon class="wizard-star" points="200,165 202.3,170.4 208.2,170.7 203.6,174.9 205.9,180.3 200,176.1 194.1,180.3 196.4,174.9 191.8,170.7 197.7,170.4"/>

  <!-- Star 6: Right brim (9px radius) -->
  <polygon class="wizard-star" points="310,162 312.3,167.4 318.2,167.7 313.6,171.9 315.9,177.3 310,173.1 304.1,177.3 306.4,171.9 301.8,167.7 307.7,167.4"/>

  <!-- LAYER 20: Crescent Moons on Hat -->

  <!-- Crescent Moon 1: Left brim -->
  <g id="moon-left">
    <circle cx="185" cy="178" r="12" fill="#FFD700"/>
    <circle cx="191" cy="178" r="12" fill="#1a2a5e"/>
  </g>

  <!-- Crescent Moon 2: Right brim -->
  <g id="moon-right">
    <circle cx="315" cy="175" r="12" fill="#FFD700"/>
    <circle cx="309" cy="175" r="12" fill="#1a2a5e"/>
  </g>

</svg>