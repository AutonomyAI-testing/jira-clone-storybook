<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 800 780">
  <defs>
    <!-- Texture pattern for parchment background -->
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="5" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    
    <!-- Subtle noise texture overlay -->
    <filter id="subtleNoise">
      <feTurbulence type="fractalNoise" baseFrequency="2" numOctaves="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0.1"/>
    </filter>
    
    <!-- Radial gradient for TV screen glow -->
    <radialGradient id="screenGlow" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#A8E63C;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#7BB929;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#5A9A1F;stop-opacity:0.7"/>
    </radialGradient>
    
    <!-- Gradient for body shading (darker edges) -->
    <linearGradient id="bodyShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D5533;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#8B6340;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#6D5533;stop-opacity:0.6"/>
    </linearGradient>
    
    <!-- Shadow for drop effects -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Hand/glove drop shadow -->
    <filter id="handShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Beige parchment background with texture -->
  <rect width="800" height="1000" fill="#F0E8D5" filter="url(#paperTexture)"/>
  
  <!-- Subtle texture speckles for aged parchment feel -->
  <circle cx="120" cy="150" r="2" fill="#D4C4A0" opacity="0.5"/>
  <circle cx="280" cy="320" r="1.5" fill="#C9B89F" opacity="0.4"/>
  <circle cx="550" cy="200" r="2" fill="#D4C4A0" opacity="0.5"/>
  <circle cx="680" cy="450" r="1.5" fill="#C9B89F" opacity="0.4"/>
  <circle cx="150" cy="650" r="2" fill="#D4C4A0" opacity="0.5"/>
  <circle cx="620" cy="750" r="1.5" fill="#C9B89F" opacity="0.4"/>
  <circle cx="350" cy="800" r="2" fill="#D4C4A0" opacity="0.5"/>
  <circle cx="700" cy="150" r="1.5" fill="#C9B89F" opacity="0.4"/>
  <circle cx="100" cy="500" r="1" fill="#D4C4A0" opacity="0.3"/>
  <circle cx="750" cy="650" r="1.5" fill="#C9B89F" opacity="0.3"/>
  
  <!-- Vitruvian Man geometric frame - Large circle with burgundy/mauve color (now fully visible) -->
  <circle cx="400" cy="480" r="300" fill="none" stroke="#8B4A5A" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Vitruvian Man geometric frame - Square -->
  <rect x="160" y="240" width="480" height="480" fill="none" stroke="#8B4A5A" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Guide lines for Vitruvian effect - horizontal and vertical -->
  <line x1="160" y1="480" x2="640" y2="480" stroke="#8B4A5A" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="240" x2="400" y2="720" stroke="#8B4A5A" stroke-width="1.5" opacity="0.4"/>
  
  <!-- WIZARD HAT - Tall, sharp, pointed -->
  <!-- Hat cone - tall and sharply pointed -->
  <path d="M 270 260 L 400 100 L 530 260 Q 400 230 270 260 Z" fill="#1B3A6B" stroke="#0F1F3F" stroke-width="2.5"/>
  
  <!-- Hat brim - wide and dramatic with curve -->
  <ellipse cx="400" cy="280" rx="240" ry="55" fill="#1B3A6B" stroke="#0F1F3F" stroke-width="2.5"/>
  <ellipse cx="400" cy="278" rx="240" ry="50" fill="#2C5A96" opacity="0.5"/>
  
  <!-- Hat tip pointed top -->
  <ellipse cx="400" cy="95" rx="28" ry="35" fill="#1B3A6B" stroke="#0F1F3F" stroke-width="2"/>
  
  <!-- Hat cone shading for depth -->
  <path d="M 270 260 L 400 100 L 335 260" fill="#0F1F3F" opacity="0.3"/>
  
  <!-- Brim shading underside -->
  <path d="M 280 280 Q 400 340 520 280 Q 400 290 280 280 Z" fill="#0F1F3F" opacity="0.25"/>
  
  <!-- Hat decoration - Stars (SVG polygons - LARGER with doubled radius) -->
  <!-- Large star at cone tip area -->
  <g transform="translate(370,140)">
    <path d="M 0,-18 L 5.5,-5.7 L 18,-1.8 L 10.8,5.7 L 13.5,18 L 0,12.6 L -13.5,18 L -10.8,5.7 L -18,-1.8 L -5.5,-5.7 Z" fill="#F5C518"/>
  </g>
  
  <!-- Star middle upper right -->
  <g transform="translate(430,130)">
    <path d="M 0,-15 L 4.5,-4.8 L 15,-1.5 L 9,4.8 L 11.25,15 L 0,10.5 L -11.25,15 L -9,4.8 L -15,-1.5 L -4.5,-4.8 Z" fill="#F5C518"/>
  </g>
  
  <!-- Star left side -->
  <g transform="translate(340,200)">
    <path d="M 0,-16 L 4.8,-5.2 L 16,-1.6 L 9.6,5.2 L 12,16 L 0,11.2 L -12,16 L -9.6,5.2 L -16,-1.6 L -4.8,-5.2 Z" fill="#F5C518"/>
  </g>
  
  <!-- Star right side -->
  <g transform="translate(460,200)">
    <path d="M 0,-16 L 4.8,-5.2 L 16,-1.6 L 9.6,5.2 L 12,16 L 0,11.2 L -12,16 L -9.6,5.2 L -16,-1.6 L -4.8,-5.2 Z" fill="#F5C518"/>
  </g>
  
  <!-- Star at base of cone -->
  <g transform="translate(400,240)">
    <path d="M 0,-14 L 4.2,-4.5 L 14,-1.4 L 8.4,4.5 L 10.5,14 L 0,9.8 L -10.5,14 L -8.4,4.5 L -14,-1.4 L -4.2,-4.5 Z" fill="#F5C518"/>
  </g>
  
  <!-- Hat decoration - Crescents on brim (larger overlapping circles) -->
  <!-- Left side crescent -->
  <g>
    <circle cx="250" cy="285" r="14" fill="#F5C518"/>
    <circle cx="257" cy="282" r="11" fill="#1B3A6B"/>
  </g>
  
  <!-- Left-center crescent -->
  <g>
    <circle cx="320" cy="265" r="14" fill="#F5C518"/>
    <circle cx="327" cy="262" r="11" fill="#1B3A6B"/>
  </g>
  
  <!-- Center-left crescent -->
  <g>
    <circle cx="360" cy="250" r="14" fill="#F5C518"/>
    <circle cx="367" cy="247" r="11" fill="#1B3A6B"/>
  </g>
  
  <!-- Center-right crescent -->
  <g>
    <circle cx="440" cy="250" r="14" fill="#F5C518"/>
    <circle cx="433" cy="247" r="11" fill="#1B3A6B"/>
  </g>
  
  <!-- Right-center crescent -->
  <g>
    <circle cx="480" cy="265" r="14" fill="#F5C518"/>
    <circle cx="473" cy="262" r="11" fill="#1B3A6B"/>
  </g>
  
  <!-- Right side crescent -->
  <g>
    <circle cx="550" cy="285" r="14" fill="#F5C518"/>
    <circle cx="543" cy="282" r="11" fill="#1B3A6B"/>
  </g>
  
  <!-- Additional brim stars (LARGER) -->
  <g transform="translate(280,300)">
    <path d="M 0,-12 L 3.6,-3.6 L 12,-1.2 L 7.2,3.6 L 9,12 L 0,8.4 L -9,12 L -7.2,3.6 L -12,-1.2 L -3.6,-3.6 Z" fill="#F5C518"/>
  </g>
  
  <g transform="translate(520,300)">
    <path d="M 0,-12 L 3.6,-3.6 L 12,-1.2 L 7.2,3.6 L 9,12 L 0,8.4 L -9,12 L -7.2,3.6 L -12,-1.2 L -3.6,-3.6 Z" fill="#F5C518"/>
  </g>
  
  <!-- ROBOT BODY - Main rectangular body with shading -->
  <rect x="280" y="360" width="240" height="150" rx="12" fill="#8B6340" stroke="#5C4A33" stroke-width="2"/>
  
  <!-- Side shading for 3D depth effect -->
  <rect x="280" y="360" width="240" height="150" rx="12" fill="url(#bodyShade)"/>
  
  <!-- Body left edge shading -->
  <rect x="303" y="365" width="15" height="150" fill="#5C3F22" opacity="0.5" rx="5"/>
  
  <!-- Body right edge shading -->
  <rect x="482" y="365" width="15" height="150" fill="#5C3F22" opacity="0.5" rx="5"/>
  
  <!-- Robot body wood grain/panel details -->
  <rect x="290" y="375" width="220" height="45" fill="#6D5533" opacity="0.5" rx="8"/>
  <rect x="290" y="445" width="220" height="35" fill="#745D41" opacity="0.4" rx="8"/>
  
  <!-- ROBOT HEAD - CRT TV Monitor -->
  <!-- TV frame outer -->
  <rect x="300" y="280" width="200" height="165" rx="18" fill="#8B6340" stroke="#5C4A33" stroke-width="2.5"/>
  
  <!-- TV bezel/inner frame -->
  <rect x="318" y="298" width="164" height="130" rx="10" fill="#7A6042" stroke="#4A3A28" stroke-width="1.5"/>
  
  <!-- TV Screen with vibrant gradient and glow -->
  <rect x="328" y="308" width="144" height="110" rx="6" fill="url(#screenGlow)" stroke="#5C4A33" stroke-width="1.5"/>
  
  <!-- Screen white highlight/glare - irregular polygon for realistic glare effect -->
  <path d="M 355 305 L 375 295 L 390 310 L 380 325 L 358 318 Z" fill="white" opacity="0.45"/>
  
  <!-- Secondary screen reflection - subtle curved highlight -->
  <path d="M 365 330 Q 385 340 395 335" stroke="white" stroke-width="2.5" fill="none" opacity="0.35"/>
  
  <!-- TV antenna/connector details -->
  <circle cx="360" cy="270" r="6" fill="#C8A87A" stroke="#8B6340" stroke-width="1.5"/>
  <circle cx="440" cy="265" r="5" fill="#C8A87A" stroke="#8B6340" stroke-width="1"/>
  
  <!-- CHEST PANEL -->
  <!-- Recessed chest panel with shadow -->
  <rect x="310" y="470" width="180" height="130" rx="8" fill="#7A6042" stroke="#5C4A33" stroke-width="2"/>
  
  <!-- Chest panel details/rivets -->
  <rect x="325" y="485" width="150" height="25" fill="#5C4A33" rx="4" opacity="0.7"/>
  <circle cx="335" cy="548" r="3" fill="#5C4A33" opacity="0.8"/>
  <circle cx="365" cy="548" r="3" fill="#5C4A33" opacity="0.8"/>
  <circle cx="395" cy="548" r="3" fill="#5C4A33" opacity="0.8"/>
  <circle cx="425" cy="548" r="3" fill="#5C4A33" opacity="0.8"/>
  <circle cx="455" cy="548" r="3" fill="#5C4A33" opacity="0.8"/>
  
  <!-- Large circular button - tan/beige -->
  <circle cx="400" cy="570" r="32" fill="#C8A87A" stroke="#9B8860" stroke-width="2" filter="url(#dropShadow)"/>
  
  <!-- Button center highlight -->
  <circle cx="395" cy="563" r="10" fill="#DFB896" opacity="0.6"/>
  
  <!-- Button pressed center -->
  <circle cx="400" cy="570" r="16" fill="#B59860" opacity="0.3"/>
  
  <!-- LEFT ARMS (extended far outward - Vitruvian pose) -->
  <!-- Upper left arm -->
  <g id="leftArmUpper">
    <!-- Shoulder connector -->
    <circle cx="280" cy="395" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Upper arm - thick cylinder -->
    <rect x="140" y="381" width="140" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Arm highlight -->
    <line x1="145" y1="381" x2="275" y2="381" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Elbow joint -->
    <circle cx="140" cy="395" r="11" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Forearm -->
    <rect x="35" y="376" width="110" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Forearm highlight -->
    <line x1="40" y1="376" x2="140" y2="376" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Wrist connector -->
    <circle cx="35" cy="390" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Glove - cartoon style -->
    <g id="leftHandUpper" filter="url(#handShadow)">
      <!-- Palm ellipse -->
      <ellipse cx="10" cy="402" rx="28" ry="22" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
      <!-- Finger 1 (top-left) -->
      <ellipse cx="-5" cy="375" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 2 (top-center-left) -->
      <ellipse cx="5" cy="370" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 3 (top-center-right) -->
      <ellipse cx="15" cy="372" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 4 (top-right) -->
      <ellipse cx="25" cy="376" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Thumb (pointing left) -->
      <ellipse cx="-18" cy="402" rx="10" ry="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Lower left arm -->
  <g id="leftArmLower">
    <!-- Shoulder connector -->
    <circle cx="280" cy="545" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Upper arm - thick cylinder -->
    <rect x="140" y="531" width="140" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Arm highlight -->
    <line x1="145" y1="531" x2="275" y2="531" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Elbow joint -->
    <circle cx="140" cy="545" r="11" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Forearm -->
    <rect x="35" y="526" width="110" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Forearm highlight -->
    <line x1="40" y1="526" x2="140" y2="526" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Wrist connector -->
    <circle cx="35" cy="540" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Glove - cartoon style -->
    <g id="leftHandLower" filter="url(#handShadow)">
      <!-- Palm ellipse -->
      <ellipse cx="10" cy="552" rx="28" ry="22" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
      <!-- Finger 1 (top-left) -->
      <ellipse cx="-5" cy="525" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 2 (top-center-left) -->
      <ellipse cx="5" cy="520" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 3 (top-center-right) -->
      <ellipse cx="15" cy="522" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 4 (top-right) -->
      <ellipse cx="25" cy="526" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Thumb (pointing left) -->
      <ellipse cx="-18" cy="552" rx="10" ry="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- RIGHT ARMS (extended far outward - Vitruvian pose) -->
  <!-- Upper right arm -->
  <g id="rightArmUpper">
    <!-- Shoulder connector -->
    <circle cx="520" cy="395" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Upper arm - thick cylinder -->
    <rect x="520" y="381" width="140" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Arm highlight -->
    <line x1="525" y1="381" x2="655" y2="381" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Elbow joint -->
    <circle cx="660" cy="395" r="11" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Forearm -->
    <rect x="655" y="376" width="110" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Forearm highlight -->
    <line x1="660" y1="376" x2="760" y2="376" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Wrist connector -->
    <circle cx="765" cy="390" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Glove - cartoon style -->
    <g id="rightHandUpper" filter="url(#handShadow)">
      <!-- Palm ellipse -->
      <ellipse cx="790" cy="402" rx="28" ry="22" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
      <!-- Finger 1 (top-right) -->
      <ellipse cx="805" cy="375" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 2 (top-center-right) -->
      <ellipse cx="795" cy="370" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 3 (top-center-left) -->
      <ellipse cx="785" cy="372" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 4 (top-left) -->
      <ellipse cx="775" cy="376" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Thumb (pointing right) -->
      <ellipse cx="818" cy="402" rx="10" ry="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Lower right arm -->
  <g id="rightArmLower">
    <!-- Shoulder connector -->
    <circle cx="520" cy="545" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Upper arm - thick cylinder -->
    <rect x="520" y="531" width="140" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Arm highlight -->
    <line x1="525" y1="531" x2="655" y2="531" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Elbow joint -->
    <circle cx="660" cy="545" r="11" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Forearm -->
    <rect x="655" y="526" width="110" height="28" rx="14" fill="#3A3A3A" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Forearm highlight -->
    <line x1="660" y1="526" x2="760" y2="526" stroke="#666666" stroke-width="2" opacity="0.6"/>
    <!-- Wrist connector -->
    <circle cx="765" cy="540" r="10" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    <!-- Glove - cartoon style -->
    <g id="rightHandLower" filter="url(#handShadow)">
      <!-- Palm ellipse -->
      <ellipse cx="790" cy="552" rx="28" ry="22" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
      <!-- Finger 1 (top-right) -->
      <ellipse cx="805" cy="525" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 2 (top-center-right) -->
      <ellipse cx="795" cy="520" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 3 (top-center-left) -->
      <ellipse cx="785" cy="522" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Finger 4 (top-left) -->
      <ellipse cx="775" cy="526" rx="7" ry="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      <!-- Thumb (pointing right) -->
      <ellipse cx="818" cy="552" rx="10" ry="14" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- ROBOT LEGS with enhanced styling -->
  <!-- Left leg -->
  <g id="leftLeg">
    <!-- Upper leg with shading -->
    <rect x="310" y="620" width="38" height="75" fill="#7A6042" stroke="#5C4A33" stroke-width="1.5" rx="6"/>
    <rect x="310" y="620" width="38" height="75" fill="#5C4A33" opacity="0.25" rx="6"/>
    
    <!-- Lower leg/boot -->
    <rect x="305" y="695" width="48" height="65" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5" rx="8"/>
    
    <!-- Boot toe shading -->
    <rect x="307" y="715" width="44" height="20" fill="#3C2A1F" opacity="0.8" rx="6"/>
    
    <!-- Boot heel -->
    <rect x="310" y="755" width="38" height="8" fill="#4A3A28" rx="2"/>
    
    <!-- Foot - wider and more prominent -->
    <ellipse cx="330" cy="775" rx="40" ry="20" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    
    <!-- Foot toe definition -->
    <ellipse cx="330" cy="777" rx="40" ry="12" fill="#4A3A28" opacity="0.4"/>
    
    <!-- Toe cap detail -->
    <ellipse cx="330" cy="760" rx="15" ry="10" fill="#3C2A1F" opacity="0.7"/>
  </g>
  
  <!-- Right leg -->
  <g id="rightLeg">
    <!-- Upper leg with shading -->
    <rect x="452" y="620" width="38" height="75" fill="#7A6042" stroke="#5C4A33" stroke-width="1.5" rx="6"/>
    <rect x="452" y="620" width="38" height="75" fill="#5C4A33" opacity="0.25" rx="6"/>
    
    <!-- Lower leg/boot -->
    <rect x="447" y="695" width="48" height="65" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5" rx="8"/>
    
    <!-- Boot toe shading -->
    <rect x="449" y="715" width="44" height="20" fill="#3C2A1F" opacity="0.8" rx="6"/>
    
    <!-- Boot heel -->
    <rect x="452" y="755" width="38" height="8" fill="#4A3A28" rx="2"/>
    
    <!-- Foot - wider and more prominent -->
    <ellipse cx="472" cy="775" rx="40" ry="20" fill="#5C4A33" stroke="#3C2A1F" stroke-width="1.5"/>
    
    <!-- Foot toe definition -->
    <ellipse cx="472" cy="777" rx="40" ry="12" fill="#4A3A28" opacity="0.4"/>
    
    <!-- Toe cap detail -->
    <ellipse cx="472" cy="760" rx="15" ry="10" fill="#3C2A1F" opacity="0.7"/>
  </g>
</svg>