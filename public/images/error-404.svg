<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" fill="none">
  <defs>
    <radialGradient id="screenGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A8E063"/>
      <stop offset="40%" stop-color="#56AB2F"/>
      <stop offset="100%" stop-color="#2D6A0A"/>
    </radialGradient>
    <radialGradient id="buttonGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6500"/>
    </radialGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C49A6C"/>
      <stop offset="50%" stop-color="#A07040"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>
    <linearGradient id="hatShade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2A4A8A"/>
      <stop offset="50%" stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#0F2444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Vitruvian guide: circle -->
  <circle cx="250" cy="290" r="220" stroke="#9B6B5B" stroke-width="1.5" fill="none" opacity="0.45"/>
  <!-- Vitruvian guide: square -->
  <rect x="60" y="155" width="380" height="350" stroke="#9B6B5B" stroke-width="1.5" fill="none" opacity="0.45"/>

  <!-- ====== WIZARD HAT ====== -->
  <!-- Hat brim shadow -->
  <ellipse cx="250" cy="228" rx="155" ry="34" fill="#0A1E44" opacity="0.35"/>
  <!-- Hat brim -->
  <ellipse cx="250" cy="222" rx="150" ry="30" fill="url(#hatShade)" stroke="#0A1430" stroke-width="2.5"/>
  <!-- Hat brim highlight -->
  <ellipse cx="235" cy="216" rx="60" ry="10" fill="#3A5A9A" opacity="0.4"/>
  
  <!-- Hat cone -->
  <polygon points="250,18 380,222 120,222" fill="url(#hatShade)" stroke="#0A1430" stroke-width="2.5"/>
  <!-- Hat cone left face (lighter) -->
  <polygon points="250,18 120,222 250,222" fill="#2A4A8A" opacity="0.5"/>
  <!-- Hat cone crease highlight -->
  <line x1="250" y1="18" x2="268" y2="222" stroke="#4A6AAA" stroke-width="3" opacity="0.6"/>
  
  <!-- Stars and moons on hat cone -->
  <!-- Stars -->
  <text x="230" y="82" font-size="22" fill="#FFD700" font-family="serif" opacity="0.95">★</text>
  <text x="272" y="130" font-size="18" fill="#FFD700" font-family="serif" opacity="0.9">★</text>
  <text x="195" y="148" font-size="16" fill="#FFD700" font-family="serif" opacity="0.9">★</text>
  <text x="258" y="175" font-size="13" fill="#FFD700" font-family="serif" opacity="0.8">★</text>
  <!-- Moons on cone -->
  <text x="248" y="108" font-size="20" fill="#FFD700" font-family="serif" opacity="0.85">☽</text>
  <text x="210" y="168" font-size="15" fill="#FFD700" font-family="serif" opacity="0.8">☽</text>
  
  <!-- Stars and moons on brim -->
  <text x="118" y="230" font-size="20" fill="#FFD700" font-family="serif" opacity="0.9">★</text>
  <text x="155" y="222" font-size="15" fill="#FFD700" font-family="serif" opacity="0.85">☽</text>
  <text x="340" y="228" font-size="18" fill="#FFD700" font-family="serif" opacity="0.9">★</text>
  <text x="365" y="220" font-size="14" fill="#FFD700" font-family="serif" opacity="0.85">☽</text>
  <text x="205" y="235" font-size="12" fill="#FFD700" font-family="serif" opacity="0.75">★</text>
  <text x="285" y="233" font-size="12" fill="#FFD700" font-family="serif" opacity="0.75">☽</text>
  
  <!-- Hat tip accent -->
  <ellipse cx="252" cy="22" rx="10" ry="5" fill="#4A6AAA" opacity="0.7"/>

  <!-- ====== ARMS - 4 total ====== -->
  <!-- LEFT UPPER ARM -->
  <line x1="188" y1="305" x2="105" y2="285" stroke="#4A3020" stroke-width="16" stroke-linecap="round"/>
  <!-- LEFT LOWER ARM -->
  <line x1="105" y1="285" x2="50" y2="320" stroke="#3A2010" stroke-width="14" stroke-linecap="round"/>
  <!-- Left glove cuff ring -->
  <ellipse cx="50" cy="320" rx="16" ry="10" fill="#E8E0D0" stroke="#C0B8A0" stroke-width="2"/>
  <!-- Left glove palm -->
  <ellipse cx="42" cy="328" rx="20" ry="14" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5"/>
  <!-- Left fingers -->
  <ellipse cx="24" cy="318" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-40 24 318)"/>
  <ellipse cx="18" cy="330" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-15 18 330)"/>
  <ellipse cx="20" cy="343" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(10 20 343)"/>
  <ellipse cx="32" cy="350" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(28 32 350)"/>
  <!-- Thumb left -->
  <ellipse cx="50" cy="310" rx="7" ry="4" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-60 50 310)"/>

  <!-- LEFT UPPER ARM 2 (slightly below) -->
  <line x1="185" y1="325" x2="108" y2="310" stroke="#4A3020" stroke-width="13" stroke-linecap="round"/>
  <line x1="108" y1="310" x2="55" y2="350" stroke="#3A2010" stroke-width="11" stroke-linecap="round"/>
  <!-- Second left glove -->
  <ellipse cx="55" cy="350" rx="14" ry="9" fill="#E8E0D0" stroke="#C0B8A0" stroke-width="2"/>
  <ellipse cx="46" cy="358" rx="17" ry="12" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5"/>
  <ellipse cx="30" cy="348" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-35 30 348)"/>
  <ellipse cx="25" cy="360" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-10 25 360)"/>
  <ellipse cx="28" cy="372" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(15 28 372)"/>
  <ellipse cx="40" cy="377" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(30 40 377)"/>
  <ellipse cx="54" cy="340" rx="6" ry="3.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-55 54 340)"/>

  <!-- RIGHT UPPER ARM -->
  <line x1="312" y1="305" x2="395" y2="285" stroke="#4A3020" stroke-width="16" stroke-linecap="round"/>
  <!-- RIGHT LOWER ARM -->
  <line x1="395" y1="285" x2="450" y2="320" stroke="#3A2010" stroke-width="14" stroke-linecap="round"/>
  <!-- Right glove cuff ring -->
  <ellipse cx="450" cy="320" rx="16" ry="10" fill="#E8E0D0" stroke="#C0B8A0" stroke-width="2"/>
  <!-- Right glove palm -->
  <ellipse cx="458" cy="328" rx="20" ry="14" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5"/>
  <!-- Right fingers -->
  <ellipse cx="476" cy="318" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(40 476 318)"/>
  <ellipse cx="482" cy="330" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(15 482 330)"/>
  <ellipse cx="480" cy="343" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-10 480 343)"/>
  <ellipse cx="468" cy="350" rx="10" ry="5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-28 468 350)"/>
  <!-- Thumb right -->
  <ellipse cx="450" cy="310" rx="7" ry="4" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(60 450 310)"/>

  <!-- RIGHT UPPER ARM 2 -->
  <line x1="315" y1="325" x2="392" y2="310" stroke="#4A3020" stroke-width="13" stroke-linecap="round"/>
  <line x1="392" y1="310" x2="445" y2="350" stroke="#3A2010" stroke-width="11" stroke-linecap="round"/>
  <!-- Second right glove -->
  <ellipse cx="445" cy="350" rx="14" ry="9" fill="#E8E0D0" stroke="#C0B8A0" stroke-width="2"/>
  <ellipse cx="454" cy="358" rx="17" ry="12" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5"/>
  <ellipse cx="470" cy="348" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(35 470 348)"/>
  <ellipse cx="475" cy="360" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(10 475 360)"/>
  <ellipse cx="472" cy="372" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-15 472 372)"/>
  <ellipse cx="460" cy="377" rx="9" ry="4.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(-30 460 377)"/>
  <ellipse cx="446" cy="340" rx="6" ry="3.5" fill="#F0EAE0" stroke="#C8C0B0" stroke-width="1.5" transform="rotate(55 446 340)"/>

  <!-- ====== ROBOT HEAD/SCREEN BOX ====== -->
  <!-- Head outer casing -->
  <rect x="172" y="228" width="156" height="120" rx="10" fill="url(#bodyShade)" stroke="#5C3010" stroke-width="3" filter="url(#softShadow)"/>
  <!-- Head inner bezel -->
  <rect x="180" y="236" width="140" height="104" rx="7" fill="#7A4E28" stroke="#5C3010" stroke-width="2"/>
  <!-- Screen -->
  <rect x="188" y="244" width="124" height="88" rx="5" fill="url(#screenGlow)" stroke="#2D6A0A" stroke-width="1.5"/>
  <!-- Screen glare (cloud shapes) -->
  <ellipse cx="214" cy="265" rx="22" ry="13" fill="white" opacity="0.38" transform="rotate(-20 214 265)"/>
  <ellipse cx="230" cy="275" rx="14" ry="8" fill="white" opacity="0.22" transform="rotate(-10 230 275)"/>
  <ellipse cx="245" cy="310" rx="12" ry="7" fill="white" opacity="0.15"/>
  <!-- Screen border shine -->
  <rect x="188" y="244" width="124" height="88" rx="5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Corner bolts on head -->
  <circle cx="183" cy="240" r="5" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <circle cx="317" cy="240" r="5" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <circle cx="183" cy="344" r="5" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <circle cx="317" cy="344" r="5" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>

  <!-- ====== ROBOT BODY ====== -->
  <rect x="188" y="348" width="124" height="95" rx="8" fill="url(#bodyShade)" stroke="#5C3010" stroke-width="3" filter="url(#softShadow)"/>
  <!-- Body panel inset -->
  <rect x="198" y="360" width="104" height="72" rx="5" fill="#8C5E2E" stroke="#5C3010" stroke-width="1.5"/>
  <!-- Body shading overlay -->
  <rect x="198" y="360" width="50" height="72" rx="5" fill="rgba(0,0,0,0.08)"/>
  <!-- Chest power button -->
  <circle cx="250" cy="398" r="18" fill="#6A3E18" stroke="#4A2A08" stroke-width="2.5"/>
  <circle cx="250" cy="398" r="13" fill="url(#buttonGlow)" stroke="#8B6500" stroke-width="2"/>
  <circle cx="245" cy="393" r="4" fill="rgba(255,255,255,0.5)"/>
  <!-- Body bolts -->
  <circle cx="200" cy="362" r="4" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <circle cx="300" cy="362" r="4" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <circle cx="200" cy="430" r="4" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <circle cx="300" cy="430" r="4" fill="#6A3E18" stroke="#4A2A08" stroke-width="1.5"/>
  <!-- Side screws on body -->
  <circle cx="190" cy="396" r="5" fill="#7A4E28" stroke="#5C3010" stroke-width="1.5"/>
  <circle cx="310" cy="396" r="5" fill="#7A4E28" stroke="#5C3010" stroke-width="1.5"/>

  <!-- ====== LEGS ====== -->
  <!-- Left leg upper -->
  <rect x="200" y="443" width="34" height="35" rx="5" fill="#9A6A3A" stroke="#5C3010" stroke-width="2.5"/>
  <!-- Left leg lower -->
  <rect x="196" y="476" width="32" height="28" rx="4" fill="#7A5028" stroke="#5C3010" stroke-width="2"/>
  <!-- Left boot -->
  <rect x="184" y="500" width="52" height="26" rx="7" fill="#3A2008" stroke="#1E0E02" stroke-width="2.5"/>
  <!-- Boot toe highlight -->
  <ellipse cx="198" cy="504" rx="12" ry="5" fill="rgba(255,255,255,0.1)"/>
  <!-- Boot sole -->
  <rect x="182" y="520" width="56" height="6" rx="3" fill="#1E0E02"/>
  
  <!-- Right leg upper -->
  <rect x="266" y="443" width="34" height="35" rx="5" fill="#9A6A3A" stroke="#5C3010" stroke-width="2.5"/>
  <!-- Right leg lower -->
  <rect x="272" y="476" width="32" height="28" rx="4" fill="#7A5028" stroke="#5C3010" stroke-width="2"/>
  <!-- Right boot -->
  <rect x="264" y="500" width="52" height="26" rx="7" fill="#3A2008" stroke="#1E0E02" stroke-width="2.5"/>
  <!-- Boot toe highlight -->
  <ellipse cx="302" cy="504" rx="12" ry="5" fill="rgba(255,255,255,0.1)"/>
  <!-- Boot sole -->
  <rect x="262" y="520" width="56" height="6" rx="3" fill="#1E0E02"/>
</svg>