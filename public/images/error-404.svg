<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450">
  <defs>
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2B4F9E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0785A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7FFF7F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5AE65A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3CC73C;stop-opacity:1" />
    </linearGradient>
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hatGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="#F5EED6"/>

  <!-- Vitruvian Circle and Square (geometric frame) -->
  <g opacity="0.3" stroke="#9E8B6E" stroke-width="2" fill="none">
    <!-- Circle -->
    <circle cx="200" cy="210" r="160"/>
    <!-- Square -->
    <rect x="60" y="70" width="280" height="280"/>
  </g>

  <!-- Left Arm (angled outward) -->
  <g>
    <!-- Upper arm segment -->
    <rect x="70" y="155" width="40" height="15" rx="7" fill="#5C3D2E" transform="rotate(-35 90 162)"/>
    <!-- Lower arm segment -->
    <rect x="45" y="140" width="45" height="12" rx="6" fill="#4A2E1E" transform="rotate(-45 67 146)"/>
    <!-- Hand with glove and fingers -->
    <circle cx="35" cy="110" r="22" fill="#FFFFFF"/>
    <circle cx="20" cy="108" r="6" fill="#F0F0F0"/>
    <circle cx="28" cy="97" r="6" fill="#F0F0F0"/>
    <circle cx="42" cy="100" r="6" fill="#F0F0F0"/>
    <circle cx="48" cy="115" r="6" fill="#F0F0F0"/>
  </g>

  <!-- Right Arm (angled outward) -->
  <g>
    <!-- Upper arm segment -->
    <rect x="290" y="155" width="40" height="15" rx="7" fill="#5C3D2E" transform="rotate(35 310 162)"/>
    <!-- Lower arm segment -->
    <rect x="310" y="140" width="45" height="12" rx="6" fill="#4A2E1E" transform="rotate(45 333 146)"/>
    <!-- Hand with glove and fingers -->
    <circle cx="365" cy="110" r="22" fill="#FFFFFF"/>
    <circle cx="380" cy="108" r="6" fill="#F0F0F0"/>
    <circle cx="372" cy="97" r="6" fill="#F0F0F0"/>
    <circle cx="358" cy="100" r="6" fill="#F0F0F0"/>
    <circle cx="352" cy="115" r="6" fill="#F0F0F0"/>
  </g>

  <!-- Robot Body (TV-head torso) -->
  <g>
    <!-- Main body rectangle -->
    <rect x="130" y="175" width="140" height="100" rx="12" fill="url(#bodyGradient)" stroke="#8B6F47" stroke-width="2"/>
    
    <!-- Center panel detail -->
    <rect x="155" y="220" width="90" height="45" rx="6" fill="#8B6F47" opacity="0.4" stroke="#5C3D2E" stroke-width="1.5"/>
    
    <!-- Central circle button -->
    <circle cx="200" cy="242" r="12" fill="#FFD700" stroke="#8B6F47" stroke-width="2"/>
    
    <!-- Antenna ports (left and right) -->
    <circle cx="145" cy="195" r="5" fill="#5C3D2E" opacity="0.6"/>
    <circle cx="255" cy="195" r="5" fill="#5C3D2E" opacity="0.6"/>
  </g>

  <!-- TV Screen Head -->
  <g>
    <!-- Screen frame (brown border) -->
    <rect x="105" y="110" width="190" height="145" rx="14" fill="#8B6F47" stroke="#6B5037" stroke-width="2"/>
    
    <!-- Inner screen area -->
    <rect x="125" y="130" width="150" height="105" rx="10" fill="url(#screenGradient)" filter="url(#screenGlow)"/>
    
    <!-- Screen glass shine effect -->
    <ellipse cx="160" cy="155" rx="35" ry="25" fill="#FFFFFF" opacity="0.25"/>
    
    <!-- Left eye (circular dot) -->
    <circle cx="155" cy="160" r="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="155" cy="160" r="9" fill="#1A3060" opacity="0.8"/>
    
    <!-- Right eye (circular dot) -->
    <circle cx="245" cy="160" r="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="245" cy="160" r="9" fill="#1A3060" opacity="0.8"/>
    
    <!-- Wavy mouth (surprised/confused expression) -->
    <path d="M 170 200 Q 200 210 230 200" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Side vents (dark lines for detail) -->
    <line x1="120" y1="145" x2="120" y2="195" stroke="#5C3D2E" stroke-width="1.5" opacity="0.5"/>
    <line x1="280" y1="145" x2="280" y2="195" stroke="#5C3D2E" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Wizard Hat -->
  <g>
    <!-- Hat brim (wide ellipse) -->
    <ellipse cx="200" cy="105" rx="85" ry="18" fill="url(#hatGradient)" stroke="#1E3A6E" stroke-width="2" filter="url(#hatGlow)"/>
    
    <!-- Hat cone shape -->
    <path d="M 145 105 L 200 20 L 255 105 Z" fill="url(#hatGradient)" stroke="#1E3A6E" stroke-width="2.5" filter="url(#hatGlow)"/>
    
    <!-- Hat tip curl -->
    <path d="M 200 20 Q 210 15 225 25" stroke="#1E3A6E" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Star decorations on hat -->
    <!-- Top right star -->
    <g transform="translate(235, 50)">
      <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#FFD700" stroke="#FFC107" stroke-width="0.5" filter="url(#hatGlow)"/>
    </g>
    
    <!-- Bottom right star -->
    <g transform="translate(250, 85)">
      <polygon points="0,-7 2.1,-2.1 7,-0.7 2.8,2.8 4.2,8 0,4.9 -4.2,8 -2.8,2.8 -7,-0.7 -2.1,-2.1" fill="#FFD700" stroke="#FFC107" stroke-width="0.5" filter="url(#hatGlow)"/>
    </g>
    
    <!-- Bottom left star -->
    <g transform="translate(150, 85)">
      <polygon points="0,-7 2.1,-2.1 7,-0.7 2.8,2.8 4.2,8 0,4.9 -4.2,8 -2.8,2.8 -7,-0.7 -2.1,-2.1" fill="#FFD700" stroke="#FFC107" stroke-width="0.5" filter="url(#hatGlow)"/>
    </g>
    
    <!-- Golden star decoration (inside hat cone - upper left area) -->
    <g transform="translate(175, 55)">
      <polygon points="0,-6 1.8,-1.8 6,-0.6 2.4,2 3.6,6.2 0,3.6 -3.6,6.2 -2.4,2 -6,-0.6 -1.8,-1.8" fill="#FFD700" stroke="#FFC107" stroke-width="0.4" filter="url(#hatGlow)" opacity="0.9"/>
    </g>
    
    <!-- Golden crescent moon (inside hat cone - center) -->
    <g transform="translate(200, 45)">
      <path d="M -6 -8 A 8 8 0 1 1 -6 8 A 5 5 0 1 0 -6 -8 Z" fill="#FFD700" stroke="#FFC107" stroke-width="0.5" filter="url(#hatGlow)" opacity="0.85"/>
    </g>
    
    <!-- Golden star decoration (inside hat cone - upper right area) -->
    <g transform="translate(225, 60)">
      <polygon points="0,-5.5 1.65,-1.65 5.5,-0.55 2.2,1.8 3.3,5.7 0,3.3 -3.3,5.7 -2.2,1.8 -5.5,-0.55 -1.65,-1.65" fill="#FFD700" stroke="#FFC107" stroke-width="0.4" filter="url(#hatGlow)" opacity="0.9"/>
    </g>
  </g>

  <!-- Left Leg -->
  <g>
    <!-- Hip segment -->
    <rect x="145" y="275" width="28" height="40" rx="6" fill="#5C3D2E"/>
    <!-- Lower leg segment -->
    <rect x="150" y="315" width="18" height="45" rx="4" fill="#4A2E1E"/>
    <!-- Foot -->
    <rect x="138" y="360" width="42" height="25" rx="4" fill="#3A2415" stroke="#2A1810" stroke-width="1.5"/>
  </g>

  <!-- Right Leg -->
  <g>
    <!-- Hip segment -->
    <rect x="227" y="275" width="28" height="40" rx="6" fill="#5C3D2E"/>
    <!-- Lower leg segment -->
    <rect x="232" y="315" width="18" height="45" rx="4" fill="#4A2E1E"/>
    <!-- Foot -->
    <rect x="220" y="360" width="42" height="25" rx="4" fill="#3A2415" stroke="#2A1810" stroke-width="1.5"/>
  </g>

  <!-- Connection neck area (between head and body) -->
  <g>
    <rect x="160" y="255" width="80" height="20" fill="#8B6F47" stroke="#6B5037" stroke-width="1.5" rx="8"/>
    <!-- Neck detail lines -->
    <line x1="175" y1="255" x2="175" y2="275" stroke="#6B5037" stroke-width="1" opacity="0.6"/>
    <line x1="200" y1="255" x2="200" y2="275" stroke="#6B5037" stroke-width="1" opacity="0.6"/>
    <line x1="225" y1="255" x2="225" y2="275" stroke="#6B5037" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
