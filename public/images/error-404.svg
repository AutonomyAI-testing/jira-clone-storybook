<svg viewBox="0 0 600 650" xmlns="http://www.w3.org/2000/svg">
  <title>Steampunk Wizard Robot</title>
  <defs>
    <!-- Screen gradient: green radial gradient for TV screen glow -->
    <radialGradient id="screenGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4bce97;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </radialGradient>

    <!-- Body gradient: brown copper -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0683B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5A2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4423;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Beige background -->
  <rect width="600" height="650" fill="#EDE5D5"/>

  <!-- ===== VITRUVIAN GEOMETRY (subtle, behind character) ===== -->
  <!-- Large circle outline -->
  <circle cx="300" cy="330" r="230" fill="none" stroke="#8B6B4A" stroke-width="2" opacity="0.25"/>
  
  <!-- Square outline -->
  <rect x="65" y="100" width="470" height="470" fill="none" stroke="#8B6B4A" stroke-width="2" opacity="0.25"/>

  <!-- ===== WIZARD HAT (cone + brim + decorations) ===== -->
  
  <!-- Hat cone: tall triangle from tip (300, 30) to brim edges (165, 165) and (435, 165) -->
  <path d="M 300 30 L 165 165 L 435 165 Z" fill="#1A2B6D" stroke="#0D1540" stroke-width="3"/>
  
  <!-- Hat brim: wide ellipse -->
  <ellipse cx="300" cy="168" rx="145" ry="30" fill="#1A2B6D" stroke="#0D1540" stroke-width="3"/>

  <!-- ===== HAT DECORATIONS: LARGE STARS (5-point polygon) ===== -->
  
  <!-- Star 1: Near hat tip -->
  <polygon points="300,48 305.6,61.3 320.9,61.3 308.9,69.7 313.4,83 300,74.5 286.6,83 291.1,69.7 279.1,61.3 294.4,61.3" 
           fill="#FFD700" stroke="#DEB700" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Star 2: Upper-left -->
  <polygon points="245,78 250.6,91.3 265.9,91.3 253.9,99.7 258.4,113 245,104.5 231.6,113 236.1,99.7 224.1,91.3 239.4,91.3" 
           fill="#FFD700" stroke="#DEB700" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Star 3: Upper-right -->
  <polygon points="355,78 360.6,91.3 375.9,91.3 363.9,99.7 368.4,113 355,104.5 341.6,113 346.1,99.7 334.1,91.3 349.4,91.3" 
           fill="#FFD700" stroke="#DEB700" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Star 4: Mid-left -->
  <polygon points="215,116 220.6,129.3 235.9,129.3 223.9,137.7 228.4,151 215,142.5 201.6,151 206.1,137.7 194.1,129.3 209.4,129.3" 
           fill="#FFD700" stroke="#DEB700" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Star 5: Mid-right -->
  <polygon points="385,116 390.6,129.3 405.9,129.3 393.9,137.7 398.4,151 385,142.5 371.6,151 376.1,137.7 364.1,129.3 379.4,129.3" 
           fill="#FFD700" stroke="#DEB700" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Star 6: Lower center -->
  <polygon points="300,130 305.6,143.3 320.9,143.3 308.9,151.7 313.4,165 300,156.5 286.6,165 291.1,151.7 279.1,143.3 294.4,143.3" 
           fill="#FFD700" stroke="#DEB700" stroke-width="2" stroke-linejoin="round"/>

  <!-- ===== HAT DECORATIONS: CRESCENT MOONS ===== -->
  
  <!-- Moon 1: Left upper area -->
  <circle cx="230" cy="80" r="16" fill="#FFD700"/>
  <circle cx="238" cy="80" r="16" fill="#EDE5D5"/>
  
  <!-- Moon 2: Right upper area -->
  <circle cx="370" cy="80" r="16" fill="#FFD700"/>
  <circle cx="362" cy="80" r="16" fill="#EDE5D5"/>
  
  <!-- Moon 3: Center of cone -->
  <circle cx="300" cy="95" r="14" fill="#FFD700"/>
  <circle cx="308" cy="95" r="14" fill="#EDE5D5"/>
  
  <!-- Moon 4: Lower left -->
  <circle cx="240" cy="130" r="12" fill="#FFD700"/>
  <circle cx="248" cy="130" r="12" fill="#EDE5D5"/>
  
  <!-- Moon 5: Lower right -->
  <circle cx="360" cy="130" r="12" fill="#FFD700"/>
  <circle cx="352" cy="130" r="12" fill="#EDE5D5"/>

  <!-- ===== TV HEAD ===== -->
  
  <!-- Outer bezel: brown rounded rectangle -->
  <rect x="215" y="165" width="170" height="120" rx="12" fill="#8B5A2B" stroke="#4D2F1A" stroke-width="3"/>
  
  <!-- Inner screen (with gradient) -->
  <rect x="228" y="178" width="144" height="95" rx="6" fill="url(#screenGradient)" stroke="#2d8b6d" stroke-width="2"/>
  
  <!-- Screen cloud highlights (white shapes on screen) -->
  <ellipse cx="250" cy="200" rx="35" ry="25" fill="rgba(255,255,255,0.35)"/>
  <ellipse cx="290" cy="235" rx="28" ry="20" fill="rgba(255,255,255,0.20)"/>
  
  <!-- Screen reflection (subtle top shine) -->
  <ellipse cx="300" cy="185" rx="45" ry="10" fill="rgba(255,255,255,0.15)"/>
  
  <!-- Side bolts on bezel corners -->
  <circle cx="216" cy="166" r="4" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>
  <circle cx="385" cy="166" r="4" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>
  <circle cx="216" cy="283" r="4" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>
  <circle cx="385" cy="283" r="4" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>

  <!-- ===== BODY ===== -->
  
  <!-- Main body: rounded rectangle -->
  <rect x="225" y="285" width="150" height="115" rx="10" fill="#8B5A2B" stroke="#4D2F1A" stroke-width="3"/>
  
  <!-- Chest panel -->
  <rect x="240" y="298" width="120" height="65" rx="6" fill="#A0683B" stroke="#6B4423" stroke-width="2"/>
  
  <!-- Inner panel (darker) -->
  <rect x="252" y="308" width="96" height="44" rx="4" fill="#6B4423" stroke="#4D2F1A" stroke-width="1.5"/>
  
  <!-- Power button (large yellow dial) -->
  <circle cx="300" cy="330" r="12" fill="#FFD700" stroke="#DEB700" stroke-width="2"/>
  <circle cx="300" cy="330" r="8" fill="#FFE500" stroke="none"/>
  <circle cx="300" cy="330" r="4" fill="#FFFF00" stroke="none"/>
  
  <!-- Side flanges/bolts on body -->
  <circle cx="222" cy="310" r="5" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>
  <circle cx="378" cy="310" r="5" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>
  <circle cx="222" cy="350" r="5" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>
  <circle cx="378" cy="350" r="5" fill="#6B4423" stroke="#4D2F1A" stroke-width="1"/>

  <!-- ===== ARMS: UPPER PAIR (horizontal stretch) ===== -->
  
  <!-- LEFT UPPER ARM (horizontal) -->
  <rect x="130" y="295" width="95" height="28" rx="14" fill="#8B5A2B" stroke="#4D2F1A" stroke-width="2"/>
  
  <!-- RIGHT UPPER ARM (horizontal) -->
  <rect x="375" y="295" width="95" height="28" rx="14" fill="#8B5A2B" stroke="#4D2F1A" stroke-width="2"/>

  <!-- ===== ARMS: LOWER PAIR (diagonal angles) ===== -->
  
  <!-- LEFT LOWER ARM (diagonal from body down-left to glove) -->
  <line x1="225" y1="360" x2="130" y2="440" stroke="#8B5A2B" stroke-width="28" stroke-linecap="round"/>
  
  <!-- RIGHT LOWER ARM (diagonal from body down-right to glove) -->
  <line x1="375" y1="360" x2="470" y2="440" stroke="#8B5A2B" stroke-width="28" stroke-linecap="round"/>

  <!-- ===== GLOVES: LEFT UPPER ARM ===== -->
  <g>
    <!-- Palm ellipse -->
    <ellipse cx="115" cy="309" rx="30" ry="26" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Thumb -->
    <circle cx="94" cy="297" r="10" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Four fingers -->
    <circle cx="88" cy="312" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="95" cy="326" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="110" cy="332" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="125" cy="322" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Wrist cuff -->
    <rect x="120" y="298" width="18" height="22" rx="4" fill="white" stroke="#ccc" stroke-width="2"/>
  </g>

  <!-- ===== GLOVES: RIGHT UPPER ARM ===== -->
  <g>
    <!-- Palm ellipse -->
    <ellipse cx="485" cy="309" rx="30" ry="26" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Thumb -->
    <circle cx="506" cy="297" r="10" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Four fingers -->
    <circle cx="512" cy="312" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="505" cy="326" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="490" cy="332" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="475" cy="322" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Wrist cuff -->
    <rect x="462" y="298" width="18" height="22" rx="4" fill="white" stroke="#ccc" stroke-width="2"/>
  </g>

  <!-- ===== GLOVES: LEFT LOWER ARM (diagonal, rotated 45° down-left) ===== -->
  <g transform="translate(110, 450) rotate(-45)">
    <!-- Palm ellipse -->
    <ellipse cx="0" cy="0" rx="28" ry="24" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Thumb -->
    <circle cx="-18" cy="-14" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Four fingers -->
    <circle cx="-22" cy="6" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="-12" cy="24" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="12" cy="26" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="24" cy="12" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Wrist cuff -->
    <rect x="22" y="-8" width="18" height="16" rx="3" fill="white" stroke="#ccc" stroke-width="2"/>
  </g>

  <!-- ===== GLOVES: RIGHT LOWER ARM (diagonal, rotated 45° down-right) ===== -->
  <g transform="translate(490, 450) rotate(45)">
    <!-- Palm ellipse -->
    <ellipse cx="0" cy="0" rx="28" ry="24" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Thumb -->
    <circle cx="18" cy="-14" r="9" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Four fingers -->
    <circle cx="22" cy="6" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="12" cy="24" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="-12" cy="26" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    <circle cx="-24" cy="12" r="8" fill="white" stroke="#ccc" stroke-width="2"/>
    
    <!-- Wrist cuff -->
    <rect x="-40" y="-8" width="18" height="16" rx="3" fill="white" stroke="#ccc" stroke-width="2"/>
  </g>

  <!-- ===== LEGS & BOOTS ===== -->
  
  <!-- LEFT LEG (upper segment) -->
  <rect x="248" y="400" width="40" height="55" rx="8" fill="#8B5A2B" stroke="#4D2F1A" stroke-width="2"/>
  
  <!-- RIGHT LEG (upper segment) -->
  <rect x="312" y="400" width="40" height="55" rx="8" fill="#8B5A2B" stroke="#4D2F1A" stroke-width="2"/>
  
  <!-- LEFT BOOT (chunky dark brown) -->
  <rect x="236" y="455" width="64" height="36" rx="8" fill="#3D2917" stroke="#2D1A0F" stroke-width="2"/>
  <!-- Boot segmentation lines -->
  <line x1="248" y1="455" x2="248" y2="491" stroke="#2D1A0F" stroke-width="1.5" opacity="0.6"/>
  <line x1="260" y1="455" x2="260" y2="491" stroke="#2D1A0F" stroke-width="1.5" opacity="0.6"/>
  <line x1="272" y1="455" x2="272" y2="491" stroke="#2D1A0F" stroke-width="1.5" opacity="0.6"/>
  
  <!-- RIGHT BOOT (chunky dark brown) -->
  <rect x="300" y="455" width="64" height="36" rx="8" fill="#3D2917" stroke="#2D1A0F" stroke-width="2"/>
  <!-- Boot segmentation lines -->
  <line x1="312" y1="455" x2="312" y2="491" stroke="#2D1A0F" stroke-width="1.5" opacity="0.6"/>
  <line x1="324" y1="455" x2="324" y2="491" stroke="#2D1A0F" stroke-width="1.5" opacity="0.6"/>
  <line x1="336" y1="455" x2="336" y2="491" stroke="#2D1A0F" stroke-width="1.5" opacity="0.6"/>

</svg>