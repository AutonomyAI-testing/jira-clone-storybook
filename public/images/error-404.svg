<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Parchment texture pattern -->
    <pattern id="paper-texture" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="8" cy="8" r="0.8" fill="#8B7355" opacity="0.15"/>
      <circle cx="24" cy="15" r="0.6" fill="#8B7355" opacity="0.1"/>
      <circle cx="12" cy="28" r="0.7" fill="#8B7355" opacity="0.12"/>
      <circle cx="32" cy="32" r="0.5" fill="#8B7355" opacity="0.08"/>
    </pattern>
    
    <!-- Gradients for depth -->
    <linearGradient id="robot-body-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8956A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F5F;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="screen-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7FDB6F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5FCC54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3FA84A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="hat-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B5998;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2E5AA4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B3A70;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow-filter">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Parchment background -->
  <rect width="600" height="600" fill="#F5EDD8"/>
  <rect width="600" height="600" fill="url(#paper-texture)"/>
  
  <!-- Vitruvian circle -->
  <circle cx="300" cy="310" r="210" fill="none" stroke="#A0826D" stroke-width="3" opacity="0.5"/>
  
  <!-- Vitruvian square (construction lines) -->
  <rect x="100" y="100" width="400" height="400" fill="none" stroke="#A0826D" stroke-width="2.5" opacity="0.45"/>
  
  <!-- Construction center lines -->
  <line x1="100" y1="310" x2="500" y2="310" stroke="#A0826D" stroke-width="1.5" opacity="0.35"/>
  <line x1="300" y1="100" x2="300" y2="500" stroke="#A0826D" stroke-width="1.5" opacity="0.35"/>
  
  <!-- ROBOT GROUP -->
  <g id="robot">
    <!-- LEFT ARM (dark cylinder + white cuff + white glove) -->
    <g id="left-arm">
      <!-- Left arm cylinder (dark grey extending from body) -->
      <rect x="105" y="290" width="130" height="50" rx="25" fill="#444444" stroke="#333333" stroke-width="2"/>
      
      <!-- Left wrist cuff (white) -->
      <ellipse cx="105" cy="315" rx="12" ry="28" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      
      <!-- Left glove (cartoon hand) -->
      <g id="left-glove">
        <!-- Palm -->
        <circle cx="75" cy="315" r="22" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
        
        <!-- Thumb pointing up-left -->
        <rect x="50" y="290" width="12" height="28" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(-30 56 305)"/>
        
        <!-- Index finger pointing left -->
        <rect x="45" y="305" width="12" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
        
        <!-- Middle finger pointing left-down -->
        <rect x="48" y="325" width="12" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(25 54 345)"/>
        
        <!-- Ring finger pointing down-left -->
        <rect x="60" y="340" width="12" height="28" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(45 66 360)"/>
        
        <!-- Pinky finger pointing down -->
        <rect x="75" y="345" width="10" height="25" rx="5" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(60 80 360)"/>
      </g>
    </g>
    
    <!-- RIGHT ARM (dark cylinder + white cuff + white glove) -->
    <g id="right-arm">
      <!-- Right arm cylinder (dark grey extending from body) -->
      <rect x="365" y="290" width="130" height="50" rx="25" fill="#444444" stroke="#333333" stroke-width="2"/>
      
      <!-- Right wrist cuff (white) -->
      <ellipse cx="495" cy="315" rx="12" ry="28" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
      
      <!-- Right glove (cartoon hand - mirror of left) -->
      <g id="right-glove">
        <!-- Palm -->
        <circle cx="525" cy="315" r="22" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
        
        <!-- Thumb pointing up-right -->
        <rect x="538" y="290" width="12" height="28" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(30 544 305)"/>
        
        <!-- Index finger pointing right -->
        <rect x="543" y="305" width="12" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
        
        <!-- Middle finger pointing right-down -->
        <rect x="540" y="325" width="12" height="32" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(-25 546 345)"/>
        
        <!-- Ring finger pointing down-right -->
        <rect x="528" y="340" width="12" height="28" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(-45 534 360)"/>
        
        <!-- Pinky finger pointing down -->
        <rect x="515" y="345" width="10" height="25" rx="5" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" transform="rotate(-60 520 360)"/>
      </g>
    </g>
    
    <!-- ROBOT HEAD/SCREEN -->
    <g id="robot-head">
      <!-- Screen container (rounded rect) -->
      <rect x="225" y="155" width="150" height="115" rx="12" fill="url(#robot-body-gradient)" stroke="#5C3D35" stroke-width="2.5" filter="url(#shadow-filter)"/>
      
      <!-- Screen bezel frame (brown) -->
      <rect x="235" y="165" width="130" height="95" rx="8" fill="#8B6F5F" stroke="#5C3D35" stroke-width="1.5"/>
      
      <!-- Screen glass (green with gradient) -->
      <rect x="245" y="175" width="110" height="75" rx="6" fill="url(#screen-gradient)" stroke="#1B3A70" stroke-width="1"/>
      
      <!-- Screen glow (CRT display effect - white blob shapes) -->
      <ellipse cx="265" cy="200" rx="28" ry="22" fill="white" opacity="0.35"/>
      <ellipse cx="295" cy="215" rx="20" ry="18" fill="white" opacity="0.28"/>
      
      <!-- Screen gloss highlight -->
      <ellipse cx="270" cy="190" rx="35" ry="20" fill="white" opacity="0.3"/>
      
      <!-- Screen reflection shine -->
      <polygon points="300,175 330,200 315,210 285,185" fill="white" opacity="0.25"/>
    </g>
    
    <!-- ROBOT TORSO -->
    <g id="robot-torso">
      <!-- Main torso body -->
      <rect x="235" y="280" width="130" height="120" rx="8" fill="url(#robot-body-gradient)" stroke="#5C3D35" stroke-width="2.5" filter="url(#shadow-filter)"/>
      
      <!-- Torso highlight shine -->
      <rect x="240" y="285" width="120" height="40" rx="6" fill="white" opacity="0.12"/>
      
      <!-- Chest panel/drawer -->
      <rect x="260" y="305" width="80" height="55" rx="6" fill="#8B6F5F" stroke="#5C3D35" stroke-width="1.5"/>
      
      <!-- Panel highlight -->
      <rect x="265" y="310" width="70" height="12" rx="4" fill="white" opacity="0.1"/>
      
      <!-- Chest button (circular with 3D effect) -->
      <circle cx="300" cy="345" r="11" fill="#D4AF37" stroke="#B8860B" stroke-width="2"/>
      <circle cx="298" cy="342" r="4" fill="white" opacity="0.5"/>
    </g>
    
    <!-- ROBOT LEGS & FEET -->
    <g id="robot-legs">
      <!-- Left leg -->
      <rect x="245" y="405" width="45" height="55" rx="6" fill="#8B6F5F" stroke="#5C3D35" stroke-width="2"/>
      
      <!-- Left foot -->
      <rect x="235" y="455" width="65" height="38" rx="6" fill="#6B5344" stroke="#5C3D35" stroke-width="2"/>
      
      <!-- Left foot panel detail -->
      <rect x="245" y="462" width="45" height="12" rx="3" fill="#8B6F5F" stroke="#5C3D35" stroke-width="1"/>
      
      <!-- Right leg -->
      <rect x="310" y="405" width="45" height="55" rx="6" fill="#8B6F5F" stroke="#5C3D35" stroke-width="2"/>
      
      <!-- Right foot -->
      <rect x="300" y="455" width="65" height="38" rx="6" fill="#6B5344" stroke="#5C3D35" stroke-width="2"/>
      
      <!-- Right foot panel detail -->
      <rect x="310" y="462" width="45" height="12" rx="3" fill="#8B6F5F" stroke="#5C3D35" stroke-width="1"/>
    </g>
    
    <!-- WIZARD HAT -->
    <g id="wizard-hat">
      <!-- Hat brim (wide ellipse at top of head) -->
      <ellipse cx="300" cy="155" rx="115" ry="28" fill="url(#hat-gradient)" stroke="#1B3A70" stroke-width="2.5"/>
      
      <!-- Hat brim shine -->
      <ellipse cx="300" cy="152" rx="110" ry="12" fill="white" opacity="0.2"/>
      
      <!-- Hat cone (floppy, tilting to LEFT) -->
      <path d="M 350 155 Q 280 80, 260 20 Q 270 90, 340 155 Z" fill="url(#hat-gradient)" stroke="#1B3A70" stroke-width="2.5"/>
      
      <!-- Hat cone shine -->
      <path d="M 345 155 Q 290 90, 265 35 Q 272 88, 335 155 Z" fill="white" opacity="0.15"/>
      
      <!-- STARS on hat (enlarged - 5-pointed, clearly visible) -->
      <!-- Top star (on cone tip) -->
      <g transform="translate(280, 65)">
        <polygon points="0,-14 4.2,-4.3 14,-2.8 7,3.5 8.4,14 0,8.4 -8.4,14 -7,3.5 -14,-2.8 -4.2,-4.3" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
      
      <!-- Upper right star -->
      <g transform="translate(320, 85)">
        <polygon points="0,-14 4.2,-4.3 14,-2.8 7,3.5 8.4,14 0,8.4 -8.4,14 -7,3.5 -14,-2.8 -4.2,-4.3" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
      
      <!-- Lower left star -->
      <g transform="translate(270, 125)">
        <polygon points="0,-13 3.9,-4 13,-2.6 6.5,3.2 8,13 0,8 -8,13 -6.5,3.2 -13,-2.6 -3.9,-4" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
      
      <!-- Lower right star (on brim) -->
      <g transform="translate(330, 140)">
        <polygon points="0,-12 3.6,-3.6 12,-2.4 6,3 7.2,12 0,7.2 -7.2,12 -6,3 -12,-2.4 -3.6,-3.6" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
      
      <!-- CRESCENT MOONS on hat (more defined, larger) -->
      <!-- Top left crescent -->
      <g transform="translate(290, 75)">
        <path d="M -8 -8 Q -2 -8, -2 0 Q -2 8, -8 8 Q -11 8, -11 0 Q -11 -8, -8 -8" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
      
      <!-- Middle left crescent -->
      <g transform="translate(265, 100)">
        <path d="M -8 -8 Q -2 -8, -2 0 Q -2 8, -8 8 Q -11 8, -11 0 Q -11 -8, -8 -8" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
      
      <!-- Bottom middle crescent -->
      <g transform="translate(310, 135)">
        <path d="M -7 -7 Q -2 -7, -2 0 Q -2 7, -7 7 Q -10 7, -10 0 Q -10 -7, -7 -7" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
      </g>
    </g>
  </g>
</svg>
