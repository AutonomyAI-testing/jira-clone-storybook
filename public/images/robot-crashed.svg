<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="crackScreenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1F05;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="torsoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7D65;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A5D48;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="armGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B5436;stop-opacity:1" />
    </linearGradient>

    <!-- Screen glare gradient (dim for error state) -->
    <radialGradient id="dimGlareGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#555555;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#555555;stop-opacity:0" />
    </radialGradient>

    <!-- Filter for screen scanlines -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="400" height="2">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#000000" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Vitruvian reference elements -->
  <circle cx="200" cy="260" r="180" fill="none" stroke="#8B7355" stroke-width="1.5" opacity="0.25"/>
  <rect x="45" y="85" width="310" height="350" fill="none" stroke="#8B7355" stroke-width="1.5" opacity="0.25"/>
  <line x1="200" y1="85" x2="200" y2="435" stroke="#8B7355" stroke-width="1" opacity="0.15"/>
  <line x1="45" y1="260" x2="355" y2="260" stroke="#8B7355" stroke-width="1" opacity="0.15"/>

  <!-- ============ SMOKE PUFFS (Top of head) ============ -->
  
  <!-- Smoke puff 1 - left -->
  <g opacity="0.7">
    <circle cx="170" cy="20" r="18" fill="#D3D3D3" stroke="none"/>
    <circle cx="160" cy="35" r="15" fill="#D3D3D3" stroke="none"/>
    <circle cx="180" cy="40" r="14" fill="#E8E8E8" stroke="none"/>
  </g>
  
  <!-- Smoke puff 2 - center -->
  <g opacity="0.75">
    <circle cx="200" cy="10" r="20" fill="#D3D3D3" stroke="none"/>
    <circle cx="190" cy="28" r="16" fill="#D3D3D3" stroke="none"/>
    <circle cx="210" cy="28" r="16" fill="#E8E8E8" stroke="none"/>
  </g>
  
  <!-- Smoke puff 3 - right -->
  <g opacity="0.7">
    <circle cx="230" cy="25" r="16" fill="#D3D3D3" stroke="none"/>
    <circle cx="220" cy="42" r="13" fill="#D3D3D3" stroke="none"/>
    <circle cx="240" cy="42" r="14" fill="#E8E8E8" stroke="none"/>
  </g>

  <!-- ============ SPARKS/LIGHTNING BOLTS (replacing wizard hat) ============ -->
  
  <!-- Spark 1 - upper left -->
  <g transform="translate(155, 50)">
    <polygon points="0,-12 3,-4 6,-2 3,2 5,10 0,5 -5,10 -3,2 -6,-2 -3,-4" 
             fill="#FF8C00" stroke="#FFD700" stroke-width="1.5"/>
  </g>
  
  <!-- Spark 2 - upper right -->
  <g transform="translate(245, 45)">
    <polygon points="0,-14 3,-5 7,-2 3,3 6,12 0,6 -6,12 -3,3 -7,-2 -3,-5" 
             fill="#FF6600" stroke="#FFD700" stroke-width="1.5"/>
  </g>
  
  <!-- Spark 3 - left side -->
  <g transform="translate(130, 80)">
    <polygon points="0,-10 2.5,-3 5,-1 2,2 4,9 0,4 -4,9 -2,2 -5,-1 -2.5,-3" 
             fill="#FF8C00" stroke="#FFD700" stroke-width="1"/>
  </g>
  
  <!-- Spark 4 - right side -->
  <g transform="translate(270, 85)">
    <polygon points="0,-11 3,-4 6,-2 3,2 5,10 0,5 -5,10 -3,2 -6,-2 -3,-4" 
             fill="#FF6600" stroke="#FFD700" stroke-width="1.5"/>
  </g>

  <!-- ============ CRT MONITOR HEAD (Middle) ============ -->
  
  <!-- Monitor outer frame (brown) -->
  <rect x="120" y="150" width="160" height="130" rx="12" fill="url(#torsoGradient)" stroke="#5A4436" stroke-width="3"/>
  
  <!-- Monitor frame inner shadow -->
  <rect x="128" y="158" width="144" height="114" rx="10" fill="none" stroke="#3A2C20" stroke-width="2" opacity="0.4"/>
  
  <!-- Screen with cracked/broken gradient background -->
  <rect x="135" y="165" width="130" height="100" rx="4" fill="url(#crackScreenGradient)" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Screen scanlines pattern -->
  <rect x="135" y="165" width="130" height="100" rx="4" fill="url(#scanlines)" opacity="0.4"/>
  
  <!-- Screen dim glare effect (showing malfunction) -->
  <ellipse cx="155" cy="180" rx="40" ry="35" fill="url(#dimGlareGradient)" opacity="0.5"/>
  
  <!-- Glitch lines across screen -->
  <line x1="135" y1="185" x2="265" y2="185" stroke="#00FF00" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="195" x2="245" y2="195" stroke="#00FF00" stroke-width="1" opacity="0.3"/>
  <line x1="140" y1="210" x2="260" y2="210" stroke="#00FF00" stroke-width="1.5" opacity="0.35"/>
  <line x1="135" y1="225" x2="250" y2="225" stroke="#00FF00" stroke-width="1" opacity="0.3"/>
  
  <!-- Crack lines on screen (jagged) -->
  <path d="M 200 165 L 210 175 L 215 172 L 225 185 L 220 195 L 230 205 L 225 215 L 235 225 L 220 235 L 215 240 L 200 250 L 190 245 L 185 255 L 175 250" 
        stroke="#666666" stroke-width="2" fill="none" opacity="0.8"/>
  
  <path d="M 145 170 L 155 182 L 150 192 L 160 205 L 155 215 L 165 225" 
        stroke="#666666" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <!-- X Eyes on screen (error/dead face) -->
  <!-- Left X -->
  <g transform="translate(165, 190)">
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Right X -->
  <g transform="translate(235, 190)">
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Screen bezel detail -->
  <rect x="130" y="155" width="140" height="115" rx="8" fill="none" stroke="#4A3728" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Center button/dial on monitor (dim/off) -->
  <circle cx="200" cy="210" r="8" fill="#8B7355" stroke="#2C2C2C" stroke-width="1.5"/>
  <circle cx="200" cy="210" r="6" fill="#6B5D52"/>

  <!-- ============ ERROR BOLT on torso ============ -->
  
  <!-- Red/orange lightning bolt (error indicator) -->
  <g transform="translate(200, 310)">
    <polygon points="0,-25 8,-8 2,-2 8,20 0,8 -8,20 -2,-2 -8,-8" 
             fill="#FF4444" stroke="#CC0000" stroke-width="1.5"/>
  </g>

  <!-- ============ TORSO (Upper body below head) ============ -->
  
  <!-- Main torso -->
  <rect x="110" y="275" width="180" height="110" rx="10" fill="url(#torsoGradient)" stroke="#5A4436" stroke-width="2.5"/>
  
  <!-- Torso panel detail -->
  <rect x="125" y="285" width="150" height="90" rx="6" fill="none" stroke="#5A4436" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Torso highlight (dim due to error) -->
  <ellipse cx="145" cy="300" rx="35" ry="20" fill="#8B7B6A" opacity="0.3"/>
  
  <!-- Central control panel (dark/off) -->
  <rect x="155" y="310" width="90" height="60" rx="4" fill="#4A3728" stroke="#3A2C20" stroke-width="1"/>
  
  <!-- Center button (off/dark) -->
  <circle cx="200" cy="335" r="11" fill="#6B5D52" stroke="#2C2C2C" stroke-width="1.5"/>
  <circle cx="200" cy="335" r="9" fill="#5A4F48"/>

  <!-- ============ FOUR DROOPING ARMS (hanging down) ============ -->
  
  <!-- LEFT ARM 1 (upper left) - hanging straight down -->
  <g>
    <!-- Upper arm segment hanging straight -->
    <rect x="75" y="280" width="32" height="80" rx="7" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Elbow joint -->
    <circle cx="91" cy="360" r="8" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Forearm segment hanging down -->
    <rect x="77" y="368" width="28" height="60" rx="6" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Wrist joint -->
    <circle cx="91" cy="428" r="7" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Glove hanging loose -->
    <circle cx="91" cy="445" r="13" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1.5"/>
    <!-- Glove fingers drooping -->
    <ellipse cx="83" cy="452" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="91" cy="458" rx="5.5" ry="8.5" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="99" cy="452" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
  </g>

  <!-- LEFT ARM 2 (lower left) - hanging straight down -->
  <g>
    <!-- Upper arm segment -->
    <rect x="82" y="340" width="30" height="85" rx="7" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Elbow joint -->
    <circle cx="97" cy="425" r="8" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Forearm segment hanging down -->
    <rect x="84" y="433" width="26" height="65" rx="6" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Wrist joint -->
    <circle cx="97" cy="498" r="7" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Glove at bottom -->
    <circle cx="97" cy="460" r="13" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1.5"/>
    <!-- Glove fingers -->
    <ellipse cx="89" cy="467" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="97" cy="473" rx="5.5" ry="8.5" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="105" cy="467" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
  </g>

  <!-- RIGHT ARM 1 (upper right) - hanging straight down -->
  <g>
    <!-- Upper arm segment -->
    <rect x="293" y="280" width="32" height="80" rx="7" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Elbow joint -->
    <circle cx="309" cy="360" r="8" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Forearm segment -->
    <rect x="295" y="368" width="28" height="60" rx="6" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Wrist joint -->
    <circle cx="309" cy="428" r="7" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Glove -->
    <circle cx="309" cy="445" r="13" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1.5"/>
    <!-- Glove fingers -->
    <ellipse cx="301" cy="452" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="309" cy="458" rx="5.5" ry="8.5" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="317" cy="452" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
  </g>

  <!-- RIGHT ARM 2 (lower right) - hanging straight down -->
  <g>
    <!-- Upper arm segment -->
    <rect x="288" y="340" width="30" height="85" rx="7" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Elbow joint -->
    <circle cx="303" cy="425" r="8" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Forearm segment -->
    <rect x="290" y="433" width="26" height="65" rx="6" fill="url(#armGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    <!-- Wrist joint -->
    <circle cx="303" cy="498" r="7" fill="#8B6F47" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Glove -->
    <circle cx="303" cy="460" r="13" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1.5"/>
    <!-- Glove fingers -->
    <ellipse cx="295" cy="467" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="303" cy="473" rx="5.5" ry="8.5" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
    <ellipse cx="311" cy="467" rx="4.5" ry="8" fill="#F5E6D3" stroke="#2C2C2C" stroke-width="1"/>
  </g>

  <!-- ============ LEGS & FEET (Bottom) ============ -->
  
  <!-- Left leg -->
  <rect x="145" y="380" width="25" height="65" rx="5" fill="#6B5436" stroke="#4A3728" stroke-width="1.5"/>
  
  <!-- Left foot -->
  <ellipse cx="157.5" cy="450" rx="18" ry="12" fill="#5A4436" stroke="#3A2C20" stroke-width="1.5"/>
  <rect x="140" y="450" width="35" height="10" fill="#4A3728" rx="2"/>
  
  <!-- Right leg -->
  <rect x="230" y="380" width="25" height="65" rx="5" fill="#6B5436" stroke="#4A3728" stroke-width="1.5"/>
  
  <!-- Right foot -->
  <ellipse cx="242.5" cy="450" rx="18" ry="12" fill="#5A4436" stroke="#3A2C20" stroke-width="1.5"/>
  <rect x="225" y="450" width="35" height="10" fill="#4A3728" rx="2"/>
  
  <!-- Foot detail lines -->
  <line x1="145" y1="460" x2="170" y2="460" stroke="#3A2C20" stroke-width="0.8" opacity="0.5"/>
  <line x1="230" y1="460" x2="255" y2="460" stroke="#3A2C20" stroke-width="0.8" opacity="0.5"/>
</svg>