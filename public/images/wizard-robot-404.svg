<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520">
  <!-- Parchment background -->
  <rect width="400" height="520" fill="#f0e8d8"/>
  
  <!-- Vitruvian guide circle (faint) -->
  <circle cx="200" cy="260" r="180" fill="none" stroke="#c4a4a4" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Vitruvian guide rectangle (faint) -->
  <rect x="50" y="140" width="300" height="260" fill="none" stroke="#c4a4a4" stroke-width="1" opacity="0.6"/>
  
  <!-- Horizontal and vertical cross guides (faint) -->
  <line x1="50" y1="260" x2="350" y2="260" stroke="#c4a4a4" stroke-width="0.8" opacity="0.4"/>
  <line x1="200" y1="140" x2="200" y2="400" stroke="#c4a4a4" stroke-width="0.8" opacity="0.4"/>
  
  <!-- LEFT ARMS -->
  <!-- Left upper arm -->
  <line x1="155" y1="270" x2="50" y2="220" stroke="#3d4043" stroke-width="16" stroke-linecap="round"/>
  <!-- Left lower arm -->
  <line x1="155" y1="300" x2="45" y2="360" stroke="#3d4043" stroke-width="16" stroke-linecap="round"/>
  
  <!-- RIGHT ARMS -->
  <!-- Right upper arm -->
  <line x1="245" y1="270" x2="350" y2="220" stroke="#3d4043" stroke-width="16" stroke-linecap="round"/>
  <!-- Right lower arm -->
  <line x1="245" y1="300" x2="355" y2="360" stroke="#3d4043" stroke-width="16" stroke-linecap="round"/>
  
  <!-- WHITE GLOVES - LEFT HANDS -->
  <!-- Upper left glove -->
  <g>
    <ellipse cx="45" cy="218" rx="20" ry="18" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Fingers -->
    <line x1="35" y1="210" x2="32" y2="195" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="205" x2="38" y2="188" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="202" x2="50" y2="183" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="205" x2="62" y2="188" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="210" x2="68" y2="195" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Lower left glove -->
  <g>
    <ellipse cx="40" cy="362" rx="20" ry="18" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Fingers -->
    <line x1="30" y1="354" x2="25" y2="338" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="348" x2="32" y2="330" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="345" x2="45" y2="326" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="348" x2="58" y2="330" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="354" x2="65" y2="338" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- WHITE GLOVES - RIGHT HANDS -->
  <!-- Upper right glove -->
  <g>
    <ellipse cx="355" cy="218" rx="20" ry="18" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Fingers -->
    <line x1="365" y1="210" x2="368" y2="195" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="360" y1="205" x2="362" y2="188" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="350" y1="202" x2="350" y2="183" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="340" y1="205" x2="338" y2="188" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="335" y1="210" x2="332" y2="195" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Lower right glove -->
  <g>
    <ellipse cx="360" cy="362" rx="20" ry="18" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="1"/>
    <!-- Fingers -->
    <line x1="370" y1="354" x2="375" y2="338" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="365" y1="348" x2="368" y2="330" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="355" y1="345" x2="355" y2="326" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="345" y1="348" x2="342" y2="330" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
    <line x1="340" y1="354" x2="335" y2="338" stroke="#f0f0f0" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- ROBOT TORSO/BODY -->
  <g>
    <!-- Main torso body -->
    <rect x="150" y="280" width="100" height="110" rx="8" fill="#b8956a" stroke="#8b6940" stroke-width="2"/>
    
    <!-- Rivets/bolts on sides -->
    <circle cx="154" cy="295" r="6" fill="#8b6940"/>
    <circle cx="246" cy="295" r="6" fill="#8b6940"/>
    <circle cx="154" cy="380" r="6" fill="#8b6940"/>
    <circle cx="246" cy="380" r="6" fill="#8b6940"/>
    
    <!-- Control panel area on lower torso -->
    <rect x="162" y="330" width="76" height="50" rx="6" fill="#8b6940" stroke="#6d5530" stroke-width="1"/>
    
    <!-- Panel border detail -->
    <rect x="164" y="332" width="72" height="46" rx="4" fill="none" stroke="#a8844f" stroke-width="1" opacity="0.5"/>
    
    <!-- Golden button on panel -->
    <circle cx="200" cy="357" r="14" fill="#f5c030" stroke="#d4a820" stroke-width="1.5"/>
    <circle cx="200" cy="357" r="10" fill="#f0a030"/>
    <!-- Button shine -->
    <ellipse cx="198" cy="354" rx="4" ry="3" fill="#ffd960" opacity="0.6"/>
  </g>
  
  <!-- LEGS -->
  <g>
    <!-- Left leg -->
    <rect x="168" y="390" width="24" height="45" rx="5" fill="#b8956a" stroke="#8b6940" stroke-width="1.5"/>
    <!-- Left foot/boot -->
    <g>
      <rect x="156" y="435" width="48" height="28" rx="6" fill="#5c3d1e" stroke="#3d2410" stroke-width="1.5"/>
      <!-- Boot detail lines -->
      <line x1="180" y1="435" x2="180" y2="463" stroke="#3d2410" stroke-width="0.5" opacity="0.5"/>
      <!-- Sole -->
      <rect x="156" y="456" width="48" height="7" fill="#3d2410" rx="3"/>
    </g>
    
    <!-- Right leg -->
    <rect x="208" y="390" width="24" height="45" rx="5" fill="#b8956a" stroke="#8b6940" stroke-width="1.5"/>
    <!-- Right foot/boot -->
    <g>
      <rect x="196" y="435" width="48" height="28" rx="6" fill="#5c3d1e" stroke="#3d2410" stroke-width="1.5"/>
      <!-- Boot detail lines -->
      <line x1="220" y1="435" x2="220" y2="463" stroke="#3d2410" stroke-width="0.5" opacity="0.5"/>
      <!-- Sole -->
      <rect x="196" y="456" width="48" height="7" fill="#3d2410" rx="3"/>
    </g>
  </g>
  
  <!-- TV/MONITOR HEAD -->
  <g>
    <!-- Head casing body -->
    <rect x="150" y="210" width="100" height="85" rx="10" fill="#b8956a" stroke="#8b6940" stroke-width="2"/>
    
    <!-- Screen bezel -->
    <rect x="158" y="218" width="84" height="65" rx="6" fill="#7a5c35" stroke="#5d4428" stroke-width="1"/>
    
    <!-- Screen (green CRT monitor) -->
    <defs>
      <radialGradient id="screenGlow" cx="45%" cy="35%">
        <stop offset="0%" style="stop-color:#9dd95a;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#6dbf3e;stop-opacity:1" />
      </radialGradient>
      <filter id="screenGloss">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
      </filter>
    </defs>
    <rect x="162" y="222" width="76" height="56" rx="4" fill="url(#screenGlow)"/>
    
    <!-- Screen glass shine/gloss -->
    <ellipse cx="185" cy="238" rx="26" ry="16" fill="rgba(255,255,255,0.25)" filter="url(#screenGloss)"/>
    <path d="M 165 225 Q 200 228 235 225" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Screen shadow to add depth -->
    <rect x="162" y="272" width="76" height="6" rx="2" fill="rgba(0,0,0,0.2)"/>
  </g>
  
  <!-- WIZARD HAT -->
  <g>
    <!-- Hat brim (wide ellipse) -->
    <ellipse cx="200" cy="210" rx="95" ry="22" fill="#1e3a6e" stroke="#0f1a3d" stroke-width="2"/>
    <!-- Brim shading -->
    <ellipse cx="200" cy="211" rx="93" ry="18" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
    
    <!-- Hat cone -->
    <polygon points="200,50 130,210 270,210" fill="#1e3a6e" stroke="#0f1a3d" stroke-width="2" stroke-linejoin="round"/>
    <!-- Cone highlight for depth -->
    <polygon points="200,55 158,200 242,200" fill="rgba(0,0,0,0.1)" opacity="0.3"/>
    
    <!-- Hat band (around base of cone) -->
    <ellipse cx="200" cy="210" rx="72" ry="12" fill="#0f1a3d" opacity="0.4"/>
    
    <!-- STARS AND MOONS ON HAT -->
    <!-- Cone stars -->
    <g font-family="Arial, sans-serif" font-size="16" fill="#f5c51a">
      <!-- Upper stars -->
      <text x="160" y="110" text-anchor="middle" dominant-baseline="middle">★</text>
      <text x="240" y="115" text-anchor="middle" dominant-baseline="middle">★</text>
      <!-- Middle stars -->
      <text x="165" y="155" text-anchor="middle" dominant-baseline="middle" font-size="14">☽</text>
      <text x="235" y="160" text-anchor="middle" dominant-baseline="middle" font-size="14">☽</text>
      <text x="200" y="130" text-anchor="middle" dominant-baseline="middle" font-size="12">★</text>
      <!-- Lower cone details -->
      <text x="185" y="185" text-anchor="middle" dominant-baseline="middle" font-size="13">★</text>
      <text x="215" y="185" text-anchor="middle" dominant-baseline="middle" font-size="13">★</text>
    </g>
    
    <!-- Brim stars and moons -->
    <g font-family="Arial, sans-serif" font-size="14" fill="#f5c51a">
      <text x="120" y="215" text-anchor="middle" dominant-baseline="middle">★</text>
      <text x="280" y="215" text-anchor="middle" dominant-baseline="middle">★</text>
      <text x="95" y="210" text-anchor="middle" dominant-baseline="middle" font-size="12">☽</text>
      <text x="305" y="210" text-anchor="middle" dominant-baseline="middle" font-size="12">☽</text>
      <text x="145" y="225" text-anchor="middle" dominant-baseline="middle" font-size="12">☽</text>
      <text x="255" y="225" text-anchor="middle" dominant-baseline="middle" font-size="12">☽</text>
    </g>
  </g>
  
  <!-- DECORATIVE ELEMENTS FOR VISUAL POLISH -->
  <!-- Accent shadows under body -->
  <ellipse cx="200" cy="402" rx="70" ry="8" fill="rgba(0,0,0,0.15)"/>
  
  <!-- Add slight shadow under the head to show dimension -->
  <path d="M 160 295 Q 200 305 240 295" stroke="rgba(0,0,0,0.1)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>