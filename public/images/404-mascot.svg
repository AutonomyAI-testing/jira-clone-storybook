<svg viewBox="0 0 300 300" width="300" height="300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="gradientBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#36d9d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b8ff7;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Gradient border circle (outer ring) -->
  <circle cx="150" cy="150" r="148" fill="none" stroke="url(#gradientBorder)" stroke-width="6"/>
  
  <!-- Main warm background circle -->
  <circle cx="150" cy="150" r="142" fill="#f5c842" filter="url(#softGlow)"/>
  
  <!-- ========== HAIR ========== -->
  <!-- Large dramatic hair mass (background layer) -->
  <path d="M 100 110 Q 80 80, 90 50 Q 110 30, 150 25 Q 190 30, 210 50 Q 220 80, 200 110 Q 195 115, 190 118 L 160 125 L 140 125 L 110 118 Q 105 115, 100 110 Z" 
        fill="#111111" stroke="none"/>
  
  <!-- Left spiky hair strands -->
  <path d="M 100 75 L 70 45 Q 75 40, 80 48" fill="#111111" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 95 55 L 65 25 Q 70 22, 75 32" fill="#111111" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 110 50 L 85 15 Q 90 12, 95 22" fill="#111111" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top center spiky strands (tallest) -->
  <path d="M 135 40 L 130 8 Q 135 5, 140 18" fill="#111111" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 150 35 L 150 5 Q 155 5, 155 20" fill="#111111" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 165 40 L 170 8 Q 165 5, 160 18" fill="#111111" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right spiky hair strands -->
  <path d="M 200 55 L 235 25 Q 230 22, 225 32" fill="#111111" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 205 75 L 230 45 Q 225 40, 220 48" fill="#111111" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 190 50 L 215 15 Q 210 12, 205 22" fill="#111111" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Side hair details and texture lines -->
  <line x1="85" y1="90" x2="95" y2="85" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="215" y1="90" x2="205" y2="85" stroke="#111111" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- ========== FACE SHAPE & SKIN ========== -->
  <!-- Main face shape (large, fills most circle) -->
  <ellipse cx="150" cy="140" rx="70" ry="85" fill="#f0e6d2" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- ========== EYEBROWS ========== -->
  <!-- Left eyebrow (dark, arched) -->
  <path d="M 115 100 Q 130 92, 145 98" stroke="#111111" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right eyebrow (dark, arched) -->
  <path d="M 155 98 Q 170 92, 185 100" stroke="#111111" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- ========== EYES (LARGE & EXPRESSIVE) ========== -->
  <!-- Left eye whites (large oval) -->
  <ellipse cx="128" cy="120" rx="16" ry="22" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Left iris (large golden/amber) -->
  <circle cx="128" cy="125" r="12" fill="#e8b44a" stroke="#111111" stroke-width="1.5"/>
  
  <!-- Left pupil (dark, small) -->
  <circle cx="128" cy="126" r="6" fill="#111111"/>
  
  <!-- Left eye highlight (white shine, upper right) -->
  <circle cx="132" cy="120" r="3.5" fill="#ffffff"/>
  <circle cx="130" cy="122" r="1.5" fill="#ffffff" opacity="0.7"/>
  
  <!-- Right eye whites (large oval) -->
  <ellipse cx="172" cy="120" rx="16" ry="22" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Right iris (large golden/amber) -->
  <circle cx="172" cy="125" r="12" fill="#e8b44a" stroke="#111111" stroke-width="1.5"/>
  
  <!-- Right pupil (dark, small) -->
  <circle cx="172" cy="126" r="6" fill="#111111"/>
  
  <!-- Right eye highlight (white shine, upper right) -->
  <circle cx="176" cy="120" r="3.5" fill="#ffffff"/>
  <circle cx="174" cy="122" r="1.5" fill="#ffffff" opacity="0.7"/>
  
  <!-- ========== NOSE ========== -->
  <!-- Small nose (simple line) -->
  <line x1="150" y1="135" x2="150" y2="150" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Nostril shading (subtle) -->
  <circle cx="147" cy="148" r="1.2" fill="#111111" opacity="0.5"/>
  <circle cx="153" cy="148" r="1.2" fill="#111111" opacity="0.5"/>
  
  <!-- ========== MOUTH ========== -->
  <!-- Slightly open mouth line (expressive) -->
  <path d="M 135 162 Q 150 172, 165 162" stroke="#111111" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Mouth opening indication (small curved line) -->
  <path d="M 140 165 Q 150 168, 160 165" stroke="#111111" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- ========== FACIAL SHADING & DETAIL ========== -->
  <!-- Cheek shading (subtle) -->
  <ellipse cx="105" cy="135" rx="8" ry="12" fill="#111111" opacity="0.08"/>
  <ellipse cx="195" cy="135" rx="8" ry="12" fill="#111111" opacity="0.08"/>
  
  <!-- Chin shadow (subtle) -->
  <path d="M 120 185 Q 150 200, 180 185" fill="none" stroke="#111111" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  
  <!-- ========== NECK/SHOULDER INDICATION ========== -->
  <!-- Shoulders (simplified dark shape, dynamic lean forward) -->
  <path d="M 110 210 Q 100 230, 120 245 L 180 245 Q 200 230, 190 210" 
        fill="#111111" opacity="0.4" stroke="none"/>
  
  <!-- Shoulder definition line -->
  <path d="M 120 210 L 180 210" stroke="#111111" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
</svg>