<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2e0c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d0b0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e060;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7cc840;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5aaa28;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3b7a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2a5cac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5cac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c89a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a07040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b88040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a5820;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a5a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a3820;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noiseOut" seed="5"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Parchment background -->
  <rect width="800" height="800" fill="url(#bgGrad)" rx="12"/>
  <!-- Noise texture overlay for vintage feel -->
  <rect width="800" height="800" fill="#8a6a3a" opacity="0.06" rx="12"/>
  <!-- Speckles pattern -->
  <circle cx="80" cy="120" r="2" fill="#8a6030" opacity="0.15"/>
  <circle cx="150" cy="80" r="1.5" fill="#8a6030" opacity="0.12"/>
  <circle cx="700" cy="100" r="2" fill="#8a6030" opacity="0.15"/>
  <circle cx="720" cy="200" r="1.5" fill="#8a6030" opacity="0.1"/>
  <circle cx="680" cy="650" r="2" fill="#8a6030" opacity="0.12"/>
  <circle cx="100" cy="680" r="1.5" fill="#8a6030" opacity="0.1"/>
  <circle cx="200" cy="700" r="2" fill="#8a6030" opacity="0.12"/>
  <circle cx="600" cy="720" r="1.5" fill="#8a6030" opacity="0.1"/>
  <circle cx="350" cy="50" r="2" fill="#8a6030" opacity="0.1"/>
  <circle cx="50" cy="400" r="2" fill="#8a6030" opacity="0.12"/>
  <circle cx="750" cy="450" r="1.5" fill="#8a6030" opacity="0.1"/>

  <!-- Vitruvian Man circle guide -->
  <circle cx="400" cy="460" r="280" fill="none" stroke="#7a4a3a" stroke-width="2.5" opacity="0.5"/>
  
  <!-- Horizontal and vertical guide lines -->
  <line x1="120" y1="460" x2="680" y2="460" stroke="#7a4a3a" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="200" x2="400" y2="730" stroke="#7a4a3a" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Inner square (Vitruvian Man) -->
  <rect x="200" y="330" width="400" height="300" fill="none" stroke="#7a4a3a" stroke-width="1.5" opacity="0.35"/>

  <!-- ====== ROBOT BODY ====== -->
  
  <!-- Legs -->
  <g filter="url(#shadow)">
    <!-- Left leg -->
    <rect x="305" y="590" width="65" height="100" rx="10" fill="url(#legGrad)" stroke="#3a2010" stroke-width="2.5"/>
    <!-- Left leg details -->
    <rect x="310" y="605" width="55" height="8" rx="3" fill="#4a2810" opacity="0.5"/>
    <rect x="310" y="625" width="55" height="8" rx="3" fill="#4a2810" opacity="0.5"/>
    <!-- Left foot -->
    <rect x="280" y="678" width="105" height="38" rx="8" fill="#5a3820" stroke="#3a2010" stroke-width="2.5"/>
    <rect x="280" y="686" width="105" height="12" rx="3" fill="#4a2810" opacity="0.4"/>
    
    <!-- Right leg -->
    <rect x="430" y="590" width="65" height="100" rx="10" fill="url(#legGrad)" stroke="#3a2010" stroke-width="2.5"/>
    <!-- Right leg details -->
    <rect x="435" y="605" width="55" height="8" rx="3" fill="#4a2810" opacity="0.5"/>
    <rect x="435" y="625" width="55" height="8" rx="3" fill="#4a2810" opacity="0.5"/>
    <!-- Right foot -->
    <rect x="415" y="678" width="105" height="38" rx="8" fill="#5a3820" stroke="#3a2010" stroke-width="2.5"/>
    <rect x="415" y="686" width="105" height="12" rx="3" fill="#4a2810" opacity="0.4"/>
  </g>

  <!-- Body/Torso -->
  <g filter="url(#shadow)">
    <!-- Main torso rectangle -->
    <rect x="290" y="450" width="220" height="160" rx="14" fill="url(#bodyGrad)" stroke="#6a4020" stroke-width="3"/>
    
    <!-- Body shading left side -->
    <rect x="290" y="450" width="110" height="160" rx="14" fill="#9a7040" opacity="0.3"/>
    
    <!-- Chest panel -->
    <rect x="308" y="468" width="184" height="110" rx="8" fill="#9a6a38" stroke="#6a4020" stroke-width="2"/>
    
    <!-- Panel vertical dividers -->
    <line x1="345" y1="468" x2="345" y2="578" stroke="#5a3018" stroke-width="2"/>
    <line x1="455" y1="468" x2="455" y2="578" stroke="#5a3018" stroke-width="2"/>
    
    <!-- Central chest button/orb -->
    <circle cx="400" cy="520" r="22" fill="#d4a050" stroke="#6a4020" stroke-width="2.5"/>
    <circle cx="400" cy="520" r="17" fill="#f0c070"/>
    <circle cx="400" cy="516" r="7" fill="#ffe090" opacity="0.7"/>
    
    <!-- Shoulder bolts -->
    <circle cx="296" cy="462" r="7" fill="#8a6030" stroke="#5a3818" stroke-width="2"/>
    <circle cx="504" cy="462" r="7" fill="#8a6030" stroke="#5a3818" stroke-width="2"/>
    
    <!-- Waist belt -->
    <rect x="290" y="595" width="220" height="14" rx="5" fill="#7a4a28" stroke="#4a2818" stroke-width="1.5"/>
    <rect x="380" y="592" width="40" height="20" rx="4" fill="#8a5830" stroke="#4a2818" stroke-width="1.5"/>
  </g>

  <!-- ====== ARMS (4 arms total - Vitruvian Man style) ====== -->
  
  <!-- Upper left arm (angled up-left) -->
  <g filter="url(#shadow)">
    <line x1="295" y1="470" x2="140" y2="380" stroke="url(#armGrad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="295" y1="470" x2="140" y2="380" stroke="#2a2a3a" stroke-width="24" stroke-linecap="round"/>
    <!-- Arm connector joint at body -->
    <circle cx="285" cy="475" r="18" fill="#7a5030" stroke="#5a3018" stroke-width="2.5"/>
  </g>
  
  <!-- Upper right arm (angled up-right) -->
  <g filter="url(#shadow)">
    <line x1="505" y1="470" x2="660" y2="380" stroke="url(#armGrad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="505" y1="470" x2="660" y2="380" stroke="#2a2a3a" stroke-width="24" stroke-linecap="round"/>
    <!-- Arm connector joint at body -->
    <circle cx="515" cy="475" r="18" fill="#7a5030" stroke="#5a3018" stroke-width="2.5"/>
  </g>
  
  <!-- Lower left arm (angled down-left) -->
  <g filter="url(#shadow)">
    <line x1="295" y1="530" x2="100" y2="520" stroke="url(#armGrad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="295" y1="530" x2="100" y2="520" stroke="#2a2a3a" stroke-width="24" stroke-linecap="round"/>
    <circle cx="285" cy="528" r="16" fill="#7a5030" stroke="#5a3018" stroke-width="2.5"/>
  </g>
  
  <!-- Lower right arm (angled down-right) -->
  <g filter="url(#shadow)">
    <line x1="505" y1="530" x2="700" y2="520" stroke="url(#armGrad)" stroke-width="28" stroke-linecap="round"/>
    <line x1="505" y1="530" x2="700" y2="520" stroke="#2a2a3a" stroke-width="24" stroke-linecap="round"/>
    <circle cx="515" cy="528" r="16" fill="#7a5030" stroke="#5a3018" stroke-width="2.5"/>
  </g>

  <!-- ====== HANDS (white gloves) ====== -->
  
  <!-- Upper left hand -->
  <g filter="url(#shadow)" transform="translate(95, 335) rotate(30)">
    <!-- White glove cuff -->
    <rect x="-22" y="28" width="44" height="16" rx="8" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Palm -->
    <ellipse cx="0" cy="12" rx="22" ry="26" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Fingers spread out -->
    <ellipse cx="-18" cy="-8" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(-20 -18 -8)"/>
    <ellipse cx="-8" cy="-16" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(-8 -8 -16)"/>
    <ellipse cx="4" cy="-18" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <ellipse cx="16" cy="-12" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(15 16 -12)"/>
    <!-- Knuckle lines -->
    <line x1="-15" y1="5" x2="-15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="-5" y1="3" x2="-5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="5" y1="3" x2="5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="15" y1="5" x2="15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
  </g>
  
  <!-- Upper right hand -->
  <g filter="url(#shadow)" transform="translate(705, 335) rotate(-30) scale(-1,1) translate(-705,-335) translate(705, 335) rotate(-30)">
    <!-- White glove cuff -->
    <rect x="-22" y="28" width="44" height="16" rx="8" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Palm -->
    <ellipse cx="0" cy="12" rx="22" ry="26" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Fingers spread out -->
    <ellipse cx="18" cy="-8" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(20 18 -8)"/>
    <ellipse cx="8" cy="-16" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(8 8 -16)"/>
    <ellipse cx="-4" cy="-18" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <ellipse cx="-16" cy="-12" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(-15 -16 -12)"/>
    <!-- Knuckle lines -->
    <line x1="15" y1="5" x2="15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="5" y1="3" x2="5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="-5" y1="3" x2="-5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="-15" y1="5" x2="-15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
  </g>
  
  <!-- Lower left hand -->
  <g filter="url(#shadow)" transform="translate(57, 490)">
    <!-- White glove cuff -->
    <rect x="-22" y="28" width="44" height="16" rx="8" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Palm -->
    <ellipse cx="0" cy="12" rx="22" ry="26" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Fingers spread out -->
    <ellipse cx="-18" cy="-8" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(-20 -18 -8)"/>
    <ellipse cx="-8" cy="-16" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(-8 -8 -16)"/>
    <ellipse cx="4" cy="-18" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <ellipse cx="16" cy="-12" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(15 16 -12)"/>
    <!-- Knuckle lines -->
    <line x1="-15" y1="5" x2="-15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="-5" y1="3" x2="-5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="5" y1="3" x2="5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="15" y1="5" x2="15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
  </g>
  
  <!-- Lower right hand -->
  <g filter="url(#shadow)" transform="translate(743, 490)">
    <!-- White glove cuff -->
    <rect x="-22" y="28" width="44" height="16" rx="8" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Palm -->
    <ellipse cx="0" cy="12" rx="22" ry="26" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <!-- Fingers spread out -->
    <ellipse cx="18" cy="-8" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(20 18 -8)"/>
    <ellipse cx="8" cy="-16" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(8 8 -16)"/>
    <ellipse cx="-4" cy="-18" rx="7" ry="17" fill="white" stroke="#c8c8c8" stroke-width="1.5"/>
    <ellipse cx="-16" cy="-12" rx="7" ry="16" fill="white" stroke="#c8c8c8" stroke-width="1.5" transform="rotate(-15 -16 -12)"/>
    <!-- Knuckle lines -->
    <line x1="15" y1="5" x2="15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="5" y1="3" x2="5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="-5" y1="3" x2="-5" y2="-2" stroke="#d0d0d0" stroke-width="1.5"/>
    <line x1="-15" y1="5" x2="-15" y2="0" stroke="#d0d0d0" stroke-width="1.5"/>
  </g>

  <!-- ====== HEAD (CRT Monitor) ====== -->
  <g filter="url(#shadow)">
    <!-- Monitor outer frame -->
    <rect x="280" y="310" width="240" height="175" rx="16" fill="url(#frameGrad)" stroke="#5a3010" stroke-width="3.5"/>
    
    <!-- Frame shading -->
    <rect x="280" y="310" width="120" height="175" rx="16" fill="#7a4820" opacity="0.25"/>
    
    <!-- Monitor bezel -->
    <rect x="295" y="325" width="210" height="145" rx="10" fill="#8a5828" stroke="#5a3010" stroke-width="2"/>
    
    <!-- Screen glass (bright green) -->
    <rect x="308" y="338" width="184" height="118" rx="6" fill="url(#screenGrad)" stroke="#1a6010" stroke-width="2"/>
    
    <!-- Screen reflection/shine top-left -->
    <ellipse cx="340" cy="365" rx="36" ry="28" fill="white" opacity="0.45"/>
    <ellipse cx="355" cy="370" rx="20" ry="14" fill="white" opacity="0.3"/>
    
    <!-- Screen reflection bottom-right -->
    <path d="M 450 430 Q 475 440 470 460" fill="white" opacity="0.25" stroke-width="0"/>
    
    <!-- Side knobs -->
    <rect x="268" y="335" width="18" height="35" rx="9" fill="#c89050" stroke="#5a3010" stroke-width="2"/>
    <rect x="514" y="335" width="18" height="35" rx="9" fill="#c89050" stroke="#5a3010" stroke-width="2"/>
    
    <!-- Knob centers -->
    <circle cx="277" cy="352" r="4" fill="#5a3010"/>
    <circle cx="523" cy="352" r="4" fill="#5a3010"/>
    
    <!-- Bottom of monitor has small vents -->
    <rect x="340" y="462" width="120" height="5" rx="2" fill="#5a3010" opacity="0.5"/>
    <line x1="360" y1="462" x2="360" y2="467" stroke="#5a3010" stroke-width="2" opacity="0.5"/>
    <line x1="380" y1="462" x2="380" y2="467" stroke="#5a3010" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="462" x2="400" y2="467" stroke="#5a3010" stroke-width="2" opacity="0.5"/>
    <line x1="420" y1="462" x2="420" y2="467" stroke="#5a3010" stroke-width="2" opacity="0.5"/>
    <line x1="440" y1="462" x2="440" y2="467" stroke="#5a3010" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- ====== WIZARD HAT ====== -->
  <g filter="url(#shadow)">
    <!-- Wide brim (ellipse) -->
    <ellipse cx="400" cy="325" rx="230" ry="70" fill="url(#brimGrad)" stroke="#0a1a50" stroke-width="3.5"/>
    <!-- Brim top shading -->
    <ellipse cx="400" cy="315" rx="230" ry="60" fill="#1a2a60" opacity="0.35"/>
    
    <!-- Hat cone (tall pointed) -->
    <path d="M 220 325 L 400 60 L 580 325 Z" fill="url(#hatGrad)" stroke="#0a1a50" stroke-width="3.5"/>
    
    <!-- Hat cone left shading -->
    <path d="M 240 325 L 400 60 L 400 325 Z" fill="#0a1840" opacity="0.4"/>
    
    <!-- Curved tip/curl at top -->
    <path d="M 400 60 Q 415 45 430 58 Q 435 68 425 72" fill="none" stroke="#0a1a50" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Stars on hat cone -->
    <!-- Top star (large) -->
    <g transform="translate(400, 130)">
      <polygon points="0,-18 5,-7 18,-2 8,7 10,20 0,14 -10,20 -8,7 -18,-2 -5,-7" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Upper right star -->
    <g transform="translate(468, 170)">
      <polygon points="0,-14 4,-5 14,-1 6,5 8,16 0,11 -8,16 -6,5 -14,-1 -4,-5" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Upper left star -->
    <g transform="translate(330, 185)">
      <polygon points="0,-12 3,-4 12,-1 5,4 7,13 0,9 -7,13 -5,4 -12,-1 -3,-4" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Middle right star -->
    <g transform="translate(505, 240)">
      <polygon points="0,-14 4,-5 14,-1 6,5 8,16 0,11 -8,16 -6,5 -14,-1 -4,-5" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Middle left star -->
    <g transform="translate(295, 255)">
      <polygon points="0,-12 3,-4 12,-1 5,4 7,13 0,9 -7,13 -5,4 -12,-1 -3,-4" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Lower right star on brim -->
    <g transform="translate(540, 310)">
      <polygon points="0,-14 4,-5 14,-1 6,5 8,16 0,11 -8,16 -6,5 -14,-1 -4,-5" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Lower left star on brim -->
    <g transform="translate(265, 315)">
      <polygon points="0,-13 4,-5 13,-1 6,5 8,15 0,10 -8,15 -6,5 -13,-1 -4,-5" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Far right brim star -->
    <g transform="translate(588, 325)">
      <polygon points="0,-12 3,-4 12,-1 5,4 7,13 0,9 -7,13 -5,4 -12,-1 -3,-4" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    <!-- Far left brim star -->
    <g transform="translate(215, 325)">
      <polygon points="0,-12 3,-4 12,-1 5,4 7,13 0,9 -7,13 -5,4 -12,-1 -3,-4" fill="#f0c830" stroke="#c09010" stroke-width="1.5"/>
    </g>
    
    <!-- Crescent moons on hat -->
    <!-- Upper left moon -->
    <g transform="translate(360, 195)">
      <circle cx="0" cy="0" r="18" fill="#f0c830"/>
      <circle cx="6" cy="-3" r="17" fill="#1a3a80"/>
    </g>
    <!-- Upper right moon -->
    <g transform="translate(440, 165)">
      <circle cx="0" cy="0" r="15" fill="#f0c830"/>
      <circle cx="5" cy="-2" r="14" fill="#1a3a80"/>
    </g>
    <!-- Left brim moon -->
    <g transform="translate(330, 300)">
      <circle cx="0" cy="0" r="14" fill="#f0c830"/>
      <circle cx="5" cy="-2" r="13" fill="#1a3060"/>
    </g>
    <!-- Right brim moon -->
    <g transform="translate(480, 295)">
      <circle cx="0" cy="0" r="14" fill="#f0c830"/>
      <circle cx="5" cy="-2" r="13" fill="#1a3060"/>
    </g>
    <!-- Lower brim moons -->
    <g transform="translate(380, 345)">
      <circle cx="0" cy="0" r="13" fill="#f0c830"/>
      <circle cx="5" cy="-2" r="12" fill="#1a3060"/>
    </g>
    <g transform="translate(430, 348)">
      <circle cx="0" cy="0" r="11" fill="#f0c830"/>
      <circle cx="4" cy="-2" r="10" fill="#1a3060"/>
    </g>
    <!-- Extra brim star right -->
    <g transform="translate(560, 338)">
      <polygon points="0,-11 3,-4 11,-1 5,4 6,12 0,8 -6,12 -5,4 -11,-1 -3,-4" fill="#f0c830" stroke="#c09010" stroke-width="1"/>
    </g>
    <!-- Extra brim star left -->
    <g transform="translate(235, 338)">
