<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" fill="none">
  <!-- Background: warm cream parchment -->
  <rect width="400" height="440" fill="#f5f0e8"/>

  <!-- Steam wisps (top) -->
  <path d="M160 60 Q155 45 160 30 Q165 15 160 2" stroke="#c0b090" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M175 70 Q168 52 174 37 Q180 22 174 8" stroke="#c0b090" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M240 58 Q246 42 240 27 Q234 12 240 0" stroke="#c0b090" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M225 68 Q232 50 226 35 Q220 20 226 6" stroke="#c0b090" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Antenna -->
  <line x1="200" y1="88" x2="200" y2="65" stroke="#3d2b1a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="60" r="8" fill="#e05c2a" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- Antenna pulse ring -->
  <circle cx="200" cy="60" r="12" fill="none" stroke="#e05c2a" stroke-width="1.5" opacity="0.4"/>

  <!-- Robot Head -->
  <rect x="140" y="88" width="120" height="100" rx="16" fill="#c49a6c" stroke="#3d2b1a" stroke-width="3"/>
  <!-- Head highlight -->
  <rect x="148" y="96" width="50" height="20" rx="6" fill="#d4af82" opacity="0.5"/>

  <!-- Left eye (normal) -->
  <rect x="155" y="108" width="38" height="28" rx="8" fill="#1a2a45" stroke="#3d2b1a" stroke-width="2.5"/>
  <rect x="163" y="114" width="22" height="16" rx="4" fill="#e8f020" opacity="0.85"/>
  <!-- eye glow -->
  <ellipse cx="169" cy="119" rx="5" ry="4" fill="#fff" opacity="0.6"/>

  <!-- Right eye (X — error) -->
  <rect x="207" y="108" width="38" height="28" rx="8" fill="#1a2a45" stroke="#3d2b1a" stroke-width="2.5"/>
  <line x1="215" y1="116" x2="237" y2="128" stroke="#e05c2a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="237" y1="116" x2="215" y2="128" stroke="#e05c2a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Mouth (wavy / distressed) -->
  <path d="M163 152 Q173 160 183 152 Q193 144 203 152 Q213 160 223 152 Q233 144 237 152" stroke="#3d2b1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Neck -->
  <rect x="186" y="188" width="28" height="16" rx="4" fill="#a07848" stroke="#3d2b1a" stroke-width="2.5"/>

  <!-- Robot Body -->
  <rect x="118" y="204" width="164" height="120" rx="18" fill="#c49a6c" stroke="#3d2b1a" stroke-width="3"/>
  <!-- Body panel shade -->
  <rect x="130" y="215" width="140" height="98" rx="12" fill="#b8895a" stroke="#3d2b1a" stroke-width="1.5"/>

  <!-- Chest panel — warning display -->
  <rect x="148" y="228" width="104" height="60" rx="8" fill="#1a2a45" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- Warning icon background -->
  <polygon points="200,236 218,262 182,262" fill="#f0c020" stroke="#3d2b1a" stroke-width="1.5"/>
  <!-- Warning ! -->
  <line x1="200" y1="242" x2="200" y2="253" stroke="#3d2b1a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="257" r="1.8" fill="#3d2b1a"/>
  <!-- Panel text: ERROR 500 -->
  <text x="200" y="278" text-anchor="middle" font-family="monospace" font-size="10" fill="#e05c2a" font-weight="bold">ERROR 500</text>

  <!-- Belly button / power indicator -->
  <circle cx="200" cy="300" r="10" fill="#3d2b1a" stroke="#a07848" stroke-width="2"/>
  <circle cx="200" cy="300" r="6" fill="#e05c2a" opacity="0.9"/>

  <!-- Body bolts -->
  <circle cx="134" cy="222" r="5" fill="#a07848" stroke="#3d2b1a" stroke-width="2"/>
  <circle cx="266" cy="222" r="5" fill="#a07848" stroke="#3d2b1a" stroke-width="2"/>
  <circle cx="134" cy="312" r="5" fill="#a07848" stroke="#3d2b1a" stroke-width="2"/>
  <circle cx="266" cy="312" r="5" fill="#a07848" stroke="#3d2b1a" stroke-width="2"/>

  <!-- Left Arm (drooping down) -->
  <rect x="78" y="210" width="40" height="18" rx="9" fill="#c49a6c" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- arm segment -->
  <rect x="62" y="218" width="22" height="60" rx="9" fill="#c49a6c" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- left hand (limp) -->
  <ellipse cx="73" cy="290" rx="18" ry="14" fill="#d4af82" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- fingers -->
  <line x1="58" y1="286" x2="52" y2="296" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="290" x2="57" y2="302" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="292" x2="66" y2="304" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="77" y1="292" x2="75" y2="305" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="290" x2="84" y2="303" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Arm (raised up in distress) -->
  <rect x="282" y="210" width="40" height="18" rx="9" fill="#c49a6c" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- arm tilted up -->
  <rect x="316" y="186" width="22" height="60" rx="9" transform="rotate(35 327 216)" fill="#c49a6c" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- right hand (raised) -->
  <ellipse cx="346" cy="188" rx="18" ry="14" fill="#d4af82" stroke="#3d2b1a" stroke-width="2.5" transform="rotate(35 346 188)"/>
  <!-- fingers up -->
  <line x1="334" y1="178" x2="330" y2="166" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="174" x2="338" y2="162" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="347" y1="172" x2="347" y2="160" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="354" y1="173" x2="356" y2="161" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="360" y1="177" x2="365" y2="166" stroke="#3d2b1a" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs -->
  <!-- Left leg -->
  <rect x="150" y="322" width="38" height="50" rx="10" fill="#a07848" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- Left foot -->
  <rect x="140" y="364" width="52" height="20" rx="8" fill="#7a5530" stroke="#3d2b1a" stroke-width="2.5"/>

  <!-- Right leg -->
  <rect x="212" y="322" width="38" height="50" rx="10" fill="#a07848" stroke="#3d2b1a" stroke-width="2.5"/>
  <!-- Right foot -->
  <rect x="208" y="364" width="52" height="20" rx="8" fill="#7a5530" stroke="#3d2b1a" stroke-width="2.5"/>

  <!-- Smoke puffs around head (overheating) -->
  <circle cx="140" cy="95" r="10" fill="#d8cdb8" opacity="0.6" stroke="#b0a090" stroke-width="1"/>
  <circle cx="128" cy="85" r="7" fill="#d8cdb8" opacity="0.5" stroke="#b0a090" stroke-width="1"/>
  <circle cx="118" cy="78" r="5" fill="#d8cdb8" opacity="0.35"/>

  <circle cx="262" cy="95" r="10" fill="#d8cdb8" opacity="0.6" stroke="#b0a090" stroke-width="1"/>
  <circle cx="274" cy="85" r="7" fill="#d8cdb8" opacity="0.5" stroke="#b0a090" stroke-width="1"/>
  <circle cx="283" cy="78" r="5" fill="#d8cdb8" opacity="0.35"/>

  <!-- Sparks near right side -->
  <path d="M290 220 L298 210 L294 218 L303 208" stroke="#f0c020" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M295 235 L305 224 L300 232 L311 221" stroke="#e05c2a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="392" rx="90" ry="10" fill="#c8b898" opacity="0.4"/>
</svg>
